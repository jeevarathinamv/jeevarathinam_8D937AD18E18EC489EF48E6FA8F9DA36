<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="parchment" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffdd0" />
      <stop offset="50%" stop-color="#f5e6b8" />
      <stop offset="100%" stop-color="#dfcaa0" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="#200609" />
  <rect x="30" y="30" width="740" height="440" rx="15" fill="url(#parchment)" stroke="#d4af37" stroke-width="4" />
  <rect x="45" y="45" width="710" height="410" rx="10" fill="none" stroke="#58111a" stroke-width="2" stroke-dasharray="8,4" />

  <!-- Header -->
  <text x="400" y="90" fill="#58111a" font-family="'Cinzel', serif" font-weight="bold" font-size="22" text-anchor="middle" letter-spacing="2">
    CHOLA IMPERIAL ADMINISTRATIVE SYSTEM
  </text>
  <text x="400" y="115" fill="#8c5825" font-family="sans-serif" font-size="12" text-anchor="middle" letter-spacing="1">
    Democratic Decentralization, Valanadu Provinces, and Land Cadastre (1000 CE)
  </text>

  <!-- Hierarchy Diagram -->
  <!-- Tier 1: Mandalam (Provinces) -->
  <g transform="translate(100, 150)">
    <rect width="180" height="70" rx="8" fill="#58111a" stroke="#d4af37" stroke-width="2" />
    <text x="90" y="30" fill="#ffe27a" font-family="'Cinzel', serif" font-weight="bold" font-size="14" text-anchor="middle">MANDALAM</text>
    <text x="90" y="52" fill="#fffdd0" font-family="sans-serif" font-size="11" text-anchor="middle">Imperial Provinces (e.g. Chola, Pandya, Sri Lanka)</text>
  </g>

  <!-- Arrow -->
  <path d="M 290 185 L 340 185" stroke="#8b0000" stroke-width="3" marker-end="url(#arrow)" />

  <!-- Tier 2: Valanadu (Districts) -->
  <g transform="translate(350, 150)">
    <rect width="180" height="70" rx="8" fill="#cd7f32" stroke="#58111a" stroke-width="2" />
    <text x="90" y="30" fill="#ffffff" font-family="'Cinzel', serif" font-weight="bold" font-size="14" text-anchor="middle">VALANADU</text>
    <text x="90" y="52" fill="#fffdd0" font-family="sans-serif" font-size="11" text-anchor="middle">Administrative Divisions Supervised by Senapathis</text>
  </g>

  <!-- Arrow -->
  <path d="M 540 185 L 590 185" stroke="#8b0000" stroke-width="3" />

  <!-- Tier 3: Nadu & Urs (Villages) -->
  <g transform="translate(600, 150)">
    <rect width="150" height="70" rx="8" fill="#8b0000" stroke="#d4af37" stroke-width="2" />
    <text x="75" y="30" fill="#ffe27a" font-family="'Cinzel', serif" font-weight="bold" font-size="14" text-anchor="middle">NADU / UR</text>
    <text x="75" y="52" fill="#fffdd0" font-family="sans-serif" font-size="11" text-anchor="middle">Autonomous Agrarian Village Communes</text>
  </g>

  <!-- Lower Section: Kudavolai & Land Survey Highlights -->
  <!-- Card 1 -->
  <g transform="translate(90, 260)">
    <rect width="290" height="150" rx="8" fill="#ffffff" stroke="#cd7f32" stroke-width="2" />
    <rect x="0" y="0" width="290" height="32" rx="8" fill="#58111a" />
    <text x="145" y="22" fill="#ffe27a" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">Kudavolai Electoral System</text>
    <text x="15" y="55" fill="#333333" font-family="sans-serif" font-size="11">
      <tspan x="15" dy="0">• Democratic election of Sabha village councilors</tspan>
      <tspan x="15" dy="20">• Secret ballot tokens drawn by innocent child</tspan>
      <tspan x="15" dy="20">• Strict qualification: Land ownership, Vedas</tspan>
      <tspan x="15" dy="20">• Disqualification for corruption or crime</tspan>
      <tspan x="15" dy="20">• Mandatory 3-year term rotation</tspan>
    </text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(420, 260)">
    <rect width="290" height="150" rx="8" fill="#ffffff" stroke="#cd7f32" stroke-width="2" />
    <rect x="0" y="0" width="290" height="32" rx="8" fill="#58111a" />
    <text x="145" y="22" fill="#ffe27a" font-family="sans-serif" font-weight="bold" font-size="13" text-anchor="middle">Ulagalantha Cholan Cadastre (1000 CE)</text>
    <text x="15" y="55" fill="#333333" font-family="sans-serif" font-size="11">
      <tspan x="15" dy="0">• Standard measuring rod (Veli, Ma, Kuli)</tspan>
      <tspan x="15" dy="20">• Classification into wet, dry, & garden lands</tspan>
      <tspan x="15" dy="20">• Public canal irrigation rights protected</tspan>
      <tspan x="15" dy="20">• Revenue exemptions for temple lands (Brahmadeya)</tspan>
      <tspan x="15" dy="20">• Accurate imperial records carved on stone walls</tspan>
    </text>
  </g>
</svg>
