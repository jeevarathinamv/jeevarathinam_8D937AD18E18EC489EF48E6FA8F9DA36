{% extends "base.html" %}

{% block title %}Add New Course - Admin Portal{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="bg-gradient-custom text-white text-center py-4 px-3">
                    <i class="bi bi-plus-circle-fill fs-1 text-warning mb-2 d-block"></i>
                    <h3 class="fw-bold mb-0">Add New Semester Course</h3>
                    <p class="small text-white-50 mb-0">Fill in course details to publish it for student registration</p>
                </div>
                <div class="card-body p-4 p-md-5">
                    <form action="{{ url_for('add_course') }}" method="POST">
                        <div class="mb-3">
                            <label for="course_name" class="form-label fw-semibold">Course Name</label>
                            <input type="text" class="form-control" id="course_name" name="course_name" placeholder="e.g. Advanced Java Programming" required>
                        </div>

                        <div class="mb-3">
                            <label for="course_code" class="form-label fw-semibold">Course Code</label>
                            <input type="text" class="form-control" id="course_code" name="course_code" placeholder="e.g. MCA101" required>
                        </div>

                        <div class="mb-3">
                            <label for="department" class="form-label fw-semibold">Department</label>
                            <select class="form-select" id="department" name="department" required>
                                <option value="" selected disabled>Select Department</option>
                                <option value="Computer Applications (MCA)">Computer Applications (MCA)</option>
                                <option value="Computer Science & Engineering">Computer Science & Engineering</option>
                                <option value="Information Technology">Information Technology</option>
                                <option value="Electrical & Electronics">Electrical & Electronics</option>
                                <option value="Mechanical Engineering">Mechanical Engineering</option>
                            </select>
                        </div>

                        <div class="row g-2 mb-3">
                            <div class="col-md-4">
                                <label for="semester" class="form-label fw-semibold">Semester</label>
                                <select class="form-select" id="semester" name="semester" required>
                                    <option value="" selected disabled>Semester</option>
                                    <option value="1">Semester 1</option>
                                    <option value="2">Semester 2</option>
                                    <option value="3">Semester 3</option>
                                    <option value="4">Semester 4</option>
                                    <option value="5">Semester 5</option>
                                    <option value="6">Semester 6</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label for="course_type" class="form-label fw-semibold">Course Type</label>
                                <select class="form-select" id="course_type" name="course_type" required>
                                    <option value="" selected disabled>Type</option>
                                    <option value="Core">Core</option>
                                    <option value="Elective">Elective</option>
                                    <option value="Practical">Practical</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label for="credits" class="form-label fw-semibold">Credits</label>
                                <input type="number" class="form-control" id="credits" name="credits" min="1" max="10" value="3" required>
                            </div>
                        </div>

                        <div class="d-flex gap-2 pt-3">
                            <a href="{{ url_for('manage_courses') }}" class="btn btn-outline-secondary rounded-pill w-50 py-2">Cancel</a>
                            <button type="submit" class="btn btn-purple rounded-pill w-50 py-2 fw-bold shadow-sm">
                                <i class="bi bi-check-circle-fill me-1"></i> Add Course
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
