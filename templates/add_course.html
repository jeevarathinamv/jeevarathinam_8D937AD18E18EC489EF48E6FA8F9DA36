{% extends 'base.html' %}

{% block title %}Add Course - EduTrack Hub{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">
            <div class="card shadow-lg border-0">
                <div class="card-body p-4 p-md-5">
                    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom border-white border-opacity-10 pb-3">
                        <div>
                            <h2 class="fw-bold gradient-text mb-1">📚 Add New Course</h2>
                            <p class="text-white-50 small mb-0">Record your course details and status</p>
                        </div>
                        <a href="{{ url_for('courses') }}" class="btn btn-outline-glow btn-sm">
                            <i class="bi bi-arrow-left me-1"></i> Back to Courses
                        </a>
                    </div>

                    <form method="POST" action="{{ url_for('add_course') }}">
                        <div class="mb-3">
                            <label for="course_name" class="form-label">
                                <i class="bi bi-book me-1 text-info"></i> Course Name *
                            </label>
                            <input type="text" class="form-control" id="course_name" name="course_name" placeholder="e.g. Full Stack Web Development" required>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="course_provider" class="form-label">
                                    <i class="bi bi-building me-1 text-warning"></i> Course Provider *
                                </label>
                                <input type="text" class="form-control" id="course_provider" name="course_provider" placeholder="e.g. Coursera, NPTEL, Udemy" required>
                            </div>
                            <div class="col-md-6">
                                <label for="course_category" class="form-label">
                                    <i class="bi bi-tags me-1 text-pink" style="color: #f472b6;"></i> Category *
                                </label>
                                <input type="text" class="form-control" id="course_category" name="course_category" placeholder="e.g. Computer Science, AI, Design" required>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="start_date" class="form-label">
                                    <i class="bi bi-calendar-event me-1 text-primary"></i> Start Date *
                                </label>
                                <input type="date" class="form-control" id="start_date" name="start_date" required>
                            </div>
                            <div class="col-md-6">
                                <label for="end_date" class="form-label">
                                    <i class="bi bi-calendar-check me-1 text-success"></i> End Date (Optional)
                                </label>
                                <input type="date" class="form-control" id="end_date" name="end_date">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="course_status" class="form-label">
                                <i class="bi bi-flag me-1 text-warning"></i> Course Status *
                            </label>
                            <select class="form-select" id="course_status" name="course_status" required>
                                <option value="Ongoing" selected>⏳ Ongoing</option>
                                <option value="Completed">✅ Completed</option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label for="course_link" class="form-label">
                                <i class="bi bi-link-45deg me-1 text-info"></i> Course Link (URL)
                            </label>
                            <input type="url" class="form-control" id="course_link" name="course_link" placeholder="e.g. https://coursera.org/learn/your-course">
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-gradient-primary fw-bold px-4 flex-grow-1">
                                <i class="bi bi-check-circle me-1"></i> Save Course
                            </button>
                            <a href="{{ url_for('courses') }}" class="btn btn-outline-secondary text-white px-4">
                                Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
