{% extends "base.html" %}

{% block title %}Add Student - College Admission System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-7">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white py-3">
                <h4 class="mb-0 fw-bold"><i class="bi bi-person-plus-fill me-2"></i>Add New Student</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="{{ url_for('add_student') }}">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="application_no" class="form-label fw-semibold">Application No <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="application_no" name="application_no" required placeholder="e.g. APP2025001">
                        </div>
                        <div class="col-md-6">
                            <label for="name" class="form-label fw-semibold">Student Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="name" name="name" required placeholder="Full Name">
                        </div>

                        <div class="col-md-6">
                            <label for="gender" class="form-label fw-semibold">Gender <span class="text-danger">*</span></label>
                            <select class="form-select" id="gender" name="gender" required>
                                <option value="" disabled selected>Select Gender</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label for="community" class="form-label fw-semibold">Community <span class="text-danger">*</span></label>
                            <select class="form-select" id="community" name="community" required>
                                <option value="" disabled selected>Select Community</option>
                                <option value="OC">OC</option>
                                <option value="BC">BC</option>
                                <option value="BCM">BCM</option>
                                <option value="MBC">MBC</option>
                                <option value="SC">SC</option>
                                <option value="SCA">SCA</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label for="marks" class="form-label fw-semibold">Marks <span class="text-danger">*</span></label>
                            <input type="number" step="0.01" min="0" max="100" class="form-control" id="marks" name="marks" required placeholder="e.g. 88.5">
                        </div>

                        <div class="col-md-6">
                            <label for="rank_no" class="form-label fw-semibold">Rank No <span class="text-danger">*</span></label>
                            <input type="number" min="1" class="form-control" id="rank_no" name="rank_no" required placeholder="e.g. 1">
                        </div>

                        <div class="col-12">
                            <label for="remark" class="form-label fw-semibold">Remark</label>
                            <textarea class="form-control" id="remark" name="remark" rows="3" placeholder="Optional comments..."></textarea>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a href="{{ url_for('view_students') }}" class="btn btn-outline-secondary px-4">
                            <i class="bi bi-x-circle me-1"></i> Cancel
                        </a>
                        <button type="submit" class="btn btn-primary px-4">
                            <i class="bi bi-check-circle me-1"></i> Save Student
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
