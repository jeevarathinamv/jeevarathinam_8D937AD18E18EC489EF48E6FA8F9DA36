{% extends 'base.html' %}

{% block title %}Edit Computer - Lab Fault Reporter{% endblock %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-md-7 col-lg-6">
        <div class="card custom-card shadow-sm border-0">
            <div class="card-header bg-primary text-white py-3 rounded-top text-center">
                <h4 class="mb-0 fw-bold"><i class="bi bi-pencil-square me-2"></i> Edit Computer {{ computer.computer_number }}</h4>
            </div>
            <div class="card-body p-4">
                <form action="{{ url_for('edit_computer', computer_id=computer.id) }}" method="POST">
                    <div class="mb-3">
                        <label for="computer_number" class="form-label fw-semibold"><i class="bi bi-tag me-1"></i> Computer Number</label>
                        <input type="text" class="form-control" id="computer_number" name="computer_number" value="{{ computer.computer_number }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="lab_name" class="form-label fw-semibold"><i class="bi bi-building me-1"></i> Lab Name</label>
                        <input type="text" class="form-control" id="lab_name" name="lab_name" value="{{ computer.lab_name }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="computer_name" class="form-label fw-semibold"><i class="bi bi-cpu me-1"></i> Computer Model / Specification</label>
                        <input type="text" class="form-control" id="computer_name" name="computer_name" value="{{ computer.computer_name }}" required>
                    </div>

                    <div class="mb-3">
                        <label for="ip_address" class="form-label fw-semibold"><i class="bi bi-hdd-network me-1"></i> IP Address</label>
                        <input type="text" class="form-control" id="ip_address" name="ip_address" value="{{ computer.ip_address }}" required>
                    </div>

                    <div class="mb-4">
                        <label for="status" class="form-label fw-semibold"><i class="bi bi-info-circle me-1"></i> Computer Status</label>
                        <select class="form-select" id="status" name="status" required>
                            <option value="Working" {% if computer.status == 'Working' %}selected{% endif %}>Working</option>
                            <option value="Faulty" {% if computer.status == 'Faulty' %}selected{% endif %}>Faulty</option>
                            <option value="Under Maintenance" {% if computer.status == 'Under Maintenance' %}selected{% endif %}>Under Maintenance</option>
                        </select>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg fw-bold">
                            <i class="bi bi-check-lg me-1"></i> Update Computer Details
                        </button>
                    </div>
                </form>
            </div>
            <div class="card-footer bg-light py-3 text-center">
                <a href="{{ url_for('manage_computers') }}" class="text-secondary text-decoration-none">
                    <i class="bi bi-arrow-left me-1"></i> Back to Computers List
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
