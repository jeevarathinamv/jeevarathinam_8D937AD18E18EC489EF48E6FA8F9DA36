{% extends "base.html" %}

{% block title %}Edit Supplier - Business Supplier & Purchase Management System{% endblock %}

{% block content %}
<div class="container py-3">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="card card-custom p-4 shadow-lg">
                <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                    <h3 class="fw-bold text-dark mb-0">
                        <i class="bi bi-pencil-square text-indigo me-2"></i>Edit Supplier Details
                    </h3>
                    <a href="{{ url_for('suppliers') }}" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
                        <i class="bi bi-arrow-left me-1"></i> Back to Suppliers
                    </a>
                </div>

                <form action="{{ url_for('edit_supplier', id=supplier.id) }}" method="POST">
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="supplier_name" class="form-label fw-semibold">Supplier Name (Contact Person) <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="supplier_name" name="supplier_name" value="{{ supplier.supplier_name }}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="company_name" class="form-label fw-semibold">Company Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="company_name" name="company_name" value="{{ supplier.company_name }}" required>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="phone" class="form-label fw-semibold">Phone Number <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="phone" name="phone" value="{{ supplier.phone }}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="email" class="form-label fw-semibold">Email Address <span class="text-danger">*</span></label>
                            <input type="email" class="form-control" id="email" name="email" value="{{ supplier.email }}" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="address" class="form-label fw-semibold">Address</label>
                        <textarea class="form-control" id="address" name="address" rows="3">{{ supplier.address }}</textarea>
                    </div>

                    <div class="mb-4">
                        <label for="status" class="form-label fw-semibold">Supplier Status</label>
                        <select class="form-select" id="status" name="status">
                            <option value="Active" {% if supplier.status == 'Active' %}selected{% endif %}>Active</option>
                            <option value="Inactive" {% if supplier.status == 'Inactive' %}selected{% endif %}>Inactive</option>
                        </select>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('suppliers') }}" class="btn btn-light px-4 fw-semibold">Cancel</a>
                        <button type="submit" class="btn btn-indigo px-4 fw-semibold">
                            <i class="bi bi-save-fill me-1"></i> Update Supplier
                        </button>
                    </div>
                </form>
            </div>

        </div>
    </div>
</div>
{% endblock %}
