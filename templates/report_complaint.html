{% extends 'base.html' %}

{% block title %}Report Water Complaint - WaterCare System{% endblock %}

{% block content %}
<div class="container my-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-header bg-theme text-white p-4 rounded-top-4">
                    <div class="d-flex align-items-center">
                        <div class="bg-white text-teal rounded-circle p-2 me-3 d-flex align-items-center justify-content-center" style="width: 45px; height: 45px;">
                            <i class="bi bi-droplet-half fs-4"></i>
                        </div>
                        <div>
                            <h4 class="mb-0 fw-bold">Report Drinking Water Complaint</h4>
                            <p class="mb-0 small text-light opacity-90">Submit drinking water issues for quick maintenance resolution</p>
                        </div>
                    </div>
                </div>

                <div class="card-body p-4">
                    <form action="{{ url_for('report_complaint') }}" method="POST" class="needs-validation" novalidate>

                        <!-- Complaint Type -->
                        <div class="mb-3">
                            <label for="complaint_type" class="form-label fw-semibold">Complaint Type <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-list-ul text-teal"></i></span>
                                <select class="form-select bg-light border-start-0" id="complaint_type" name="complaint_type" required>
                                    <option value="" selected disabled>-- Select Water Issue Type --</option>
                                    <option value="No Water">No Water</option>
                                    <option value="Water Leakage">Water Leakage</option>
                                    <option value="Water Quality Problem">Water Quality Problem</option>
                                    <option value="Water Cooler Problem">Water Cooler Problem</option>
                                    <option value="RO Problem">RO Problem</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>
                        </div>

                        <!-- Location -->
                        <div class="mb-3">
                            <label for="location" class="form-label fw-semibold">Location / Campus Block <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-geo-alt text-teal"></i></span>
                                <input type="text" class="form-control bg-light border-start-0" id="location" name="location" placeholder="e.g., 2nd Floor Science Block / Hostel A Water Station" required>
                            </div>
                        </div>

                        <!-- Complaint Date -->
                        <div class="mb-3">
                            <label for="complaint_date" class="form-label fw-semibold">Complaint Date <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-calendar-event text-teal"></i></span>
                                <input type="date" class="form-control bg-light border-start-0" id="complaint_date" name="complaint_date" value="{{ today }}" required>
                            </div>
                        </div>

                        <!-- Problem Description -->
                        <div class="mb-4">
                            <label for="description" class="form-label fw-semibold">Problem Description <span class="text-danger">*</span></label>
                            <textarea class="form-control bg-light" id="description" name="description" rows="4" placeholder="Describe the water problem in detail (e.g., tap leaking heavily, water cooler not cooling, filter warning light blinking)..." required></textarea>
                        </div>

                        <!-- Submit Buttons -->
                        <div class="d-flex justify-content-between align-items-center">
                            <a href="{{ url_for('student_dashboard') }}" class="btn btn-outline-secondary rounded-pill px-4">
                                <i class="bi bi-arrow-left me-1"></i>Cancel
                            </a>
                            <button type="submit" class="btn btn-emerald rounded-pill px-4 fw-semibold shadow-sm">
                                <i class="bi bi-send me-2"></i>Submit Complaint
                            </button>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
