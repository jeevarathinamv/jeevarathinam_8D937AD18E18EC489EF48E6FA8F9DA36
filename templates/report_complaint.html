{% extends "base.html" %}

{% block title %}Report Classroom Complaint - Classroom Maintenance Complaint Tracker{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-7">
        <div class="card card-custom p-4 my-3">
            <div class="border-bottom pb-3 mb-4">
                <h3 class="fw-bold text-primary mb-1">
                    <i class="fa-solid fa-pen-to-square me-2"></i>Report Classroom Maintenance Complaint
                </h3>
                <p class="text-muted mb-0">Fill in the details below to submit a maintenance complaint.</p>
            </div>

            <form action="{{ url_for('report_complaint') }}" method="POST" class="needs-validation" novalidate>
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="classroom_number" class="form-label fw-bold">Classroom / Lab Number</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-door-closed"></i></span>
                            <input type="text" class="form-control" id="classroom_number" name="classroom_number" placeholder="e.g., Room 302, Lab 2" required>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label for="complaint_type" class="form-label fw-bold">Complaint Type</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-list-check"></i></span>
                            <select class="form-select" id="complaint_type" name="complaint_type" required>
                                <option value="" disabled selected>Select Complaint Type</option>
                                <option value="Fan Problem">Fan Problem</option>
                                <option value="Light Problem">Light Problem</option>
                                <option value="Desk/Chair Problem">Desk/Chair Problem</option>
                                <option value="Door/Window Problem">Door/Window Problem</option>
                                <option value="Projector Problem">Projector Problem</option>
                                <option value="AC Problem">AC Problem</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>

                    <div class="col-md-6">
                        <label for="complaint_date" class="form-label fw-bold">Complaint Date</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fa-solid fa-calendar-days"></i></span>
                            <input type="date" class="form-control" id="complaint_date" name="complaint_date" value="{{ today }}" required>
                        </div>
                    </div>

                    <div class="col-12">
                        <label for="description" class="form-label fw-bold">Problem Description</label>
                        <textarea class="form-control" id="description" name="description" rows="4" placeholder="Describe the maintenance issue clearly..." required></textarea>
                    </div>
                </div>

                <div class="d-flex justify-content-between align-items-center mt-4 pt-2 border-top">
                    <a href="{{ url_for('student_dashboard') }}" class="btn btn-outline-secondary">
                        <i class="fa-solid fa-arrow-left me-1"></i> Back to Dashboard
                    </a>
                    <button type="submit" class="btn btn-orange px-4 py-2">
                        <i class="fa-solid fa-paper-plane me-2"></i> Submit Complaint
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
