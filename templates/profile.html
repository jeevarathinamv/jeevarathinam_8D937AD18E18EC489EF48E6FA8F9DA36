{% extends 'base.html' %}

{% block title %}Manage Profile - Student Portfolio Generator{% endblock %}

{% block content %}
<div class="row justify-content-center py-2">
    <div class="col-lg-10">
        <div class="card card-sky p-4 shadow-lg border-0">
            <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
                <h3 class="fw-bold text-dark mb-0"><i class="bi bi-person-gear text-cyan me-2"></i> Manage Profile</h3>
                <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i> Back to Dashboard</a>
            </div>

            <form action="{{ url_for('profile') }}" method="POST" enctype="multipart/form-data">
                <div class="row g-4">
                    <!-- Photo & Basic Info -->
                    <div class="col-md-4 text-center border-end">
                        <div class="mb-3">
                            <img src="{{ url_for('static', filename='uploads/' + (profile.profile_photo if profile and profile.profile_photo else 'default_avatar.png')) }}"
                                 alt="Profile Photo"
                                 class="profile-img-lg mb-3"
                                 onerror="this.src='https://via.placeholder.com/140?text=User'">
                            <div>
                                <label for="profile_photo" class="form-label fw-semibold text-dark small"><i class="bi bi-camera me-1"></i> Change Profile Photo</label>
                                <input type="file" class="form-control form-control-sm form-control-custom" id="profile_photo" name="profile_photo" accept="image/*">
                            </div>
                        </div>

                        <div class="mb-3 text-start">
                            <label for="name" class="form-label fw-semibold"><i class="bi bi-person me-1"></i> Student Name</label>
                            <input type="text" class="form-control form-control-custom" id="name" name="name" value="{{ student.name }}" required>
                        </div>

                        <div class="mb-3 text-start">
                            <label for="department" class="form-label fw-semibold"><i class="bi bi-building me-1"></i> Department</label>
                            <input type="text" class="form-control form-control-custom" id="department" name="department" value="{{ student.department }}" required>
                        </div>

                        <div class="mb-3 text-start">
                            <label class="form-label fw-semibold"><i class="bi bi-card-heading me-1"></i> Register Number</label>
                            <input type="text" class="form-control form-control-custom bg-light" value="{{ student.register_number }}" readonly>
                        </div>

                        <div class="mb-3 text-start">
                            <label class="form-label fw-semibold"><i class="bi bi-envelope me-1"></i> Email</label>
                            <input type="email" class="form-control form-control-custom bg-light" value="{{ student.email }}" readonly>
                        </div>
                    </div>

                    <!-- Profile Bio & Contact Links -->
                    <div class="col-md-8">
                        <div class="mb-3">
                            <label for="about_me" class="form-label fw-semibold"><i class="bi bi-card-text me-1"></i> About Me</label>
                            <textarea class="form-control form-control-custom" id="about_me" name="about_me" rows="3" placeholder="Write a short summary about yourself, your passion, and goals...">{{ profile.about_me or '' }}</textarea>
                        </div>

                        <div class="mb-3">
                            <label for="career_objective" class="form-label fw-semibold"><i class="bi bi-bullseye me-1"></i> Career Objective</label>
                            <textarea class="form-control form-control-custom" id="career_objective" name="career_objective" rows="2" placeholder="State your professional objective and aspirations...">{{ profile.career_objective or '' }}</textarea>
                        </div>

                        <div class="mb-3">
                            <label for="hobbies" class="form-label fw-semibold"><i class="bi bi-heart me-1"></i> Hobbies & Interests</label>
                            <input type="text" class="form-control form-control-custom" id="hobbies" name="hobbies" value="{{ profile.hobbies or '' }}" placeholder="e.g. Coding, Reading Tech Blogs, Chess, Photography">
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="phone" class="form-label fw-semibold"><i class="bi bi-telephone me-1"></i> Contact Phone</label>
                                <input type="text" class="form-control form-control-custom" id="phone" name="phone" value="{{ profile.phone or '' }}" placeholder="+91 9876543210">
                            </div>
                            <div class="col-md-6">
                                <label for="address" class="form-label fw-semibold"><i class="bi bi-geo-alt me-1"></i> Location / City</label>
                                <input type="text" class="form-control form-control-custom" id="address" name="address" value="{{ profile.address or '' }}" placeholder="e.g. Chennai, India">
                            </div>
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label for="linkedin_url" class="form-label fw-semibold"><i class="bi bi-linkedin text-primary me-1"></i> LinkedIn Profile URL</label>
                                <input type="url" class="form-control form-control-custom" id="linkedin_url" name="linkedin_url" value="{{ profile.linkedin_url or '' }}" placeholder="https://linkedin.com/in/username">
                            </div>
                            <div class="col-md-6">
                                <label for="github_url" class="form-label fw-semibold"><i class="bi bi-github me-1"></i> GitHub Profile URL</label>
                                <input type="url" class="form-control form-control-custom" id="github_url" name="github_url" value="{{ profile.github_url or '' }}" placeholder="https://github.com/username">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-cyan px-4 py-2">
                            <i class="bi bi-save me-1"></i> Save Profile Details
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
