{% extends 'base.html' %}

{% block title %}Add New Project - Student Portal{% endblock %}

{% block content %}
<div class="row justify-content-center py-3">
    <div class="col-md-8">
        <div class="card glass-card p-4 p-md-5">
            <div class="d-flex align-items-center gap-2 border-bottom pb-3 mb-4">
                <i class="bi bi-plus-circle-fill fs-2 text-primary"></i>
                <h3 class="fw-bold text-dark mb-0">Add New Freelance Project</h3>
            </div>

            <form action="{{ url_for('add_project') }}" method="POST">
                <div class="mb-3">
                    <label for="title" class="form-label font-weight-bold">Project Title *</label>
                    <input type="text" class="form-control" id="title" name="title" placeholder="e.g. E-Commerce Website Development" required>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="client_id" class="form-label font-weight-bold">Select Client (Optional)</label>
                        <select class="form-select" id="client_id" name="client_id">
                            <option value="">-- Select Saved Client --</option>
                            {% for client in clients %}
                                <option value="{{ client.id }}">{{ client.name }} {% if client.company_name %}({{ client.company_name }}){% endif %}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="client_name" class="form-label font-weight-bold">Client Name (if not selected above)</label>
                        <input type="text" class="form-control" id="client_name" name="client_name" placeholder="e.g. Acme Corp / John Doe">
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="category" class="form-label font-weight-bold">Category</label>
                        <input type="text" class="form-control" id="category" name="category" placeholder="e.g. Web Dev, Graphic Design, Mobile App">
                    </div>
                    <div class="col-md-6">
                        <label for="budget" class="form-label font-weight-bold">Budget (₹)</label>
                        <input type="number" step="0.01" class="form-control" id="budget" name="budget" value="0.00" placeholder="0.00">
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="start_date" class="form-label font-weight-bold">Start Date</label>
                        <input type="date" class="form-control" id="start_date" name="start_date">
                    </div>
                    <div class="col-md-6">
                        <label for="deadline" class="form-label font-weight-bold">Deadline</label>
                        <input type="date" class="form-control" id="deadline" name="deadline">
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="status" class="form-label font-weight-bold">Initial Project Status</label>
                        <select class="form-select" id="status" name="status">
                            <option value="New" selected>New</option>
                            <option value="In Progress">In Progress</option>
                            <option value="On Hold">On Hold</option>
                            <option value="Completed">Completed</option>
                            <option value="Cancelled">Cancelled</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="progress_percentage" class="form-label font-weight-bold">Initial Progress Percentage (%)</label>
                        <input type="number" min="0" max="100" class="form-control" id="progress_percentage" name="progress_percentage" value="0">
                    </div>
                </div>

                <div class="mb-4">
                    <label for="description" class="form-label font-weight-bold">Project Description</label>
                    <textarea class="form-control" id="description" name="description" rows="3" placeholder="Overview of deliverables and client expectations..."></textarea>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-cobalt px-4 py-2"><i class="bi bi-check-circle me-1"></i> Save Project</button>
                    <a href="{{ url_for('projects') }}" class="btn btn-outline-secondary px-4 py-2">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
