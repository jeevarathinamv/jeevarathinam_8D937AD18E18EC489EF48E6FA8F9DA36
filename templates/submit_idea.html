{% extends "base.html" %}

{% block title %}Submit Entrepreneurship Idea | College Entrepreneurship Portal{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-10">
        <div class="card card-custom shadow-lg">
            <div class="card-header card-petrol-header p-3">
                <h4 class="mb-0 text-white"><i class="bi bi-lightbulb-fill text-warning me-2"></i> Submit Entrepreneurship Idea</h4>
                <small class="text-white-50">Fill in all details carefully. A unique Idea ID will be generated upon submission.</small>
            </div>
            <div class="card-body p-4">

                <form action="{{ url_for('submit_idea') }}" method="POST" class="needs-validation" novalidate>

                    <!-- Student Metadata Section -->
                    <div class="bg-light p-3 rounded-3 mb-4 border">
                        <div class="row g-3">
                            <div class="col-md-4">
                                <label class="form-label text-muted small mb-1 fw-bold">Student Name</label>
                                <input type="text" class="form-control bg-white" value="{{ student.name }}" readonly>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label text-muted small mb-1 fw-bold">Register Number</label>
                                <input type="text" class="form-control bg-white" value="{{ student.register_number }}" readonly>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label text-muted small mb-1 fw-bold">Submission Date</label>
                                <input type="text" class="form-control bg-white" value="{{ today_str }}" readonly>
                            </div>
                        </div>
                    </div>

                    <div class="row g-3">
                        <div class="col-md-8">
                            <label for="title" class="form-label fw-bold">Idea Title <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="title" name="title" placeholder="e.g. Smart AgriTech Solar Crop Dryer" required>
                        </div>

                        <div class="col-md-4">
                            <label for="category" class="form-label fw-bold">Business Category <span class="text-danger">*</span></label>
                            <select class="form-select" id="category" name="category" required>
                                <option value="" selected disabled>Select Category</option>
                                <option value="Technology">Technology</option>
                                <option value="Education">Education</option>
                                <option value="Healthcare">Healthcare</option>
                                <option value="Agriculture">Agriculture</option>
                                <option value="Food">Food</option>
                                <option value="E-Commerce">E-Commerce</option>
                                <option value="Finance">Finance</option>
                                <option value="Environment">Environment</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label for="problem_statement" class="form-label fw-bold">Problem Statement <span class="text-danger">*</span></label>
                            <textarea class="form-control" id="problem_statement" name="problem_statement" rows="3" placeholder="Describe the specific real-world problem or gap your idea addresses..." required></textarea>
                        </div>

                        <div class="col-12">
                            <label for="proposed_solution" class="form-label fw-bold">Proposed Solution <span class="text-danger">*</span></label>
                            <textarea class="form-control" id="proposed_solution" name="proposed_solution" rows="3" placeholder="Explain your product or service solution and how it works..." required></textarea>
                        </div>

                        <div class="col-md-6">
                            <label for="target_customers" class="form-label fw-bold">Target Customers <span class="text-danger">*</span></label>
                            <textarea class="form-control" id="target_customers" name="target_customers" rows="2" placeholder="Who are your intended buyers or users? (e.g. Small farmers, College students)" required></textarea>
                        </div>

                        <div class="col-md-6">
                            <label for="required_resources" class="form-label fw-bold">Required Resources <span class="text-danger">*</span></label>
                            <textarea class="form-control" id="required_resources" name="required_resources" rows="2" placeholder="Lab facilities, hardware components, software tools, mentoring..." required></textarea>
                        </div>

                        <div class="col-md-6">
                            <label for="estimated_budget" class="form-label fw-bold">Estimated Budget <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="estimated_budget" name="estimated_budget" placeholder="e.g. ₹50,000 or $1,000" required>
                        </div>

                        <div class="col-md-6">
                            <label for="expected_benefits" class="form-label fw-bold">Expected Benefits / Impact <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="expected_benefits" name="expected_benefits" placeholder="e.g. Reduces post-harvest loss by 40%" required>
                        </div>
                    </div>

                    <hr class="my-4">

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('student_dashboard') }}" class="btn btn-outline-secondary">
                            <i class="bi bi-x-circle me-1"></i> Cancel
                        </a>
                        <button type="submit" class="btn btn-coral px-4">
                            <i class="bi bi-send-fill me-1"></i> Submit Idea
                        </button>
                    </div>

                </form>

            </div>
        </div>
    </div>
</div>
{% endblock %}
