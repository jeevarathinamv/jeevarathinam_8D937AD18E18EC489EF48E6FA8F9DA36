{% extends 'base.html' %}

{% block title %}Add New Workshop - Skill Workshop Portal{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="mb-3">
        <a href="{{ url_for('manage_workshops') }}" class="text-indigo text-decoration-none fw-semibold">
            <i class="bi bi-arrow-left me-1"></i> Back to Manage Workshops
        </a>
    </div>

    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0 shadow-custom p-4 p-md-5 rounded-4">
                <div class="mb-4 border-bottom pb-3">
                    <h3 class="fw-bold text-dark mb-1"><i class="bi bi-plus-circle text-indigo me-2"></i>Add New Workshop</h3>
                    <p class="text-muted small mb-0">Fill in details to schedule and publish a new skill workshop</p>
                </div>

                <form action="{{ url_for('add_workshop') }}" method="POST" class="needs-validation" novalidate>
                    <div class="row g-3 mb-3">
                        <div class="col-md-8">
                            <label for="title" class="form-label fw-semibold">Workshop Title</label>
                            <input type="text" class="form-control" id="title" name="title" placeholder="e.g. Mastering Python & Flask Framework" required>
                        </div>
                        <div class="col-md-4">
                            <label for="category" class="form-label fw-semibold">Skill Category</label>
                            <select class="form-select" id="category" name="category" required>
                                <option value="" selected disabled>Select Category</option>
                                {% for cat in categories %}
                                    <option value="{{ cat }}">{{ cat }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label fw-semibold">Description</label>
                        <textarea class="form-control" id="description" name="description" rows="3" placeholder="Provide overview, topics covered, target audience..." required></textarea>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="trainer_name" class="form-label fw-semibold">Trainer Name</label>
                            <input type="text" class="form-control" id="trainer_name" name="trainer_name" placeholder="e.g. Prof. Ramesh Kumar" required>
                        </div>
                        <div class="col-md-6">
                            <label for="venue" class="form-label fw-semibold">Venue / Location</label>
                            <input type="text" class="form-control" id="venue" name="venue" placeholder="e.g. Seminar Hall A, CS Dept" required>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-4">
                            <label for="date" class="form-label fw-semibold">Workshop Date</label>
                            <input type="date" class="form-control" id="date" name="date" required>
                        </div>
                        <div class="col-md-4">
                            <label for="time" class="form-label fw-semibold">Time Schedule</label>
                            <input type="text" class="form-control" id="time" name="time" placeholder="e.g. 10:00 AM - 01:00 PM" required>
                        </div>
                        <div class="col-md-4">
                            <label for="total_seats" class="form-label fw-semibold">Total Capacity (Seats)</label>
                            <input type="number" class="form-control" id="total_seats" name="total_seats" value="30" min="1" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="status" class="form-label fw-semibold">Status</label>
                        <select class="form-select" id="status" name="status" required>
                            <option value="Upcoming" selected>Upcoming</option>
                            <option value="Completed">Completed</option>
                            <option value="Cancelled">Cancelled</option>
                        </select>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-indigo px-4 py-2 fw-semibold rounded-pill">
                            <i class="bi bi-check-circle me-1"></i> Create Workshop
                        </button>
                        <a href="{{ url_for('manage_workshops') }}" class="btn btn-outline-secondary px-4 py-2 rounded-pill">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
