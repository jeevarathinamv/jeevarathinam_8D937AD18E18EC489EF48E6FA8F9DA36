{% extends 'base.html' %}

{% block title %}Edit Customer - Small Business System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-7">
        <div class="card shadow-lg">
            <div class="card-header-custom">
                <h4 class="mb-0"><i class="bi bi-pencil-square me-2"></i> Edit Customer</h4>
            </div>
            <div class="card-body p-4 bg-white">
                <form action="{{ url_for('edit_customer', customer_id=customer.id) }}" method="POST">
                    <div class="mb-3">
                        <label for="name" class="form-label fw-semibold">Customer Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="name" name="name" value="{{ customer.name }}" required>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="phone" class="form-label fw-semibold">Phone Number <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="phone" name="phone" value="{{ customer.phone }}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="email" class="form-label fw-semibold">Email Address <span class="text-danger">*</span></label>
                            <input type="email" class="form-control" id="email" name="email" value="{{ customer.email }}" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="address" class="form-label fw-semibold">Address <span class="text-danger">*</span></label>
                        <textarea class="form-control" id="address" name="address" rows="3" required>{{ customer.address }}</textarea>
                    </div>

                    <div class="mb-4">
                        <label for="customer_type" class="form-label fw-semibold">Customer Type</label>
                        <select class="form-select" id="customer_type" name="customer_type">
                            <option value="New" {% if customer.customer_type == 'New' %}selected{% endif %}>New</option>
                            <option value="Regular" {% if customer.customer_type == 'Regular' %}selected{% endif %}>Regular</option>
                            <option value="VIP" {% if customer.customer_type == 'VIP' %}selected{% endif %}>VIP</option>
                        </select>
                    </div>

                    <div class="d-flex justify-content-between align-items-center">
                        <a href="{{ url_for('customers') }}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left me-1"></i> Cancel
                        </a>
                        <button type="submit" class="btn btn-royal">
                            <i class="bi bi-check-circle me-1"></i> Update Customer
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
