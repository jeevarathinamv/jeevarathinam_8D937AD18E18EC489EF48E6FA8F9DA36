{% extends 'base.html' %}

{% block title %}Edit Project - Student Portal{% endblock %}

{% block content %}
<div class="row justify-content-center py-3">
    <div class="col-md-8">
        <div class="card glass-card p-4 p-md-5">
            <div class="d-flex align-items-center gap-2 border-bottom pb-3 mb-4">
                <i class="bi bi-pencil-square fs-2 text-primary"></i>
                <h3 class="fw-bold text-dark mb-0">Edit Project Details</h3>
            </div>

            <form action="{{ url_for('edit_project', project_id=project.id) }}" method="POST">
                <div class="mb-3">
                    <label for="title" class="form-label font-weight-bold">Project Title *</label>
                    <input type="text" class="form-control" id="title" name="title" value="{{ project.title }}" required>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="client_id" class="form-label font-weight-bold">Select Client</label>
                        <select class="form-select" id="client_id" name="client_id">
                            <option value="">-- Select Saved Client --</option>
                            {% for client in clients %}
                                <option value="{{ client.id }}" {% if project.client_id == client.id %}selected{% endif %}>{{ client.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="client_name" class="form-label font-weight-bold">Client Name Override</label>
                        <input type="text" class="form-control" id="client_name" name="client_name" value="{{ project.client_name }}">
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="category" class="form-label font-weight-bold">Category</label>
                        <input type="text" class="form-control" id="category" name="category" value="{{ project.category or '' }}">
                    </div>
                    <div class="col-md-6">
                        <label for="budget" class="form-label font-weight-bold">Budget (₹)</label>
                        <input type="number" step="0.01" class="form-control" id="budget" name="budget" value="{{ project.budget }}">
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="start_date" class="form-label font-weight-bold">Start Date</label>
                        <input type="date" class="form-control" id="start_date" name="start_date" value="{{ project.start_date or '' }}">
                    </div>
                    <div class="col-md-6">
                        <label for="deadline" class="form-label font-weight-bold">Deadline</label>
                        <input type="date" class="form-control" id="deadline" name="deadline" value="{{ project.deadline or '' }}">
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="status" class="form-label font-weight-bold">Status</label>
                        <select class="form-select" id="status" name="status">
                            <option value="New" {% if project.status == 'New' %}selected{% endif %}>New</option>
                            <option value="In Progress" {% if project.status == 'In Progress' %}selected{% endif %}>In Progress</option>
                            <option value="On Hold" {% if project.status == 'On Hold' %}selected{% endif %}>On Hold</option>
                            <option value="Completed" {% if project.status == 'Completed' %}selected{% endif %}>Completed</option>
                            <option value="Cancelled" {% if project.status == 'Cancelled' %}selected{% endif %}>Cancelled</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="progress_percentage" class="form-label font-weight-bold">Progress Percentage (%)</label>
                        <input type="number" min="0" max="100" class="form-control" id="progress_percentage" name="progress_percentage" value="{{ project.progress_percentage }}">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label font-weight-bold">Project Description</label>
                    <textarea class="form-control" id="description" name="description" rows="3">{{ project.description or '' }}</textarea>
                </div>

                <div class="mb-4">
                    <label for="progress_notes" class="form-label font-weight-bold">Progress Notes</label>
                    <textarea class="form-control" id="progress_notes" name="progress_notes" rows="2" placeholder="Recent updates or status notes...">{{ project.progress_notes or '' }}</textarea>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-cobalt px-4 py-2"><i class="bi bi-save me-1"></i> Update Changes</button>
                    <a href="{{ url_for('project_details', project_id=project.id) }}" class="btn btn-outline-secondary px-4 py-2">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
