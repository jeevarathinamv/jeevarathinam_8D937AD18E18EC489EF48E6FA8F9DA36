{% extends 'base.html' %}

{% block title %}Add Certificate - EduTrack Hub{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">
            <div class="card shadow-lg border-0">
                <div class="card-body p-4 p-md-5">
                    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom border-white border-opacity-10 pb-3">
                        <div>
                            <h2 class="fw-bold gradient-text mb-1">🏆 Add New Certificate</h2>
                            <p class="text-white-50 small mb-0">Add your earned certificates and credential links</p>
                        </div>
                        <a href="{{ url_for('certifications') }}" class="btn btn-outline-glow btn-sm">
                            <i class="bi bi-arrow-left me-1"></i> Back to Certifications
                        </a>
                    </div>

                    <form method="POST" action="{{ url_for('add_certificate') }}">
                        <div class="mb-3">
                            <label for="certificate_name" class="form-label">
                                <i class="bi bi-award me-1 text-warning"></i> Certificate Name *
                            </label>
                            <input type="text" class="form-control" id="certificate_name" name="certificate_name" placeholder="e.g. AWS Certified Solutions Architect / Web Dev Specialist" required>
                        </div>

                        <div class="mb-3">
                            <label for="course_name" class="form-label">
                                <i class="bi bi-book me-1 text-info"></i> Course Name *
                            </label>
                            <input type="text" class="form-control" id="course_name" name="course_name" placeholder="e.g. Cloud Computing Bootcamp" required>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="issuing_organization" class="form-label">
                                    <i class="bi bi-building me-1 text-pink" style="color: #f472b6;"></i> Issuing Organization *
                                </label>
                                <input type="text" class="form-control" id="issuing_organization" name="issuing_organization" placeholder="e.g. Amazon Web Services, Google, Coursera" required>
                            </div>
                            <div class="col-md-6">
                                <label for="issue_date" class="form-label">
                                    <i class="bi bi-calendar-check me-1 text-primary"></i> Issue Date *
                                </label>
                                <input type="date" class="form-control" id="issue_date" name="issue_date" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="certificate_id" class="form-label">
                                <i class="bi bi-card-text me-1 text-warning"></i> Certificate ID / Credential ID (Optional)
                            </label>
                            <input type="text" class="form-control" id="certificate_id" name="certificate_id" placeholder="e.g. CERT-98234-XYZ">
                        </div>

                        <div class="mb-4">
                            <label for="certificate_link" class="form-label">
                                <i class="bi bi-link-45deg me-1 text-info"></i> Certificate Link / Verification URL
                            </label>
                            <input type="url" class="form-control" id="certificate_link" name="certificate_link" placeholder="e.g. https://coursera.org/verify/YOUR_ID">
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-gradient-pink fw-bold px-4 flex-grow-1">
                                <i class="bi bi-check-circle me-1"></i> Save Certificate
                            </button>
                            <a href="{{ url_for('certifications') }}" class="btn btn-outline-secondary text-white px-4">
                                Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
