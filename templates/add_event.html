{% extends 'base.html' %}

{% block title %}Add Academic Event - College Academic Calendar Management System{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card shadow border-0">
                <div class="card-header header-gradient-teal text-white py-3">
                    <h4 class="mb-0 fw-bold"><i class="bi bi-calendar-plus-fill me-2"></i>Add New Academic Event</h4>
                </div>
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('add_event') }}" id="eventForm">
                        <div class="mb-3">
                            <label for="event_title" class="form-label fw-semibold">Event Title <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="event_title" name="event_title" placeholder="e.g. Mid-Semester Examinations or National Workshop" required>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-4">
                                <label for="event_type" class="form-label fw-semibold">Event Type <span class="text-danger">*</span></label>
                                <select class="form-select" id="event_type" name="event_type" required>
                                    <option value="" selected disabled>Select Type</option>
                                    {% for type in event_types %}
                                        <option value="{{ type }}">{{ type }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="col-md-4">
                                <label for="department" class="form-label fw-semibold">Department <span class="text-danger">*</span></label>
                                <select class="form-select" id="department" name="department" required>
                                    <option value="" selected disabled>Select Department</option>
                                    {% for dept in departments %}
                                        <option value="{{ dept }}">{{ dept }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="col-md-4">
                                <label for="semester" class="form-label fw-semibold">Semester <span class="text-danger">*</span></label>
                                <select class="form-select" id="semester" name="semester" required>
                                    <option value="" selected disabled>Select Semester</option>
                                    {% for sem in semesters %}
                                        <option value="{{ sem }}">{{ sem }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="start_date" class="form-label fw-semibold">Start Date <span class="text-danger">*</span></label>
                                <input type="date" class="form-control" id="start_date" name="start_date" required>
                            </div>

                            <div class="col-md-6">
                                <label for="end_date" class="form-label fw-semibold">End Date <span class="text-danger">*</span></label>
                                <input type="date" class="form-control" id="end_date" name="end_date" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="venue" class="form-label fw-semibold">Venue / Location <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="venue" name="venue" placeholder="e.g. Main Auditorium, Exam Hall A, or Online Zoom" required>
                        </div>

                        <div class="mb-4">
                            <label for="description" class="form-label fw-semibold">Event Description</label>
                            <textarea class="form-control" id="description" name="description" rows="4" placeholder="Provide details, schedule, or instructions for students..."></textarea>
                        </div>

                        <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                            <a href="{{ url_for('manage_events') }}" class="btn btn-outline-secondary rounded-pill px-4">
                                <i class="bi bi-x-circle me-1"></i> Cancel
                            </a>
                            <button type="submit" class="btn btn-teal btn-lg fw-bold rounded-pill shadow-sm px-5">
                                <i class="bi bi-check-circle me-1"></i> Save Event
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
