{% extends "base.html" %}

{% block title %}Edit Career Goal - Student Career Goal Tracker{% endblock %}

{% block content %}
<div class="page-header-banner">
    <h2><i class="bi bi-pencil-square me-2 text-info"></i>Edit Career Goal</h2>
    <p class="mb-0 text-light opacity-90">Modify goal parameters, target dates, priority, or record progress updates.</p>
</div>

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card card-glass">
            <div class="card-header bg-indigo text-white fw-bold d-flex justify-content-between align-items-center">
                <span><i class="bi bi-bullseye me-2"></i> Goal Details</span>
                <span class="badge bg-info text-dark">ID #{{ goal.id }}</span>
            </div>
            <div class="card-body p-4">
                <form action="{{ url_for('edit_goal', goal_id=goal.id) }}" method="POST">
                    <div class="mb-3">
                        <label for="title" class="form-label fw-bold text-indigo">Goal Title <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="title" name="title" value="{{ goal.title }}" required>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6 mb-3 mb-md-0">
                            <label for="category" class="form-label fw-bold text-indigo">Category <span class="text-danger">*</span></label>
                            <select class="form-select" id="category" name="category" required>
                                {% for cat in categories %}
                                    <option value="{{ cat }}" {% if goal.category == cat %}selected{% endif %}>{{ cat }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="priority" class="form-label fw-bold text-indigo">Priority</label>
                            <select class="form-select" id="priority" name="priority">
                                <option value="High" {% if goal.priority == 'High' %}selected{% endif %}>High</option>
                                <option value="Medium" {% if goal.priority == 'Medium' %}selected{% endif %}>Medium</option>
                                <option value="Low" {% if goal.priority == 'Low' %}selected{% endif %}>Low</option>
                            </select>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6 mb-3 mb-md-0">
                            <label for="start_date" class="form-label fw-bold text-indigo">Start Date <span class="text-danger">*</span></label>
                            <input type="date" class="form-control" id="start_date" name="start_date" value="{{ goal.start_date.strftime('%Y-%m-%d') }}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="target_date" class="form-label fw-bold text-indigo">Target Date <span class="text-danger">*</span></label>
                            <input type="date" class="form-control" id="target_date" name="target_date" value="{{ goal.target_date.strftime('%Y-%m-%d') }}" required>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6 mb-3 mb-md-0">
                            <label for="progress_percentage" class="form-label fw-bold text-indigo">Progress Percentage: <span id="editProgVal" class="text-cyan fw-bold">{{ goal.progress_percentage }}%</span></label>
                            <input type="range" class="form-range progress-range-input" id="progress_percentage" name="progress_percentage"
                                   min="0" max="100" step="5" value="{{ goal.progress_percentage }}" data-output-target="editProgVal">
                        </div>
                        <div class="col-md-6">
                            <label for="status" class="form-label fw-bold text-indigo">Status</label>
                            <select class="form-select" id="status" name="status">
                                <option value="Not Started" {% if goal.status == 'Not Started' %}selected{% endif %}>Not Started</option>
                                <option value="In Progress" {% if goal.status == 'In Progress' %}selected{% endif %}>In Progress</option>
                                <option value="Completed" {% if goal.status == 'Completed' %}selected{% endif %}>Completed</option>
                                <option value="Overdue" {% if goal.status == 'Overdue' %}selected{% endif %}>Overdue</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label fw-bold text-indigo">Goal Description</label>
                        <textarea class="form-control" id="description" name="description" rows="3">{{ goal.description or '' }}</textarea>
                    </div>

                    <div class="mb-4">
                        <label for="notes" class="form-label fw-bold text-indigo">Progress Notes / Activity Log</label>
                        <textarea class="form-control" id="notes" name="notes" rows="2" placeholder="Record milestone progress or latest status updates...">{{ goal.notes or '' }}</textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('goals') }}" class="btn btn-outline-secondary">
                            <i class="bi bi-x-circle me-1"></i> Cancel
                        </a>
                        <button type="submit" class="btn btn-cyan px-4 fw-bold">
                            <i class="bi bi-save me-1"></i> Save Changes
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
