{% extends 'base.html' %}

{% block title %}Submit Customer Enquiry - Small Business Online Enquiry{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card card-custom p-4">
                <div class="card-header-cyan p-3 text-center mb-4">
                    <h3 class="fw-bold mb-0"><i class="bi bi-pencil-square me-2"></i> Online Customer Enquiry Form</h3>
                    <p class="small mb-0 opacity-90">Please fill out your details below and our team will get back to you shortly.</p>
                </div>

                <form action="{{ url_for('enquiry') }}" method="POST" class="needs-validation" novalidate>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="customer_name" class="form-label fw-semibold">Customer Name <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-white text-cyan"><i class="bi bi-person-fill"></i></span>
                                <input type="text" class="form-control" id="customer_name" name="customer_name" placeholder="Enter your full name" required>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label for="phone_number" class="form-label fw-semibold">Phone Number <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-white text-cyan"><i class="bi bi-telephone-fill"></i></span>
                                <input type="tel" class="form-control" id="phone_number" name="phone_number" placeholder="Enter phone number" required>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label for="email" class="form-label fw-semibold">Email Address <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-white text-cyan"><i class="bi bi-envelope-fill"></i></span>
                                <input type="email" class="form-control" id="email" name="email" placeholder="example@email.com" required>
                            </div>
                        </div>

                        <div class="col-md-6">
                            <label for="enquiry_date" class="form-label fw-semibold">Enquiry Date</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white text-cyan"><i class="bi bi-calendar3"></i></span>
                                <input type="date" class="form-control" id="enquiry_date" name="enquiry_date" value="{{ today }}" required>
                            </div>
                        </div>

                        <div class="col-12">
                            <label for="subject" class="form-label fw-semibold">Enquiry Subject <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-white text-cyan"><i class="bi bi-chat-left-text-fill"></i></span>
                                <input type="text" class="form-control" id="subject" name="subject" placeholder="What is your enquiry regarding?" required>
                            </div>
                        </div>

                        <div class="col-12">
                            <label for="message" class="form-label fw-semibold">Enquiry Message / Details <span class="text-danger">*</span></label>
                            <textarea class="form-control" id="message" name="message" rows="5" placeholder="Provide detailed information about your inquiry..." required></textarea>
                        </div>

                        <div class="col-12 text-center mt-4">
                            <button type="submit" class="btn btn-cyan btn-lg px-5">
                                <i class="bi bi-send-fill me-2"></i> Submit Enquiry
                            </button>
                            <a href="{{ url_for('index') }}" class="btn btn-outline-secondary btn-lg ms-2">Cancel</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
