{% extends 'base.html' %}

{% block title %}Edit Sale - {{ sale.sale_number }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7 col-lg-6">
        <div class="card shadow-lg">
            <div class="card-header-custom">
                <h4 class="mb-0"><i class="bi bi-pencil-square me-2"></i> Edit Sale Details</h4>
            </div>
            <div class="card-body p-4 bg-white">
                <form action="{{ url_for('edit_sale', sale_id=sale.id) }}" method="POST">
                    <div class="mb-3">
                        <label class="form-label fw-semibold text-muted">Sale Number</label>
                        <input type="text" class="form-control bg-light" value="{{ sale.sale_number }}" readonly>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold text-muted">Customer Name</label>
                        <input type="text" class="form-control bg-light" value="{{ sale.customer.name }}" readonly>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold text-muted">Sale Subtotal (₹)</label>
                        <input type="text" class="form-control bg-light" value="₹{{ "%.2f"|format(sale.total_amount) }}" readonly>
                    </div>

                    <div class="mb-3">
                        <label for="discount" class="form-label fw-semibold">Discount Amount (₹)</label>
                        <input type="number" step="0.01" min="0" class="form-control" id="discount" name="discount" value="{{ sale.discount }}" required>
                    </div>

                    <div class="mb-4">
                        <label for="payment_status" class="form-label fw-semibold">Payment Status</label>
                        <select class="form-select" id="payment_status" name="payment_status">
                            <option value="Paid" {% if sale.payment_status == 'Paid' %}selected{% endif %}>Paid</option>
                            <option value="Partially Paid" {% if sale.payment_status == 'Partially Paid' %}selected{% endif %}>Partially Paid</option>
                            <option value="Unpaid" {% if sale.payment_status == 'Unpaid' %}selected{% endif %}>Unpaid</option>
                        </select>
                    </div>

                    <div class="d-flex justify-content-between align-items-center">
                        <a href="{{ url_for('sale_details', sale_id=sale.id) }}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left me-1"></i> Cancel
                        </a>
                        <button type="submit" class="btn btn-royal">
                            <i class="bi bi-check-circle me-1"></i> Update Sale
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
