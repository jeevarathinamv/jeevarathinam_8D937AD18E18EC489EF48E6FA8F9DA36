{% extends "base.html" %}

{% block title %}Student Registration - SubjectReg{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card card-custom p-4 shadow-sm">
            <div class="card-body">
                <h3 class="card-title text-center text-indigo fw-bold mb-4">
                    <i class="bi bi-person-plus-fill me-2"></i>Student Registration
                </h3>
                <form action="{{ url_for('register') }}" method="POST" class="needs-validation" novalidate>
                    <div class="mb-3">
                        <label for="student_name" class="form-label fw-semibold">Student Name</label>
                        <input type="text" class="form-control" id="student_name" name="student_name" placeholder="Enter full name" required>
                    </div>

                    <div class="mb-3">
                        <label for="register_number" class="form-label fw-semibold">Register Number</label>
                        <input type="text" class="form-control" id="register_number" name="register_number" placeholder="e.g. MCA2025001" required>
                    </div>

                    <div class="mb-3">
                        <label for="department" class="form-label fw-semibold">Department</label>
                        <select class="form-select" id="department" name="department" required>
                            <option value="" selected disabled>Select Department</option>
                            <option value="Computer Applications">Computer Applications</option>
                            <option value="Information Technology">Information Technology</option>
                            <option value="Computer Science">Computer Science</option>
                        </select>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="year" class="form-label fw-semibold">Year</label>
                            <select class="form-select" id="year" name="year" required>
                                <option value="" selected disabled>Select Year</option>
                                <option value="1">1st Year</option>
                                <option value="2">2nd Year</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="semester" class="form-label fw-semibold">Semester</label>
                            <select class="form-select" id="semester" name="semester" required>
                                <option value="" selected disabled>Select Semester</option>
                                <option value="1">Semester 1</option>
                                <option value="2">Semester 2</option>
                                <option value="3">Semester 3</option>
                                <option value="4">Semester 4</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Email Address</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="student@college.edu" required>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Choose a strong password" required>
                    </div>

                    <button type="submit" class="btn btn-indigo w-100 py-2 shadow-sm"><i class="bi bi-check-circle me-1"></i>Register Now</button>
                </form>

                <div class="text-center mt-3">
                    <small>Already registered? <a href="{{ url_for('login') }}" class="text-indigo fw-bold">Login here</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
