{% extends "base.html" %}

{% block title %}Student Registration - Internship Tracker{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card sky-card p-4 p-md-5 border-0 shadow-lg">
                <div class="text-center mb-4">
                    <div class="d-inline-flex p-3 bg-primary bg-opacity-10 text-cyan rounded-circle mb-3">
                        <i class="bi bi-person-plus-fill fs-2"></i>
                    </div>
                    <h3 class="fw-bold text-dark">Student Registration</h3>
                    <p class="text-secondary small">Create an account to manage your internship applications</p>
                </div>

                <form action="{{ url_for('register') }}" method="POST">
                    <div class="mb-3">
                        <label for="name" class="form-label fw-semibold text-dark">Full Name <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-person text-cyan"></i></span>
                            <input type="text" class="form-control" id="name" name="name" placeholder="e.g. John Doe" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="register_number" class="form-label fw-semibold text-dark">Register Number <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-card-heading text-cyan"></i></span>
                            <input type="text" class="form-control" id="register_number" name="register_number" placeholder="e.g. 21MCA001" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="department" class="form-label fw-semibold text-dark">Department <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-building text-cyan"></i></span>
                            <select class="form-select" id="department" name="department" required>
                                <option value="" selected disabled>Select Department</option>
                                <option value="Computer Science & Engineering">Computer Science & Engineering</option>
                                <option value="Information Technology">Information Technology</option>
                                <option value="Master of Computer Applications (MCA)">Master of Computer Applications (MCA)</option>
                                <option value="Electronics & Communication">Electronics & Communication</option>
                                <option value="Electrical & Electronics">Electrical & Electronics</option>
                                <option value="Mechanical Engineering">Mechanical Engineering</option>
                                <option value="Civil Engineering">Civil Engineering</option>
                                <option value="Management Studies (MBA)">Management Studies (MBA)</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold text-dark">Email Address <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-envelope text-cyan"></i></span>
                            <input type="email" class="form-control" id="email" name="email" placeholder="student@college.edu" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold text-dark">Password <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-lock text-cyan"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-cyan w-100 py-2.5 rounded-pill mb-3">
                        <i class="bi bi-check-circle-fill me-2"></i> Register Account
                    </button>

                    <div class="text-center text-secondary small">
                        Already registered? <a href="{{ url_for('login') }}" class="text-cyan fw-bold text-decoration-none">Log in here</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
