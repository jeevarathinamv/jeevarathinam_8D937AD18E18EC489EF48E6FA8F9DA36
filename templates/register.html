{% extends 'base.html' %}

{% block title %}Student Registration - Student Portfolio Generator{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-7 col-lg-6">
        <div class="card card-sky p-4 shadow-lg border-0">
            <div class="text-center mb-4">
                <div class="text-cyan fs-1 mb-2"><i class="bi bi-person-plus-fill"></i></div>
                <h3 class="fw-bold text-dark">Student Registration</h3>
                <p class="text-muted small">Create your account to start building your professional portfolio</p>
            </div>

            <form action="{{ url_for('register') }}" method="POST">
                <div class="mb-3">
                    <label for="name" class="form-label fw-semibold"><i class="bi bi-person me-1"></i> Full Name</label>
                    <input type="text" class="form-control form-control-custom" id="name" name="name" placeholder="e.g. John Doe" required>
                </div>

                <div class="mb-3">
                    <label for="register_number" class="form-label fw-semibold"><i class="bi bi-card-heading me-1"></i> Register Number</label>
                    <input type="text" class="form-control form-control-custom" id="register_number" name="register_number" placeholder="e.g. 21CS101" required>
                </div>

                <div class="mb-3">
                    <label for="department" class="form-label fw-semibold"><i class="bi bi-building me-1"></i> Department</label>
                    <select class="form-select form-select-custom" id="department" name="department" required>
                        <option value="" disabled selected>Select Department</option>
                        <option value="Computer Science & Engineering">Computer Science & Engineering</option>
                        <option value="Information Technology">Information Technology</option>
                        <option value="Computer Applications (MCA/BCA)">Computer Applications (MCA/BCA)</option>
                        <option value="Electronics & Communication">Electronics & Communication</option>
                        <option value="Electrical & Electronics">Electrical & Electronics</option>
                        <option value="Mechanical Engineering">Mechanical Engineering</option>
                        <option value="Civil Engineering">Civil Engineering</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold"><i class="bi bi-envelope me-1"></i> Email Address</label>
                    <input type="email" class="form-control form-control-custom" id="email" name="email" placeholder="e.g. student@college.edu" required>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold"><i class="bi bi-lock me-1"></i> Password</label>
                    <input type="password" class="form-control form-control-custom" id="password" name="password" placeholder="Create a strong password" required>
                </div>

                <button type="submit" class="btn btn-cyan w-100 py-2 fs-6">
                    <i class="bi bi-check-circle me-1"></i> Register Now
                </button>
            </form>

            <hr class="my-4 text-muted">

            <div class="text-center">
                <p class="mb-0 text-muted">Already registered?
                    <a href="{{ url_for('login') }}" class="text-sky fw-bold text-decoration-none">Login Here</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
