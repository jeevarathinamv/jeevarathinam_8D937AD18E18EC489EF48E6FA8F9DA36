{% extends 'base.html' %}

{% block title %}Student Registration - Student Freelance Portal{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-6">
        <div class="card glass-card p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="bg-primary bg-opacity-10 text-primary d-inline-flex p-3 rounded-circle mb-3">
                    <i class="bi bi-person-plus-fill fs-1 text-primary"></i>
                </div>
                <h3 class="fw-bold text-dark">Student Registration</h3>
                <p class="text-muted">Create your freelance project tracker account</p>
            </div>

            <form action="{{ url_for('register') }}" method="POST">
                <div class="mb-3">
                    <label for="name" class="form-label font-weight-bold">Student Name</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-person"></i></span>
                        <input type="text" class="form-control" id="name" name="name" placeholder="Full Name" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="register_number" class="form-label font-weight-bold">Register Number</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-card-text"></i></span>
                            <input type="text" class="form-control" id="register_number" name="register_number" placeholder="MCA2025001" required>
                        </div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="department" class="form-label font-weight-bold">Department</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-building"></i></span>
                            <input type="text" class="form-control" id="department" name="department" value="Master of Computer Applications (MCA)" required>
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label font-weight-bold">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="email" name="email" placeholder="student@college.edu" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label font-weight-bold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-key"></i></span>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Create a strong password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-cobalt w-100 py-2 mb-3">
                    <i class="bi bi-check-circle me-1"></i> Register Account
                </button>
            </form>

            <div class="text-center mt-3 pt-3 border-top">
                <p class="mb-1 text-muted">Already registered?</p>
                <a href="{{ url_for('login') }}" class="fw-bold text-decoration-none text-primary">Log In Here</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
