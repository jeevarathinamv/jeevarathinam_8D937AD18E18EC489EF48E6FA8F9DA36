{% extends "base.html" %}

{% block title %}Student Registration - Attendance System{% endblock %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-md-7 col-lg-6">
        <div class="card card-custom card-teal-header shadow-lg">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <span class="p-3 bg-teal text-white rounded-circle d-inline-block mb-3">
                        <i class="bi bi-person-plus-fill fs-2"></i>
                    </span>
                    <h2 class="fw-bold text-dark">Student Registration</h2>
                    <p class="text-muted">Create your account to view attendance reports and alerts</p>
                </div>

                <form action="{{ url_for('register') }}" method="POST">
                    <div class="mb-3">
                        <label for="name" class="form-label fw-semibold">
                            <i class="bi bi-person-fill text-teal me-1"></i> Student Name
                        </label>
                        <input type="text" class="form-control form-control-lg rounded-3" id="name" name="name" placeholder="Enter Full Name" required>
                    </div>

                    <div class="mb-3">
                        <label for="register_number" class="form-label fw-semibold">
                            <i class="bi bi-card-heading text-teal me-1"></i> Register Number
                        </label>
                        <input type="text" class="form-control form-control-lg rounded-3" id="register_number" name="register_number" placeholder="e.g. 2025CS101" required>
                    </div>

                    <div class="mb-3">
                        <label for="department" class="form-label fw-semibold">
                            <i class="bi bi-building-fill text-teal me-1"></i> Department
                        </label>
                        <select class="form-select form-select-lg rounded-3" id="department" name="department" required>
                            <option value="" disabled selected>Select Department</option>
                            <option value="Computer Science & Engineering">Computer Science & Engineering</option>
                            <option value="Information Technology">Information Technology</option>
                            <option value="Computer Applications (MCA/BCA)">Computer Applications (MCA/BCA)</option>
                            <option value="Electronics & Communication">Electronics & Communication</option>
                            <option value="Electrical Engineering">Electrical Engineering</option>
                            <option value="Mechanical Engineering">Mechanical Engineering</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">
                            <i class="bi bi-envelope-fill text-teal me-1"></i> Email Address
                        </label>
                        <input type="email" class="form-control form-control-lg rounded-3" id="email" name="email" placeholder="student@college.edu" required>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">
                            <i class="bi bi-lock-fill text-teal me-1"></i> Password
                        </label>
                        <input type="password" class="form-control form-control-lg rounded-3" id="password" name="password" placeholder="Create a strong password" required>
                    </div>

                    <button type="submit" class="btn btn-teal w-100 py-3 text-uppercase fw-bold shadow-sm">
                        <i class="bi bi-check-circle-fill me-2"></i> Register Account
                    </button>
                </form>

                <div class="text-center mt-4">
                    <p class="mb-0 text-muted">Already registered?
                        <a href="{{ url_for('login') }}" class="fw-bold text-teal text-decoration-none">Login here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
