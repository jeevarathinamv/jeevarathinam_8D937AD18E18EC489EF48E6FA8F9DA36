{% extends 'base.html' %}

{% block title %}Student Registration - WaterCare System{% endblock %}

{% block content %}
<div class="container my-4">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-header bg-theme text-white p-4 rounded-top-4">
                    <div class="d-flex align-items-center">
                        <div class="bg-white text-teal rounded-circle p-2 me-3 d-flex align-items-center justify-content-center" style="width: 45px; height: 45px;">
                            <i class="bi bi-person-plus-fill fs-4"></i>
                        </div>
                        <div>
                            <h4 class="mb-0 fw-bold">Student Registration</h4>
                            <p class="mb-0 small text-light opacity-90">Create an account to report drinking water issues</p>
                        </div>
                    </div>
                </div>

                <div class="card-body p-4">
                    <form action="{{ url_for('register') }}" method="POST" class="needs-validation" novalidate>

                        <div class="mb-3">
                            <label for="name" class="form-label fw-semibold">Student Name <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-teal"></i></span>
                                <input type="text" class="form-control bg-light border-start-0" id="name" name="name" placeholder="Enter full name" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="register_number" class="form-label fw-semibold">Register Number <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-card-heading text-teal"></i></span>
                                <input type="text" class="form-control bg-light border-start-0" id="register_number" name="register_number" placeholder="e.g. MCA202501" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="department" class="form-label fw-semibold">Department <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-building text-teal"></i></span>
                                <input type="text" class="form-control bg-light border-start-0" id="department" name="department" placeholder="e.g. Computer Applications (MCA)" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Email Address <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-teal"></i></span>
                                <input type="email" class="form-control bg-light border-start-0" id="email" name="email" placeholder="student@college.edu" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-teal"></i></span>
                                <input type="password" class="form-control bg-light border-start-0" id="password" name="password" placeholder="Create password" required minlength="4">
                            </div>
                        </div>

                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-emerald btn-lg rounded-pill fw-semibold shadow-sm">
                                <i class="bi bi-check-circle me-2"></i>Register Now
                            </button>
                        </div>

                        <div class="text-center pt-2">
                            <p class="text-muted small mb-0">Already registered?
                                <a href="{{ url_for('login') }}" class="text-teal fw-bold text-decoration-none">Login here</a>
                            </p>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
