{% extends 'base.html' %}

{% block title %}Student Registration - Resume Builder{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4 p-md-5">
                    <h3 class="fw-bold text-center text-primary mb-3">
                        <i class="bi bi-person-plus-fill me-2"></i> Student Registration
                    </h3>
                    <p class="text-center text-muted small mb-4">Create your account to start building professional resumes</p>

                    <form action="{{ url_for('register') }}" method="POST">
                        <div class="mb-3">
                            <label for="name" class="form-label fw-medium">Student Full Name</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control" id="name" name="name" placeholder="John Doe" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="register_number" class="form-label fw-medium">Register Number</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-card-heading"></i></span>
                                <input type="text" class="form-control" id="register_number" name="register_number" placeholder="21CS101" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-medium">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" id="email" name="email" placeholder="john@example.com" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-medium">Password</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-semibold">
                            <i class="bi bi-check-circle-fill me-1"></i> Register Account
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <p class="text-muted small mb-0">Already registered? <a href="{{ url_for('login') }}" class="text-primary fw-semibold">Login here</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
