{% extends "base.html" %}

{% block title %}Student Registration - Student Study Partner Finder{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card shadow-lg border-0 overflow-hidden">
                <div class="card-header bg-gradient-theme text-white text-center py-4">
                    <div class="icon-circle icon-pink mb-2 mx-auto">
                        <i class="bi bi-person-plus-fill"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Student Registration</h3>
                    <p class="small text-white-50 mb-0">Create your account to find study partners</p>
                </div>
                <div class="card-body p-4 p-md-5">
                    <form action="{{ url_for('register') }}" method="POST">
                        <div class="mb-3">
                            <label for="name" class="form-label fw-semibold text-dark"><i class="bi bi-person-fill text-purple me-1"></i> Student Name</label>
                            <input type="text" class="form-control" id="name" name="name" placeholder="e.g. Alex Johnson" required>
                        </div>

                        <div class="mb-3">
                            <label for="register_number" class="form-label fw-semibold text-dark"><i class="bi bi-card-heading text-blue me-1"></i> Register Number</label>
                            <input type="text" class="form-control" id="register_number" name="register_number" placeholder="e.g. REG202401" required>
                        </div>

                        <div class="mb-3">
                            <label for="department" class="form-label fw-semibold text-dark"><i class="bi bi-building-fill text-pink me-1"></i> Department</label>
                            <select class="form-select" id="department" name="department" required>
                                <option value="" selected disabled>-- Select Department --</option>
                                <option value="Computer Science">Computer Science</option>
                                <option value="Information Technology">Information Technology</option>
                                <option value="Computer Applications (MCA)">Computer Applications (MCA)</option>
                                <option value="Artificial Intelligence & Data Science">Artificial Intelligence & Data Science</option>
                                <option value="Electronics & Communication">Electronics & Communication</option>
                                <option value="Electrical & Electronics">Electrical & Electronics</option>
                                <option value="Mechanical Engineering">Mechanical Engineering</option>
                                <option value="Civil Engineering">Civil Engineering</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold text-dark"><i class="bi bi-envelope-fill text-purple me-1"></i> Email Address</label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="student@university.edu" required>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold text-dark"><i class="bi bi-lock-fill text-pink me-1"></i> Password</label>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Choose a strong password" required>
                        </div>

                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-gradient btn-lg rounded-pill shadow">
                                <i class="bi bi-person-check-fill me-2"></i> Register Account
                            </button>
                        </div>

                        <div class="text-center mt-3">
                            <p class="text-muted mb-0">Already registered?
                                <a href="{{ url_for('login') }}" class="fw-bold text-purple text-decoration-none">Login here</a>
                            </p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
