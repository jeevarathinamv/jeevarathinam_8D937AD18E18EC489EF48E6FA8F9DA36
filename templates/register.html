{% extends 'base.html' %}

{% block title %}Student Registration - College Digital Library{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card form-card p-4 p-md-5 bg-white">
                <div class="text-center mb-4">
                    <div class="stat-icon stat-icon-orange mx-auto mb-3">
                        <i class="bi bi-person-plus-fill"></i>
                    </div>
                    <h3 class="fw-bold text-dark">Student Registration</h3>
                    <p class="text-muted small">Create an account to access digital books and download PDF materials.</p>
                </div>

                <form action="{{ url_for('register') }}" method="POST">
                    <div class="mb-3">
                        <label for="name" class="form-label">Student Name <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-person text-secondary"></i></span>
                            <input type="text" class="form-control" id="name" name="name" placeholder="Enter your full name" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="register_number" class="form-label">Register Number <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-card-heading text-secondary"></i></span>
                            <input type="text" class="form-control" id="register_number" name="register_number" placeholder="e.g., 2025MCA001" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="department" class="form-label">Department <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-building text-secondary"></i></span>
                            <input type="text" class="form-control" id="department" name="department" placeholder="e.g., Computer Applications" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email Address <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-envelope text-secondary"></i></span>
                            <input type="email" class="form-control" id="email" name="email" placeholder="student@college.edu" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label">Password <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-key text-secondary"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Create a secure password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-orange w-100 py-2 rounded-3 fw-bold mb-3">
                        <i class="bi bi-check-circle me-1"></i> Register Student Account
                    </button>

                    <div class="text-center">
                        <span class="text-muted small">Already registered?</span>
                        <a href="{{ url_for('login') }}" class="text-decoration-none fw-semibold ms-1 text-info">Login here</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
