{% extends 'base.html' %}

{% block title %}Student Registration - Hostel Room Change System{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card card-custom p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="icon-box-purple mx-auto mb-3">
                        <i class="bi bi-person-plus-fill"></i>
                    </div>
                    <h3 class="fw-bold">Student Registration</h3>
                    <p class="text-muted small">Create an account to manage your hostel room change requests</p>
                </div>

                <form action="{{ url_for('register') }}" method="POST" class="needs-validation" novalidate>
                    <div class="mb-3">
                        <label for="name" class="form-label fw-semibold">Student Name <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="name" name="name" placeholder="Enter full name" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="register_number" class="form-label fw-semibold">Register Number <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-card-text"></i></span>
                            <input type="text" class="form-control" id="register_number" name="register_number" placeholder="e.g. 21MCA101" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="department" class="form-label fw-semibold">Department <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-book"></i></span>
                            <input type="text" class="form-control" id="department" name="department" placeholder="e.g. Master of Computer Applications" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Email Address <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                            <input type="email" class="form-control" id="email" name="email" placeholder="student@college.edu" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Create password" minlength="4" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-purple w-100 py-2 mb-3">
                        <i class="bi bi-check-circle me-1"></i> Register Student
                    </button>

                    <div class="text-center text-muted small">
                        Already registered? <a href="{{ url_for('login') }}" class="text-primary fw-semibold">Log in here</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
