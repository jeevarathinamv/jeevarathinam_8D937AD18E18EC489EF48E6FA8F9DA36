{% extends "base.html" %}

{% block title %}Student Registration - Student Leave Portal{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card card-sky p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="text-info mb-2">
                        <i class="bi bi-person-plus-fill fs-1"></i>
                    </div>
                    <h3 class="fw-bold text-cyan">Student Registration</h3>
                    <p class="text-light opacity-80 small">Create your student account to apply for leave online</p>
                </div>

                <form method="POST" action="{{ url_for('register') }}">
                    <div class="mb-3">
                        <label for="name" class="form-label"><i class="bi bi-person me-1 text-info"></i> Full Name</label>
                        <input type="text" class="form-control" id="name" name="name" placeholder="e.g. John Doe" required>
                    </div>

                    <div class="mb-3">
                        <label for="register_number" class="form-label"><i class="bi bi-card-heading me-1 text-info"></i> Register Number</label>
                        <input type="text" class="form-control" id="register_number" name="register_number" placeholder="e.g. REG2025001" required>
                    </div>

                    <div class="mb-3">
                        <label for="department" class="form-label"><i class="bi bi-building me-1 text-info"></i> Department</label>
                        <select class="form-select" id="department" name="department" required>
                            <option value="" disabled selected>Select Department</option>
                            <option value="Computer Applications (MCA/BCA)">Computer Applications (MCA/BCA)</option>
                            <option value="Computer Science & Engineering">Computer Science & Engineering</option>
                            <option value="Information Technology">Information Technology</option>
                            <option value="Electronics & Communication">Electronics & Communication</option>
                            <option value="Electrical Engineering">Electrical Engineering</option>
                            <option value="Mechanical Engineering">Mechanical Engineering</option>
                            <option value="Civil Engineering">Civil Engineering</option>
                            <option value="Business Administration">Business Administration</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label"><i class="bi bi-envelope me-1 text-info"></i> Email Address</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="e.g. student@college.edu" required>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label"><i class="bi bi-lock me-1 text-info"></i> Password</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Choose a strong password" required>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-cyan btn-lg">
                            <i class="bi bi-check-circle-fill me-2"></i> Register Account
                        </button>
                    </div>

                    <div class="text-center">
                        <p class="small text-light opacity-80 mb-0">
                            Already have an account? <a href="{{ url_for('login') }}" class="text-cyan fw-bold">Login here</a>
                        </p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
