{% extends 'base.html' %}

{% block title %}Student Registration - Skill Workshop Portal{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card border-0 shadow-custom p-4 p-md-5">
                <div class="text-center mb-4">
                    <span class="bg-mint-subtle text-mint rounded-circle d-inline-flex align-items-center justify-content-center mb-2" style="width:50px; height:50px;">
                        <i class="bi bi-person-plus-fill fs-3"></i>
                    </span>
                    <h3 class="fw-bold text-dark">Student Registration</h3>
                    <p class="text-muted small">Create an account to register for skill training workshops</p>
                </div>

                <form action="{{ url_for('register') }}" method="POST" class="needs-validation" novalidate>
                    <div class="mb-3">
                        <label for="name" class="form-label fw-semibold">Student Name</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person text-muted"></i></span>
                            <input type="text" class="form-control" id="name" name="name" placeholder="Enter full name" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="register_number" class="form-label fw-semibold">Register Number</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-card-heading text-muted"></i></span>
                            <input type="text" class="form-control" id="register_number" name="register_number" placeholder="e.g., 2024MCA001" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="department" class="form-label fw-semibold">Department</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-building text-muted"></i></span>
                            <select class="form-select" id="department" name="department" required>
                                <option value="" selected disabled>Select Department</option>
                                <option value="Master of Computer Applications (MCA)">Master of Computer Applications (MCA)</option>
                                <option value="Computer Science & Engineering">Computer Science & Engineering</option>
                                <option value="Information Technology">Information Technology</option>
                                <option value="Electronics & Communication">Electronics & Communication</option>
                                <option value="Management Studies">Management Studies</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-envelope text-muted"></i></span>
                            <input type="email" class="form-control" id="email" name="email" placeholder="student@college.edu" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock text-muted"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Create a secure password" required minlength="4">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-mint w-100 py-2 fw-semibold shadow-sm mb-3">
                        <i class="bi bi-check-circle me-1"></i> Register Student
                    </button>

                    <div class="text-center">
                        <p class="small text-muted mb-0">Already have an account? <a href="{{ url_for('login') }}" class="text-indigo fw-semibold text-decoration-none">Login here</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
