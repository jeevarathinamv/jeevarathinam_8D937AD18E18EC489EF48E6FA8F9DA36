{% extends 'base.html' %}

{% block title %}Student Registration - College Academic Calendar Management System{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card shadow border-0">
                <div class="card-header header-gradient-blue text-white text-center py-3">
                    <h4 class="mb-0 fw-bold"><i class="bi bi-person-plus-fill me-2"></i>Student Registration</h4>
                    <small class="text-white-50">Create your student account to access the academic calendar</small>
                </div>
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('register') }}">
                        <div class="mb-3">
                            <label for="student_name" class="form-label fw-semibold">Student Name <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control" id="student_name" name="student_name" placeholder="Enter your full name" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="register_number" class="form-label fw-semibold">Register Number <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-card-heading"></i></span>
                                <input type="text" class="form-control" id="register_number" name="register_number" placeholder="e.g. 21MCA001" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="department" class="form-label fw-semibold">Department <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-building"></i></span>
                                <select class="form-select" id="department" name="department" required>
                                    <option value="" selected disabled>Select Department</option>
                                    <option value="Computer Applications (MCA)">Computer Applications (MCA)</option>
                                    <option value="Computer Science">Computer Science</option>
                                    <option value="Information Technology">Information Technology</option>
                                    <option value="Business Administration">Business Administration</option>
                                    <option value="Commerce">Commerce</option>
                                    <option value="Mathematics">Mathematics</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Email Address <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" id="email" name="email" placeholder="e.g. student@college.edu" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="password" name="password" placeholder="Create a strong password" required minlength="4">
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-teal btn-lg fw-bold rounded-pill shadow-sm">
                                <i class="bi bi-check-circle me-1"></i> Register Account
                            </button>
                        </div>
                    </form>
                </div>
                <div class="card-footer bg-light text-center py-3">
                    <p class="mb-0 text-muted small">Already registered? <a href="{{ url_for('login') }}" class="fw-bold text-primary text-decoration-none">Login Here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
