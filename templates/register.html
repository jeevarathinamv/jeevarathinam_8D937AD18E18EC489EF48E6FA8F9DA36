{% extends "base.html" %}

{% block title %}Student Registration - Mock Interview Portal{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="card-header bg-gradient-nav text-white p-4 text-center border-0">
                    <div class="d-inline-flex align-items-center justify-content-center bg-white text-primary rounded-circle mb-2" style="width: 50px; height: 50px;">
                        <i class="bi bi-person-plus-fill fs-4"></i>
                    </div>
                    <h4 class="fw-bold mb-1">Student Registration</h4>
                    <p class="small text-white-50 mb-0">Create your account to start mock interview practice</p>
                </div>
                <div class="card-body p-4 p-md-5">
                    <form method="POST" action="{{ url_for('register') }}">
                        <div class="mb-3">
                            <label for="name" class="form-label fw-semibold text-dark"><i class="bi bi-person-fill me-1 text-primary"></i> Full Name</label>
                            <input type="text" class="form-control form-control-lg rounded-3 fs-6" id="name" name="name" placeholder="John Doe" required>
                        </div>

                        <div class="mb-3">
                            <label for="register_number" class="form-label fw-semibold text-dark"><i class="bi bi-card-heading me-1 text-primary"></i> Register Number</label>
                            <input type="text" class="form-control form-control-lg rounded-3 fs-6" id="register_number" name="register_number" placeholder="e.g. 21MCA001" required>
                        </div>

                        <div class="mb-3">
                            <label for="department" class="form-label fw-semibold text-dark"><i class="bi bi-building me-1 text-primary"></i> Department</label>
                            <input type="text" class="form-control form-control-lg rounded-3 fs-6" id="department" name="department" placeholder="e.g. Computer Applications (MCA)" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold text-dark"><i class="bi bi-envelope-fill me-1 text-primary"></i> Email Address</label>
                            <input type="email" class="form-control form-control-lg rounded-3 fs-6" id="email" name="email" placeholder="student@college.edu" required>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold text-dark"><i class="bi bi-lock-fill me-1 text-primary"></i> Password</label>
                            <input type="password" class="form-control form-control-lg rounded-3 fs-6" id="password" name="password" placeholder="••••••••" required>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg rounded-pill w-100 fw-bold shadow-sm">
                            <i class="bi bi-check-circle-fill me-1"></i> Register Account
                        </button>
                    </form>
                </div>
                <div class="card-footer bg-light p-3 text-center border-0">
                    <span class="text-muted small">Already have an account? </span>
                    <a href="{{ url_for('login') }}" class="fw-bold text-primary text-decoration-none small">Login here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
