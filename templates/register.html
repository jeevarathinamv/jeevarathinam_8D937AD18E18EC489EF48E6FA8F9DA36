{% extends "base.html" %}

{% block title %}Student Registration - Classroom Maintenance Complaint Tracker{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card card-custom p-4 my-3">
            <div class="text-center mb-4">
                <i class="fa-solid fa-user-plus fa-3x text-primary mb-2"></i>
                <h3 class="fw-bold">Student Registration</h3>
                <p class="text-muted">Create an account to report classroom maintenance issues</p>
            </div>

            <form action="{{ url_for('register') }}" method="POST" class="needs-validation" novalidate>
                <div class="mb-3">
                    <label for="name" class="form-label font-weight-bold">Full Name</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                        <input type="text" class="form-control" id="name" name="name" placeholder="Enter full name" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="register_number" class="form-label font-weight-bold">Register Number</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-id-card"></i></span>
                        <input type="text" class="form-control" id="register_number" name="register_number" placeholder="e.g., 23MCA101" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="department" class="form-label font-weight-bold">Department</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-graduation-cap"></i></span>
                        <select class="form-select" id="department" name="department" required>
                            <option value="" disabled selected>Select Department</option>
                            <option value="Master of Computer Applications (MCA)">Master of Computer Applications (MCA)</option>
                            <option value="Computer Science & Engineering">Computer Science & Engineering</option>
                            <option value="Information Technology">Information Technology</option>
                            <option value="Electronics & Communication">Electronics & Communication</option>
                            <option value="Mechanical Engineering">Mechanical Engineering</option>
                            <option value="Electrical & Electronics">Electrical & Electronics</option>
                            <option value="Civil Engineering">Civil Engineering</option>
                            <option value="Management Studies">Management Studies</option>
                        </select>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label font-weight-bold">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-envelope"></i></span>
                        <input type="email" class="form-control" id="email" name="email" placeholder="student@college.edu" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label font-weight-bold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Create password" required>
                    </div>
                </div>

                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-orange py-2">
                        <i class="fa-solid fa-user-check me-2"></i>Register
                    </button>
                </div>

                <div class="text-center">
                    <p class="mb-0 text-muted">Already registered? <a href="{{ url_for('login') }}" class="text-primary fw-bold text-decoration-none">Login here</a></p>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
