{% extends "base.html" %}

{% block title %}Student Registration - Assignment Tracker{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card card-theme p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center bg-warning bg-opacity-10 rounded-circle p-3 mb-3">
                        <i class="bi bi-person-plus-fill text-danger fs-1"></i>
                    </div>
                    <h3 class="fw-bold text-dark mb-1">Student Registration</h3>
                    <p class="text-muted small">Create an account to track and submit your college assignments</p>
                </div>

                <form method="POST" action="{{ url_for('register') }}">
                    <div class="mb-3">
                        <label for="name" class="form-label fw-semibold text-secondary">
                            <i class="bi bi-person text-info me-1"></i> Student Name
                        </label>
                        <input type="text" class="form-control rounded-3" id="name" name="name" placeholder="Full Name (e.g. John Doe)" required>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="register_number" class="form-label fw-semibold text-secondary">
                                <i class="bi bi-card-text text-info me-1"></i> Register Number
                            </label>
                            <input type="text" class="form-control rounded-3" id="register_number" name="register_number" placeholder="e.g. 21MCA001" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="department" class="form-label fw-semibold text-secondary">
                                <i class="bi bi-building text-info me-1"></i> Department
                            </label>
                            <input type="text" class="form-control rounded-3" id="department" name="department" placeholder="e.g. Master of Computer Applications" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold text-secondary">
                            <i class="bi bi-envelope text-info me-1"></i> Email Address
                        </label>
                        <input type="email" class="form-control rounded-3" id="email" name="email" placeholder="student@college.edu" required>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold text-secondary">
                            <i class="bi bi-key text-info me-1"></i> Password
                        </label>
                        <input type="password" class="form-control rounded-3" id="password" name="password" placeholder="Choose Password" required>
                    </div>

                    <div class="d-grid gap-2 mb-3">
                        <button type="submit" class="btn btn-peach btn-lg fw-bold">
                            <i class="bi bi-check-circle-fill me-1"></i> Complete Registration
                        </button>
                    </div>
                </form>

                <div class="text-center mt-3 pt-3 border-top">
                    <p class="text-muted mb-2">Already registered?</p>
                    <a href="{{ url_for('login') }}" class="btn btn-cyan btn-sm fw-semibold">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Back to Student Login
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
