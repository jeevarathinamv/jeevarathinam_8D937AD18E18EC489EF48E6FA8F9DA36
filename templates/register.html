{% extends "base.html" %}

{% block title %}Student Registration - Student Career Goal Tracker{% endblock %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-md-7 col-lg-6">
        <div class="card auth-card">
            <div class="auth-header">
                <i class="bi bi-person-plus-fill text-indigo"></i>
                <h3 class="fw-bold">Student Registration</h3>
                <p class="text-muted small">Create your student career tracker profile</p>
            </div>

            <form action="{{ url_for('register') }}" method="POST">
                <div class="mb-3">
                    <label for="name" class="form-label fw-semibold">Student Name</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-card-heading"></i></span>
                        <input type="text" class="form-control" id="name" name="name" placeholder="Full Name" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="register_number" class="form-label fw-semibold">Register Number</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-hash"></i></span>
                            <input type="text" class="form-control" id="register_number" name="register_number" placeholder="e.g. 23MCA101" required>
                        </div>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="department" class="form-label fw-semibold">Department</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-building"></i></span>
                            <input type="text" class="form-control" id="department" name="department" placeholder="e.g. Master of Computer Applications" required>
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label fw-semibold">Email Address</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control" id="email" name="email" placeholder="student@example.com" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Create Password" minlength="4" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-indigo w-100 py-2 fs-6">
                    <i class="bi bi-check-circle-fill me-1"></i> Register Student Account
                </button>
            </form>

            <div class="text-center mt-4 pt-3 border-top">
                <p class="mb-0 text-muted">Already registered?</p>
                <a href="{{ url_for('login') }}" class="btn btn-link text-indigo fw-bold p-0">
                    Login to Student Portal
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
