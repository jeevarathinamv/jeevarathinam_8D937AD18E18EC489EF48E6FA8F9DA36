{% extends "base.html" %}

{% block title %}Student Register - Library Fine System{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="card-header card-header-maroon py-3 text-center">
                    <h4 class="fw-bold mb-0"><i class="bi bi-person-plus-fill me-2 text-gold"></i>Student Registration</h4>
                </div>
                <div class="card-body p-4 bg-white">
                    <form action="{{ url_for('register') }}" method="POST" class="needs-validation" novalidate>
                        <div class="mb-3">
                            <label for="name" class="form-label fw-semibold">Full Name</label>
                            <div class="input-group">
                                <span class="input-group-text bg-cream border-end-0"><i class="bi bi-person text-maroon"></i></span>
                                <input type="text" class="form-control border-start-0" id="name" name="name" placeholder="Enter student full name" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="register_number" class="form-label fw-semibold">Register Number</label>
                            <div class="input-group">
                                <span class="input-group-text bg-cream border-end-0"><i class="bi bi-card-heading text-maroon"></i></span>
                                <input type="text" class="form-control border-start-0" id="register_number" name="register_number" placeholder="e.g. MCA2024001" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="department" class="form-label fw-semibold">Department</label>
                            <div class="input-group">
                                <span class="input-group-text bg-cream border-end-0"><i class="bi bi-building text-maroon"></i></span>
                                <select class="form-select border-start-0" id="department" name="department" required>
                                    <option value="" selected disabled>Select Department</option>
                                    <option value="Computer Applications (MCA)">Computer Applications (MCA)</option>
                                    <option value="Computer Science & Engineering">Computer Science & Engineering</option>
                                    <option value="Information Technology">Information Technology</option>
                                    <option value="Electrical & Electronics Engineering">Electrical & Electronics Engineering</option>
                                    <option value="Mechanical Engineering">Mechanical Engineering</option>
                                    <option value="Management Studies (MBA)">Management Studies (MBA)</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-cream border-end-0"><i class="bi bi-envelope text-maroon"></i></span>
                                <input type="email" class="form-control border-start-0" id="email" name="email" placeholder="student@college.edu" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-cream border-end-0"><i class="bi bi-lock text-maroon"></i></span>
                                <input type="password" class="form-control border-start-0" id="password" name="password" placeholder="Create a secure password" required minlength="4">
                            </div>
                        </div>

                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-maroon btn-lg fw-semibold rounded-pill py-2">
                                <i class="bi bi-person-check-fill me-1"></i> Register Now
                            </button>
                        </div>

                        <div class="text-center pt-2">
                            <span class="text-muted small">Already have an account?</span>
                            <a href="{{ url_for('login') }}" class="fw-bold text-maroon ms-1">Login here</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
