{% extends "base.html" %}

{% block title %}Student Registration - Library New Book Request System{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card border-0 shadow-lg rounded-4">
                <div class="card-header bg-gradient-purple text-white text-center py-4 rounded-top-4">
                    <h3 class="fw-bold mb-1"><i class="bi bi-person-plus-fill me-2"></i> Student Registration</h3>
                    <p class="small mb-0 opacity-80">Create an account to request new books from the library</p>
                </div>
                <div class="card-body p-4 p-md-5">
                    <form action="{{ url_for('register') }}" method="POST" class="needs-validation" novalidate>
                        <div class="mb-3">
                            <label for="name" class="form-label fw-semibold">Student Name</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control" id="name" name="name" placeholder="e.g., Alex Johnson" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="register_number" class="form-label fw-semibold">Register Number</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-card-heading"></i></span>
                                <input type="text" class="form-control" id="register_number" name="register_number" placeholder="e.g., 21MCA010" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="department" class="form-label fw-semibold">Department</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-building"></i></span>
                                <input type="text" class="form-control" id="department" name="department" placeholder="e.g., Master of Computer Applications" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" id="email" name="email" placeholder="e.g., alex@college.edu" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="password" name="password" placeholder="Choose a secure password" required minlength="4">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-purple w-100 py-2.5 rounded-3 fw-bold text-uppercase mb-3 shadow-sm">
                            <i class="bi bi-check-circle me-1"></i> Register Account
                        </button>
                    </form>

                    <div class="text-center mt-3 pt-3 border-top">
                        <p class="mb-0 text-muted">Already registered? <a href="{{ url_for('login') }}" class="text-primary fw-bold text-decoration-none">Login Here</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
