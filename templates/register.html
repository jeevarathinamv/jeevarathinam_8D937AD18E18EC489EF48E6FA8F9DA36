{% extends "base.html" %}

{% block title %}Student Registration - Campus Recruitment Drive System{% endblock %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-md-7 col-lg-6">
        <div class="card card-sky p-4 shadow-lg">
            <div class="text-center mb-4">
                <div class="icon-box bg-cyan-soft text-cyan mx-auto mb-2" style="width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                    <i class="bi bi-person-plus-fill fs-2" style="color: #0284c7;"></i>
                </div>
                <h3 class="fw-bold text-navy mb-1" style="color: #0a192f;">Student Registration</h3>
                <p class="text-secondary small">Create an account to apply for campus recruitment drives</p>
            </div>

            <form action="{{ url_for('register') }}" method="POST">
                <div class="mb-3">
                    <label for="name" class="form-label fw-semibold text-navy" style="color: #0a192f;">
                        <i class="bi bi-person me-1"></i> Full Name
                    </label>
                    <input type="text" class="form-control" id="name" name="name" placeholder="John Doe" required>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="register_number" class="form-label fw-semibold text-navy" style="color: #0a192f;">
                            <i class="bi bi-card-heading me-1"></i> Register Number
                        </label>
                        <input type="text" class="form-control" id="register_number" name="register_number" placeholder="2025CS101" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="department" class="form-label fw-semibold text-navy" style="color: #0a192f;">
                            <i class="bi bi-mortarboard me-1"></i> Department
                        </label>
                        <select class="form-select" id="department" name="department" required>
                            <option value="" disabled selected>Select Department</option>
                            <option value="Computer Science & Engineering">Computer Science & Engineering</option>
                            <option value="Information Technology">Information Technology</option>
                            <option value="Master of Computer Applications (MCA)">Master of Computer Applications (MCA)</option>
                            <option value="Electronics & Communication">Electronics & Communication</option>
                            <option value="Electrical & Electronics">Electrical & Electronics</option>
                            <option value="Mechanical Engineering">Mechanical Engineering</option>
                        </select>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="email" class="form-label fw-semibold text-navy" style="color: #0a192f;">
                            <i class="bi bi-envelope me-1"></i> Email Address
                        </label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="john@student.edu" required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label for="phone_number" class="form-label fw-semibold text-navy" style="color: #0a192f;">
                            <i class="bi bi-telephone me-1"></i> Phone Number
                        </label>
                        <input type="tel" class="form-control" id="phone_number" name="phone_number" placeholder="+1 9876543210" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold text-navy" style="color: #0a192f;">
                        <i class="bi bi-key me-1"></i> Password
                    </label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-cyan w-100 py-2 fs-6">
                    <i class="bi bi-check-circle me-1"></i> Register Student Account
                </button>
            </form>

            <div class="text-center mt-3 pt-3 border-top">
                <p class="small text-secondary mb-0">Already registered?
                    <a href="{{ url_for('login') }}" class="fw-bold text-decoration-none" style="color: #0284c7;">Log In Here</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
