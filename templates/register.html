{% extends "base.html" %}

{% block title %}Student Registration - Student Project Showcase Portal{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card p-4 p-md-5 shadow-sm border-0">
                <div class="text-center mb-4">
                    <div class="rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px; background-color: var(--periwinkle-light);">
                        <i class="bi bi-person-plus-fill fs-2" style="color: var(--periwinkle-dark);"></i>
                    </div>
                    <h3 class="fw-bold">Student Registration</h3>
                    <p class="text-muted small">Create an account to submit and manage your showcase projects</p>
                </div>

                <form action="{{ url_for('register') }}" method="POST">
                    <div class="mb-3">
                        <label for="name" class="form-label fw-medium"><i class="bi bi-person-badge me-1"></i> Student Name</label>
                        <input type="text" class="form-control form-control-lg" id="name" name="name" placeholder="Enter full name" required>
                    </div>

                    <div class="mb-3">
                        <label for="register_number" class="form-label fw-medium"><i class="bi bi-card-heading me-1"></i> Register Number</label>
                        <input type="text" class="form-control form-control-lg" id="register_number" name="register_number" placeholder="e.g. MCA202401" required>
                    </div>

                    <div class="mb-3">
                        <label for="department" class="form-label fw-medium"><i class="bi bi-building me-1"></i> Department</label>
                        <input type="text" class="form-control form-control-lg" id="department" name="department" placeholder="e.g. Computer Applications (MCA)" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-medium"><i class="bi bi-envelope me-1"></i> Email Address</label>
                        <input type="email" class="form-control form-control-lg" id="email" name="email" placeholder="student@college.edu" required>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-medium"><i class="bi bi-lock me-1"></i> Password</label>
                        <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="Choose a strong password" required>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-coral btn-lg fw-semibold rounded-pill">
                            <i class="bi bi-check-circle-fill me-1"></i> Register Account
                        </button>
                    </div>

                    <div class="text-center">
                        <p class="text-muted small mb-0">
                            Already registered? <a href="{{ url_for('login') }}" class="fw-bold text-decoration-none" style="color: var(--periwinkle);">Log In Here</a>
                        </p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
