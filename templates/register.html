{% extends 'base.html' %}

{% block title %}Student Registration - College Student Grievance Portal{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card card-custom p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="icon-box-cyan mx-auto mb-3" style="width: 60px; height: 60px; font-size: 1.8rem;">
                        <i class="bi bi-person-plus-fill"></i>
                    </div>
                    <h3 class="fw-bold text-white mb-1">Student Registration</h3>
                    <p class="text-muted small">Create an account to submit & track grievances</p>
                </div>

                <form action="{{ url_for('register') }}" method="POST">
                    <div class="mb-3">
                        <label for="name" class="form-label text-light fw-medium"><i class="bi bi-person me-1 text-info"></i> Student Full Name</label>
                        <input type="text" class="form-control form-control-custom py-2" id="name" name="name" placeholder="e.g. Rahul Sharma" required>
                    </div>

                    <div class="mb-3">
                        <label for="register_number" class="form-label text-light fw-medium"><i class="bi bi-card-heading me-1 text-info"></i> Register Number / Roll No.</label>
                        <input type="text" class="form-control form-control-custom py-2" id="register_number" name="register_number" placeholder="e.g. 21MCA042" required>
                    </div>

                    <div class="mb-3">
                        <label for="department" class="form-label text-light fw-medium"><i class="bi bi-building me-1 text-info"></i> Department</label>
                        <select class="form-select form-select-custom py-2" id="department" name="department" required>
                            <option value="" disabled selected>Select Department</option>
                            <option value="Computer Science & Engineering">Computer Science & Engineering</option>
                            <option value="Computer Applications (MCA)">Computer Applications (MCA)</option>
                            <option value="Information Technology">Information Technology</option>
                            <option value="Electronics & Communication">Electronics & Communication</option>
                            <option value="Mechanical Engineering">Mechanical Engineering</option>
                            <option value="Civil Engineering">Civil Engineering</option>
                            <option value="Management Studies (MBA)">Management Studies (MBA)</option>
                            <option value="Basic Sciences & Humanities">Basic Sciences & Humanities</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label text-light fw-medium"><i class="bi bi-envelope me-1 text-info"></i> Email Address</label>
                        <input type="email" class="form-control form-control-custom py-2" id="email" name="email" placeholder="student@college.edu" required>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label text-light fw-medium"><i class="bi bi-lock me-1 text-info"></i> Password</label>
                        <input type="password" class="form-control form-control-custom py-2" id="password" name="password" placeholder="Choose a secure password" required>
                    </div>

                    <button type="submit" class="btn btn-cyan w-100 py-2 fs-6 mb-3">
                        <i class="bi bi-check-circle me-1"></i> Register Account
                    </button>

                    <div class="text-center text-muted small">
                        Already registered? <a href="{{ url_for('login') }}" class="text-info text-decoration-none fw-semibold">Login here</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
