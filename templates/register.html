{% extends 'base.html' %}

{% block title %}Student Registration - College Digital Document Verification System{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-header bg-navy text-white p-4 text-center rounded-top-4">
                    <h4 class="fw-bold mb-1"><i class="bi bi-person-plus-fill text-info me-2"></i>Student Registration</h4>
                    <p class="text-light small mb-0">Create an account to upload and verify your documents</p>
                </div>
                <div class="card-body p-4">
                    <form action="{{ url_for('register') }}" method="POST">
                        <div class="mb-3">
                            <label for="name" class="form-label fw-medium">Student Name <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control" id="name" name="name" placeholder="Enter your full name" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="register_number" class="form-label fw-medium">Register Number <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-card-heading"></i></span>
                                <input type="text" class="form-control" id="register_number" name="register_number" placeholder="e.g. 21MCA001" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="department" class="form-label fw-medium">Department <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-building"></i></span>
                                <input type="text" class="form-control" id="department" name="department" placeholder="e.g. Master of Computer Applications (MCA)" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-medium">Email Address <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" id="email" name="email" placeholder="student@college.edu" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-medium">Password <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                                <input type="password" class="form-control" id="password" name="password" placeholder="Create password" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-green w-100 py-2 rounded-pill fw-bold fs-6">
                            <i class="bi bi-check-circle-fill me-2"></i>Register Now
                        </button>
                    </form>
                </div>
                <div class="card-footer bg-light text-center py-3 border-0 rounded-bottom-4">
                    <p class="mb-0 text-muted small">Already have an account? <a href="{{ url_for('login') }}" class="text-primary fw-semibold">Login here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
