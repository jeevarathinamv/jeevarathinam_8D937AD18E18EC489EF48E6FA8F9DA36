{% extends 'base.html' %}

{% block title %}Student Registration{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-7 col-lg-6">
        <div class="card card-glass p-4">
            <div class="card-body">
                <div class="text-center mb-4">
                    <div class="icon-box icon-box-cyan mx-auto mb-3">
                        <i class="bi bi-person-plus-fill"></i>
                    </div>
                    <h3 class="fw-bold text-dark">Student Registration</h3>
                    <p class="text-muted">Create your help desk account to submit and track requests</p>
                </div>

                <form action="{{ url_for('register') }}" method="POST">
                    <div class="mb-3">
                        <label for="name" class="form-label fw-semibold">Student Name</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0"><i class="bi bi-person text-primary"></i></span>
                            <input type="text" class="form-control border-start-0" id="name" name="name" placeholder="e.g. John Doe" required>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="register_number" class="form-label fw-semibold">Register Number</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0"><i class="bi bi-card-heading text-primary"></i></span>
                                <input type="text" class="form-control border-start-0" id="register_number" name="register_number" placeholder="e.g. REG2025001" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label for="department" class="form-label fw-semibold">Department</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0"><i class="bi bi-building text-primary"></i></span>
                                <input type="text" class="form-control border-start-0" id="department" name="department" placeholder="e.g. Computer Science" required>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0"><i class="bi bi-envelope text-primary"></i></span>
                            <input type="email" class="form-control border-start-0" id="email" name="email" placeholder="e.g. student@college.edu" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white border-end-0"><i class="bi bi-lock text-primary"></i></span>
                            <input type="password" class="form-control border-start-0" id="password" name="password" placeholder="Create a strong password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-gradient-primary w-100 py-2 shadow mb-3">
                        <i class="bi bi-check-circle me-1"></i> Register Account
                    </button>

                    <div class="text-center text-muted fs-6">
                        Already registered? <a href="{{ url_for('login') }}" class="fw-bold text-decoration-none">Log In Here</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
