{% extends 'base.html' %}

{% block title %}Student Registration - Lab Fault Reporter{% endblock %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-md-7 col-lg-6">
        <div class="card custom-card shadow-sm border-0">
            <div class="card-header bg-primary text-white text-center py-3 rounded-top">
                <h4 class="mb-0 fw-bold"><i class="bi bi-person-plus-fill me-2"></i> Student Registration</h4>
            </div>
            <div class="card-body p-4">
                <form action="{{ url_for('register') }}" method="POST">
                    <div class="mb-3">
                        <label for="student_name" class="form-label fw-semibold"><i class="bi bi-person me-1"></i> Student Name</label>
                        <input type="text" class="form-control" id="student_name" name="student_name" placeholder="e.g. John Doe" required>
                    </div>

                    <div class="mb-3">
                        <label for="register_number" class="form-label fw-semibold"><i class="bi bi-card-heading me-1"></i> Register Number</label>
                        <input type="text" class="form-control" id="register_number" name="register_number" placeholder="e.g. 23MCA001" required>
                    </div>

                    <div class="mb-3">
                        <label for="department" class="form-label fw-semibold"><i class="bi bi-building me-1"></i> Department</label>
                        <input type="text" class="form-control" id="department" name="department" placeholder="e.g. Master of Computer Applications (MCA)" value="Computer Applications (MCA)" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold"><i class="bi bi-envelope me-1"></i> Email Address</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="e.g. student@college.edu" required>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold"><i class="bi bi-lock me-1"></i> Password</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter a secure password" required>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg fw-bold">
                            <i class="bi bi-check-circle-fill me-1"></i> Register
                        </button>
                    </div>
                </form>
            </div>
            <div class="card-footer text-center py-3 bg-light">
                <p class="mb-0 text-muted">Already registered? <a href="{{ url_for('login') }}" class="text-primary fw-bold">Login Here</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
