{% extends 'base.html' %}

{% block title %}Student Registration - Workshop Portal{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">
            <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                <div class="card-header card-steel-header p-4 text-center">
                    <h4 class="fw-bold mb-1"><i class="bi bi-person-plus-fill text-mint me-2"></i> Student Registration</h4>
                    <p class="small text-light opacity-75 mb-0">Create your account to browse and register for academic workshops</p>
                </div>
                <div class="card-body p-4 p-md-5">
                    <form action="{{ url_for('register') }}" method="POST" class="needs-validation" novalidate>

                        <div class="row g-3">
                            <!-- Student Name -->
                            <div class="col-md-12">
                                <label for="name" class="form-label fw-semibold text-steel-blue">Full Name <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-steel-blue"><i class="bi bi-person"></i></span>
                                    <input type="text" class="form-control" id="name" name="name" placeholder="e.g. Alex Johnson" required>
                                </div>
                            </div>

                            <!-- Register Number -->
                            <div class="col-md-6">
                                <label for="register_number" class="form-label fw-semibold text-steel-blue">Register Number <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-steel-blue"><i class="bi bi-card-text"></i></span>
                                    <input type="text" class="form-control" id="register_number" name="register_number" placeholder="e.g. 21MCA001" required>
                                </div>
                            </div>

                            <!-- Department -->
                            <div class="col-md-6">
                                <label for="department" class="form-label fw-semibold text-steel-blue">Department <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-steel-blue"><i class="bi bi-building"></i></span>
                                    <input type="text" class="form-control" id="department" name="department" value="Master of Computer Applications (MCA)" required>
                                </div>
                            </div>

                            <!-- Academic Year -->
                            <div class="col-md-6">
                                <label for="year" class="form-label fw-semibold text-steel-blue">Academic Year <span class="text-danger">*</span></label>
                                <select class="form-select" id="year" name="year" required>
                                    <option value="" selected disabled>Select Academic Year</option>
                                    <option value="1st Year">1st Year</option>
                                    <option value="2nd Year">2nd Year</option>
                                </select>
                            </div>

                            <!-- Phone Number -->
                            <div class="col-md-6">
                                <label for="phone_number" class="form-label fw-semibold text-steel-blue">Phone Number <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-steel-blue"><i class="bi bi-telephone"></i></span>
                                    <input type="tel" class="form-control" id="phone_number" name="phone_number" placeholder="e.g. 9876543210" required pattern="[0-9]{10}">
                                </div>
                            </div>

                            <!-- Email -->
                            <div class="col-md-12">
                                <label for="email" class="form-label fw-semibold text-steel-blue">Email Address <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-steel-blue"><i class="bi bi-envelope"></i></span>
                                    <input type="email" class="form-control" id="email" name="email" placeholder="e.g. student@college.edu" required>
                                </div>
                            </div>

                            <!-- Password -->
                            <div class="col-md-12">
                                <label for="password" class="form-label fw-semibold text-steel-blue">Password <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light text-steel-blue"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" id="password" name="password" placeholder="Create a secure password" minlength="6" required>
                                </div>
                            </div>
                        </div>

                        <div class="mt-4">
                            <button type="submit" class="btn btn-magenta w-100 py-2 rounded-pill fs-6 shadow-sm">
                                <i class="bi bi-check-circle-fill me-1"></i> Register Student Account
                            </button>
                        </div>
                    </form>
                </div>
                <div class="card-footer bg-light p-3 text-center border-0">
                    <span class="text-muted small">Already registered? </span>
                    <a href="{{ url_for('login') }}" class="text-magenta fw-bold text-decoration-none small">Login Here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
