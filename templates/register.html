{% extends 'base.html' %}

{% block title %}Student Registration - EduTrack Hub{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card shadow-lg border-0">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center bg-white bg-opacity-10 rounded-circle mb-3" style="width: 70px; height: 70px;">
                            <i class="bi bi-person-plus-fill fs-1 text-info"></i>
                        </div>
                        <h2 class="fw-bold gradient-text">Student Registration</h2>
                        <p class="text-white-50 small">Create your account to track courses and certificates</p>
                    </div>

                    <form method="POST" action="{{ url_for('register') }}">
                        <div class="mb-3">
                            <label for="name" class="form-label">
                                <i class="bi bi-person me-1 text-info"></i> Student Name
                            </label>
                            <input type="text" class="form-control" id="name" name="name" placeholder="Enter full name" required>
                        </div>

                        <div class="mb-3">
                            <label for="register_number" class="form-label">
                                <i class="bi bi-card-heading me-1 text-warning"></i> Register Number
                            </label>
                            <input type="text" class="form-control" id="register_number" name="register_number" placeholder="e.g. 21MCA001" required>
                        </div>

                        <div class="mb-3">
                            <label for="department" class="form-label">
                                <i class="bi bi-building me-1 text-pink" style="color: #f472b6;"></i> Department
                            </label>
                            <input type="text" class="form-control" id="department" name="department" placeholder="e.g. Computer Science / MCA" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label">
                                <i class="bi bi-envelope me-1 text-primary"></i> Email Address
                            </label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="student@college.edu" required>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label">
                                <i class="bi bi-lock me-1 text-danger"></i> Password
                            </label>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Create strong password" required>
                        </div>

                        <button type="submit" class="btn btn-gradient-pink w-100 py-2.5 fw-bold fs-6">
                            <i class="bi bi-check-circle me-1"></i> Register Now
                        </button>
                    </form>

                    <hr class="border-white border-opacity-10 my-4">

                    <div class="text-center text-white-50 small">
                        Already have an account?
                        <a href="{{ url_for('login') }}" class="text-info fw-semibold text-decoration-none ms-1">
                            Login here <i class="bi bi-arrow-right-short"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
