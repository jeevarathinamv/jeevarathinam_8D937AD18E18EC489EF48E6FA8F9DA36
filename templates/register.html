{% extends "base.html" %}

{% block title %}Customer Registration - Service Business System{% endblock %}

{% block content %}
<div class="container my-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card content-card border-0 shadow-lg p-3 p-md-4">
                <div class="card-body">
                    <div class="text-center mb-4">
                        <div class="icon-circle mx-auto mb-3 bg-raspberry-subtle text-raspberry">
                            <i class="bi bi-person-plus-fill fs-2"></i>
                        </div>
                        <h3 class="fw-bold text-violet">Customer Registration</h3>
                        <p class="text-secondary small">Create an account to book and manage your service requests</p>
                    </div>

                    <form action="{{ url_for('register') }}" method="POST" id="registerForm">
                        <div class="mb-3">
                            <label for="name" class="form-label fw-medium text-dark"><i class="bi bi-person text-primary me-1"></i> Full Name</label>
                            <input type="text" class="form-control form-control-lg rounded-3" id="name" name="name" placeholder="Enter your full name" required>
                        </div>

                        <div class="mb-3">
                            <label for="phone" class="form-label fw-medium text-dark"><i class="bi bi-telephone text-primary me-1"></i> Phone Number</label>
                            <input type="tel" class="form-control form-control-lg rounded-3" id="phone" name="phone" placeholder="Enter phone number" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-medium text-dark"><i class="bi bi-envelope text-primary me-1"></i> Email Address</label>
                            <input type="email" class="form-control form-control-lg rounded-3" id="email" name="email" placeholder="name@example.com" required>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-medium text-dark"><i class="bi bi-lock text-primary me-1"></i> Password</label>
                            <input type="password" class="form-control form-control-lg rounded-3" id="password" name="password" placeholder="Create a secure password" required minlength="6">
                        </div>

                        <button type="submit" class="btn btn-raspberry btn-lg w-100 rounded-pill shadow-sm fw-semibold mb-3">
                            <i class="bi bi-check-circle me-1"></i> Register Account
                        </button>
                    </form>

                    <div class="text-center mt-3 pt-3 border-top">
                        <p class="text-secondary mb-0 small">Already have an account?
                            <a href="{{ url_for('login') }}" class="text-primary fw-bold text-decoration-none">Log in here</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
