{% extends "base.html" %}

{% block title %}Edit Book - College Library System{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">
            <div class="card border-0 shadow-lg rounded-3">
                <div class="card-header card-header-royal py-3">
                    <h5 class="fw-bold mb-0 text-white"><i class="bi bi-pencil-square me-2 text-warning"></i>Edit Book Details</h5>
                </div>
                <div class="card-body p-4 p-md-5">
                    <form action="{{ url_for('edit_book', book_id=book.id) }}" method="POST">
                        <div class="mb-3">
                            <label for="book_name" class="form-label fw-semibold">Book Name / Title</label>
                            <input type="text" class="form-control" id="book_name" name="book_name" value="{{ book.book_name }}" required>
                        </div>

                        <div class="mb-3">
                            <label for="author_name" class="form-label fw-semibold">Author Name</label>
                            <input type="text" class="form-control" id="author_name" name="author_name" value="{{ book.author_name }}" required>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6 mb-3 mb-md-0">
                                <label for="isbn" class="form-label fw-semibold">ISBN Code</label>
                                <input type="text" class="form-control" id="isbn" name="isbn" value="{{ book.isbn }}" required>
                            </div>
                            <div class="col-md-6">
                                <label for="category" class="form-label fw-semibold">Category</label>
                                <select class="form-select" id="category" name="category" required>
                                    {% for cat in categories %}
                                        <option value="{{ cat }}" {% if book.category == cat %}selected{% endif %}>{{ cat }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <div class="row mb-4">
                            <div class="col-md-6 mb-3 mb-md-0">
                                <label for="total_copies" class="form-label fw-semibold">Total Copies</label>
                                <input type="number" class="form-control" id="total_copies" name="total_copies" min="0" value="{{ book.total_copies }}" required>
                            </div>
                            <div class="col-md-6">
                                <label for="available_copies" class="form-label fw-semibold">Available Copies</label>
                                <input type="number" class="form-control" id="available_copies" name="available_copies" min="0" value="{{ book.available_copies }}" required>
                                <div class="form-text">Must not exceed Total Copies.</div>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                            <a href="{{ url_for('manage_books') }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Cancel</a>
                            <button type="submit" class="btn btn-primary fw-bold px-4"><i class="bi bi-check-circle me-1"></i> Update Book</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
