{% extends 'base.html' %}

{% block title %}Edit Book - Admin Portal{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card form-card p-4 p-md-5 bg-white">
                <div class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom">
                    <div>
                        <h3 class="fw-bold text-dark mb-1"><i class="bi bi-pencil-square text-cyan me-2"></i> Edit Digital Book</h3>
                        <p class="text-muted small mb-0">Modify details or update the PDF document for this book.</p>
                    </div>
                    <a href="{{ url_for('manage_books') }}" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
                        <i class="bi bi-arrow-left me-1"></i> Back to Manage Books
                    </a>
                </div>

                <form action="{{ url_for('edit_book', book_id=book.id) }}" method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label for="title" class="form-label">Book Name / Title <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="title" name="title" value="{{ book.title }}" required>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="author" class="form-label">Author Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="author" name="author" value="{{ book.author }}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="category" class="form-label">Category <span class="text-danger">*</span></label>
                            <select class="form-select" id="category" name="category" required>
                                {% for cat in categories %}
                                    <option value="{{ cat }}" {% if book.category == cat %}selected{% endif %}>{{ cat }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">Book Description</label>
                        <textarea class="form-control" id="description" name="description" rows="4">{{ book.description or '' }}</textarea>
                    </div>

                    <div class="mb-4">
                        <label for="file" class="form-label">Replace PDF File <span class="text-muted">(Optional)</span></label>
                        <input type="file" class="form-control" id="file" name="file" accept=".pdf,application/pdf">
                        <div class="form-text text-muted mt-2">
                            Current file: <strong>{{ book.filename }}</strong>. Leave blank to keep existing file.
                        </div>
                    </div>

                    <div class="d-flex gap-2 pt-2">
                        <button type="submit" class="btn btn-cyan px-4 rounded-pill fw-bold">
                            <i class="bi bi-check-lg me-1"></i> Save Changes
                        </button>
                        <a href="{{ url_for('manage_books') }}" class="btn btn-light px-4 rounded-pill">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
