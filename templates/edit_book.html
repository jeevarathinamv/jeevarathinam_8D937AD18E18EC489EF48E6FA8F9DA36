{% extends "base.html" %}

{% block title %}Edit Book - Library Fine System{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="card-header card-header-maroon py-3 text-center">
                    <h4 class="fw-bold mb-0"><i class="bi bi-pencil-square text-gold me-2"></i>Edit Book Details</h4>
                </div>
                <div class="card-body p-4 bg-white">
                    <form action="{{ url_for('edit_book', book_id=book.id) }}" method="POST" class="needs-validation" novalidate>
                        <div class="mb-3">
                            <label for="book_name" class="form-label fw-semibold">Book Name</label>
                            <input type="text" class="form-control" id="book_name" name="book_name" value="{{ book.book_name }}" required>
                        </div>

                        <div class="mb-3">
                            <label for="author_name" class="form-label fw-semibold">Author Name</label>
                            <input type="text" class="form-control" id="author_name" name="author_name" value="{{ book.author_name }}" required>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="book_code" class="form-label fw-semibold">Book Code</label>
                                <input type="text" class="form-control text-uppercase" id="book_code" name="book_code" value="{{ book.book_code }}" required>
                            </div>
                            <div class="col-md-6">
                                <label for="category" class="form-label fw-semibold">Category</label>
                                <select class="form-select" id="category" name="category" required>
                                    <option value="Computer Science" {% if book.category == 'Computer Science' %}selected{% endif %}>Computer Science</option>
                                    <option value="Information Technology" {% if book.category == 'Information Technology' %}selected{% endif %}>Information Technology</option>
                                    <option value="Electronics & Communication" {% if book.category == 'Electronics & Communication' %}selected{% endif %}>Electronics & Communication</option>
                                    <option value="Mechanical Engineering" {% if book.category == 'Mechanical Engineering' %}selected{% endif %}>Mechanical Engineering</option>
                                    <option value="Management & Commerce" {% if book.category == 'Management & Commerce' %}selected{% endif %}>Management & Commerce</option>
                                    <option value="Mathematics & General" {% if book.category == 'Mathematics & General' %}selected{% endif %}>Mathematics & General</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="available_copies" class="form-label fw-semibold">Available Copies</label>
                            <input type="number" class="form-control" id="available_copies" name="available_copies" min="0" value="{{ book.available_copies }}" required>
                        </div>

                        <div class="d-flex justify-content-between align-items-center pt-2">
                            <a href="{{ url_for('manage_books') }}" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
                            <button type="submit" class="btn btn-maroon rounded-pill px-4 fw-semibold"><i class="bi bi-check-circle me-1"></i> Update Book</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
