{% extends "base.html" %}

{% block title %}Admin Login - Assignment Tracker{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-theme p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center bg-purple bg-opacity-10 rounded-circle p-3 mb-3" style="background-color: rgba(106, 27, 154, 0.1);">
                        <i class="bi bi-shield-lock-fill fs-1" style="color: #6a1b9a;"></i>
                    </div>
                    <h3 class="fw-bold text-dark mb-1">Admin Portal</h3>
                    <p class="text-muted small">Manage assignments, track student submissions & deadlines</p>
                </div>

                <form method="POST" action="{{ url_for('admin_login') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold text-secondary">
                            <i class="bi bi-person-fill text-info me-1"></i> Admin Username
                        </label>
                        <input type="text" class="form-control form-control-lg rounded-3" id="username" name="username" placeholder="Enter Admin Username" required autofocus>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold text-secondary">
                            <i class="bi bi-key-fill text-info me-1"></i> Admin Password
                        </label>
                        <input type="password" class="form-control form-control-lg rounded-3" id="password" name="password" placeholder="Enter Admin Password" required>
                    </div>

                    <div class="d-grid gap-2 mb-3">
                        <button type="submit" class="btn btn-purple btn-lg">
                            <i class="bi bi-shield-check me-1"></i> Login as Administrator
                        </button>
                    </div>
                </form>

                <div class="text-center mt-3 pt-3 border-top">
                    <a href="{{ url_for('login') }}" class="btn btn-cyan btn-sm fw-semibold">
                        <i class="bi bi-arrow-left me-1"></i> Back to Student Login
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
