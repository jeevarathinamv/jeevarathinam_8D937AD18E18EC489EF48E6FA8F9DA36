{% extends "base.html" %}

{% block title %}Admin Login - Library Fine System{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="card-header bg-dark text-white py-3 text-center border-bottom border-warning">
                    <h4 class="fw-bold mb-0"><i class="bi bi-shield-lock-fill me-2 text-gold"></i>Admin Login</h4>
                </div>
                <div class="card-body p-4 bg-white">
                    <!-- Sample Credentials Notice for Demo -->
                    <div class="alert alert-warning py-2 px-3 small rounded-3 mb-3 border-0">
                        <i class="bi bi-info-circle-fill me-1 text-dark"></i>
                        <strong>Demo Credentials:</strong><br>
                        Username: <code>admin</code> | Password: <code>admin123</code>
                    </div>

                    <form action="{{ url_for('admin_login') }}" method="POST" class="needs-validation" novalidate>
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold">Admin Username</label>
                            <div class="input-group">
                                <span class="input-group-text bg-cream border-end-0"><i class="bi bi-person-badge text-maroon"></i></span>
                                <input type="text" class="form-control border-start-0" id="username" name="username" placeholder="Enter admin username" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-cream border-end-0"><i class="bi bi-key text-maroon"></i></span>
                                <input type="password" class="form-control border-start-0" id="password" name="password" placeholder="Enter admin password" required>
                            </div>
                        </div>

                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-maroon btn-lg fw-semibold rounded-pill py-2">
                                <i class="bi bi-shield-check me-1"></i> Admin Login
                            </button>
                        </div>

                        <div class="text-center pt-2 border-top">
                            <a href="{{ url_for('login') }}" class="text-muted small fw-medium"><i class="bi bi-arrow-left me-1"></i>Back to Student Login</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% block scripts %}{% endblock %}
{% endblock %}
