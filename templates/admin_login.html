{% extends "base.html" %}

{% block title %}Admin Portal Login - Service Business System{% endblock %}

{% block content %}
<div class="container my-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
            <div class="card content-card border-0 shadow-lg p-3 p-md-4">
                <div class="card-body">
                    <div class="text-center mb-4">
                        <div class="icon-circle mx-auto mb-3 bg-raspberry-subtle text-raspberry">
                            <i class="bi bi-shield-lock-fill fs-2"></i>
                        </div>
                        <h3 class="fw-bold text-violet">Admin Login</h3>
                        <p class="text-secondary small">Administrative Access Portal</p>
                    </div>

                    <form action="{{ url_for('admin_login') }}" method="POST">
                        <div class="mb-3">
                            <label for="username" class="form-label fw-medium text-dark"><i class="bi bi-person-badge text-primary me-1"></i> Admin Username</label>
                            <input type="text" class="form-control form-control-lg rounded-3" id="username" name="username" placeholder="admin" value="admin" required>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-medium text-dark"><i class="bi bi-key text-primary me-1"></i> Admin Password</label>
                            <input type="password" class="form-control form-control-lg rounded-3" id="password" name="password" placeholder="admin123" value="admin123" required>
                        </div>

                        <div class="alert alert-info border-0 rounded-3 small mb-4 py-2 px-3">
                            <i class="bi bi-info-circle me-1"></i> <strong>Default Credentials:</strong><br>
                            Username: <code class="text-dark fw-bold">admin</code> | Password: <code class="text-dark fw-bold">admin123</code>
                        </div>

                        <button type="submit" class="btn btn-raspberry btn-lg w-100 rounded-pill shadow-sm fw-semibold mb-3">
                            <i class="bi bi-shield-check me-1"></i> Login as Admin
                        </button>
                    </form>

                    <div class="text-center mt-3 pt-3 border-top">
                        <p class="text-secondary mb-0 small">Customer login?
                            <a href="{{ url_for('login') }}" class="text-primary fw-bold text-decoration-none">Customer Login</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
