{% extends 'base.html' %}

{% block title %}Admin Login - EduTrack Hub{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg border-0">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center bg-danger bg-opacity-20 rounded-circle mb-3" style="width: 70px; height: 70px;">
                            <i class="bi bi-shield-lock-fill fs-1 text-danger"></i>
                        </div>
                        <h2 class="fw-bold gradient-text">Admin Login</h2>
                        <p class="text-white-50 small">Manage students, courses, and certifications</p>
                    </div>

                    <form method="POST" action="{{ url_for('admin_login') }}">
                        <div class="mb-3">
                            <label for="username" class="form-label">
                                <i class="bi bi-person-badge me-1 text-warning"></i> Admin Username
                            </label>
                            <input type="text" class="form-control" id="username" name="username" placeholder="Enter admin username" required>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label">
                                <i class="bi bi-key me-1 text-danger"></i> Admin Password
                            </label>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Enter admin password" required>
                        </div>

                        <button type="submit" class="btn btn-gradient-pink w-100 py-2.5 fw-bold fs-6">
                            <i class="bi bi-shield-check me-1"></i> Admin Login
                        </button>
                    </form>

                    <div class="alert alert-info border-0 rounded-3 mt-4 mb-0 py-2 small text-center bg-white bg-opacity-10 text-white">
                        <i class="bi bi-info-circle me-1 text-info"></i> Default Admin Credentials: <code class="text-warning">admin</code> / <code class="text-warning">admin123</code>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
