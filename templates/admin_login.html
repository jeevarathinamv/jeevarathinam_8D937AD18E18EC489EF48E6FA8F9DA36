{% extends "base.html" %}

{% block title %}Admin Login - Library New Book Request System{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4">
                <div class="card-header bg-gradient-purple text-white text-center py-4 rounded-top-4">
                    <h3 class="fw-bold mb-1"><i class="bi bi-shield-lock-fill me-2"></i> Admin Login</h3>
                    <p class="small mb-0 opacity-80">Library Administrator Portal</p>
                </div>
                <div class="card-body p-4 p-md-5">
                    <div class="alert alert-info border-0 rounded-3 small mb-4">
                        <i class="bi bi-info-circle-fill me-1"></i> <strong>Default Credentials:</strong><br>
                        Username: <code>admin</code> | Password: <code>admin123</code>
                    </div>

                    <form action="{{ url_for('admin_login') }}" method="POST" class="needs-validation" novalidate>
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold">Admin Username</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-person-badge-fill"></i></span>
                                <input type="text" class="form-control" id="username" name="username" placeholder="Enter admin username" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-lock-fill"></i></span>
                                <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-purple w-100 py-2.5 rounded-3 fw-bold text-uppercase mb-3 shadow-sm">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Login as Admin
                        </button>
                    </form>

                    <div class="text-center mt-3 pt-3 border-top">
                        <p class="small text-muted mb-0">Are you a Student? <a href="{{ url_for('login') }}" class="text-primary fw-bold text-decoration-none">Student Login</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
