{% extends 'base.html' %}

{% block title %}Admin Login - Small Business Online Enquiry{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-custom p-4">
                <div class="card-header-peach p-3 text-center mb-4">
                    <h4 class="fw-bold mb-0"><i class="bi bi-shield-lock-fill me-2"></i> Admin Portal Login</h4>
                    <p class="small mb-0 opacity-90">Authorized Admin Access Only</p>
                </div>

                <form action="{{ url_for('admin_login') }}" method="POST" class="needs-validation" novalidate>
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">Username <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-white text-peach"><i class="bi bi-person-badge-fill"></i></span>
                            <input type="text" class="form-control" id="username" name="username" placeholder="Enter admin username" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-white text-peach"><i class="bi bi-key-fill"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                        </div>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-peach btn-lg">
                            <i class="bi bi-box-arrow-in-right me-2"></i> Log In
                        </button>
                    </div>
                </form>

                <!-- Demo Login Box -->
                <div class="alert alert-custom text-center mb-0 mt-3 p-3">
                    <small class="fw-bold text-dark d-block mb-1"><i class="bi bi-info-circle-fill text-cyan me-1"></i> Demo Admin Login Credentials:</small>
                    <code class="fs-6 text-dark bg-white px-2 py-1 rounded">Username: <strong>admin</strong> | Password: <strong>admin123</strong></code>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
