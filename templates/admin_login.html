{% extends "base.html" %}

{% block title %}Admin Login - Alumni Mentorship Portal{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card card-custom shadow-lg">
            <div class="card-header-gradient text-center py-4">
                <h3 class="fw-bold mb-1"><i class="bi bi-shield-lock-fill me-2"></i>Administrator Login</h3>
                <p class="small mb-0 opacity-90">Portal management and system oversight</p>
            </div>
            <div class="card-body p-4">
                <form action="{{ url_for('admin_login') }}" method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold text-dark">
                            <i class="bi bi-person-fill me-1 text-primary"></i> Admin Username
                        </label>
                        <input type="text" class="form-control" id="username" name="username" placeholder="Enter admin username" required>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold text-dark">
                            <i class="bi bi-lock-fill me-1 text-purple"></i> Admin Password
                        </label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter admin password" required>
                    </div>

                    <button type="submit" class="btn btn-gradient-pink w-100 py-2 fs-5 fw-bold mb-3">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Login as Administrator
                    </button>

                    <div class="text-center pt-2 border-top">
                        <small class="text-muted">Default Credentials for Demo: <strong>admin</strong> / <strong>admin123</strong></small>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
