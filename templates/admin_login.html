{% extends 'base.html' %}

{% block title %}Administrator Login - College Digital Library{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card form-card p-4 p-md-5 bg-white">
                <div class="text-center mb-4">
                    <div class="stat-icon stat-icon-orange mx-auto mb-3">
                        <i class="bi bi-shield-lock-fill"></i>
                    </div>
                    <h3 class="fw-bold text-dark">Admin Portal Login</h3>
                    <p class="text-muted small">Enter administrator credentials to manage library resources.</p>
                </div>

                <form action="{{ url_for('admin_login') }}" method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label">Admin Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-person-shield text-secondary"></i></span>
                            <input type="text" class="form-control" id="username" name="username" placeholder="Default: admin" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label">Admin Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-key text-secondary"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Default: admin123" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-orange w-100 py-2 rounded-3 fw-bold mb-3">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Admin Sign In
                    </button>

                    <div class="text-center pt-2 border-top">
                        <a href="{{ url_for('login') }}" class="text-decoration-none small text-muted">
                            <i class="bi bi-arrow-left me-1"></i> Back to Student Login
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
