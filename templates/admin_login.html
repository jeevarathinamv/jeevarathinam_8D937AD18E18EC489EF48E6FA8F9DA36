{% extends 'base.html' %}

{% block title %}Admin Login - Hostel Room Change System{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-custom p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="icon-box-purple mx-auto mb-3">
                        <i class="bi bi-shield-lock-fill"></i>
                    </div>
                    <h3 class="fw-bold">Administrator Login</h3>
                    <p class="text-muted small">Sign in to manage hostel rooms and change requests</p>
                </div>

                <form action="{{ url_for('admin_login') }}" method="POST" class="needs-validation" novalidate>
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">Admin Username <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-person-badge"></i></span>
                            <input type="text" class="form-control" id="username" name="username" placeholder="Username" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">Admin Password <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-purple w-100 py-2 mb-3">
                        <i class="bi bi-shield-check me-1"></i> Admin Login
                    </button>

                    <div class="p-3 bg-light rounded-3 text-center mb-3">
                        <small class="text-muted d-block fw-semibold mb-1"><i class="bi bi-info-circle me-1"></i> Demo Credentials</small>
                        <small class="text-dark">Username: <strong>admin</strong> | Password: <strong>admin123</strong></small>
                    </div>

                    <div class="text-center text-muted small">
                        Are you a student? <a href="{{ url_for('login') }}" class="text-primary fw-semibold">Student Login</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
