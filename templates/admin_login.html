{% extends 'base.html' %}

{% block title %}Admin Login - College Academic Calendar Management System{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow border-0">
                <div class="card-header header-gradient-teal text-white text-center py-3">
                    <span class="badge bg-warning text-dark mb-1">Administrator Portal</span>
                    <h4 class="mb-0 fw-bold"><i class="bi bi-shield-lock-fill me-2"></i>Admin Login</h4>
                </div>
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('admin_login') }}">
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold">Admin Username <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person-gear"></i></span>
                                <input type="text" class="form-control" id="username" name="username" placeholder="Username" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-key"></i></span>
                                <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-teal btn-lg fw-bold rounded-pill shadow-sm">
                                <i class="bi bi-shield-check me-1"></i> Admin Login
                            </button>
                        </div>
                    </form>

                    <div class="mt-4 p-3 bg-light rounded border">
                        <small class="text-muted d-block fw-semibold mb-1"><i class="bi bi-info-circle me-1 text-primary"></i> Default Sample Credentials:</small>
                        <small class="text-muted">Username: <strong>admin</strong> | Password: <strong>admin123</strong></small>
                    </div>
                </div>
                <div class="card-footer bg-light text-center py-3">
                    <p class="mb-0 text-muted small">Are you a Student? <a href="{{ url_for('login') }}" class="fw-bold text-primary text-decoration-none">Student Login</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
