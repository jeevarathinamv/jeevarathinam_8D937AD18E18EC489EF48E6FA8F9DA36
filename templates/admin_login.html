{% extends 'base.html' %}

{% block title %}Admin Login - College Student Grievance Portal{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-custom p-4 p-md-5" style="border-top: 5px solid #fbbf24;">
                <div class="text-center mb-4">
                    <div class="icon-box-cyan mx-auto mb-3" style="width: 60px; height: 60px; font-size: 1.8rem; background: rgba(251, 191, 36, 0.15); color: #fbbf24;">
                        <i class="bi bi-shield-lock-fill"></i>
                    </div>
                    <h3 class="fw-bold text-white mb-1">Administrator Portal</h3>
                    <p class="text-muted small">Sign in to manage student grievances</p>
                </div>

                <form action="{{ url_for('admin_login') }}" method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label text-light fw-medium"><i class="bi bi-person-fill me-1 text-warning"></i> Admin Username</label>
                        <input type="text" class="form-control form-control-custom py-2" id="username" name="username" placeholder="Enter admin username" required>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label text-light fw-medium"><i class="bi bi-key-fill me-1 text-warning"></i> Password</label>
                        <input type="password" class="form-control form-control-custom py-2" id="password" name="password" placeholder="Enter admin password" required>
                    </div>

                    <button type="submit" class="btn btn-warning w-100 py-2 fs-6 fw-bold text-dark mb-3">
                        <i class="bi bi-shield-check me-1"></i> Admin Login
                    </button>

                    <div class="text-center text-muted small mt-2">
                        Are you a student? <a href="{{ url_for('login') }}" class="text-info text-decoration-none fw-semibold">Student Portal</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
