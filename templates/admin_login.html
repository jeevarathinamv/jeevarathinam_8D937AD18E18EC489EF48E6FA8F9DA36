{% extends 'base.html' %}

{% block title %}Admin Login - Workshop Portal{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                <div class="card-header bg-dark text-white p-4 text-center">
                    <div class="icon-shape bg-warning text-dark mx-auto mb-2">
                        <i class="bi bi-shield-lock-fill fs-3"></i>
                    </div>
                    <h4 class="fw-bold mb-1">Admin Portal Login</h4>
                    <p class="small text-white-50 mb-0">System Administrator Authentication</p>
                </div>
                <div class="card-body p-4 p-md-5">
                    <form action="{{ url_for('admin_login') }}" method="POST" class="needs-validation" novalidate>

                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold text-steel-blue">Username <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-steel-blue"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control" id="username" name="username" placeholder="e.g. admin" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold text-steel-blue">Password <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-steel-blue"><i class="bi bi-key"></i></span>
                                <input type="password" class="form-control" id="password" name="password" placeholder="Enter admin password" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-dark w-100 py-2 rounded-pill shadow-sm fw-semibold">
                            <i class="bi bi-shield-check me-1"></i> Authenticate Administrator
                        </button>
                    </form>
                </div>
                <div class="card-footer bg-light p-3 text-center border-0">
                    <span class="text-muted small">Sample Admin Credentials: </span>
                    <code class="text-dark">admin / admin123</code>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
