{% extends "base.html" %}

{% block title %}Admin Login - College Library System{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-lg rounded-3">
                <div class="card-header bg-dark text-white text-center py-4">
                    <i class="bi bi-shield-lock-fill fs-1 text-warning mb-2 d-block"></i>
                    <h4 class="fw-bold mb-1">Administrator Login</h4>
                    <p class="small mb-0 text-white-50">Manage books, issue records, and students</p>
                </div>
                <div class="card-body p-4 p-md-5">
                    <div class="alert alert-info py-2 small mb-4">
                        <i class="bi bi-info-circle-fill me-1"></i> <strong>Demo Credentials:</strong><br>
                        Username: <code>admin</code> | Password: <code>admin123</code>
                    </div>

                    <form action="{{ url_for('admin_login') }}" method="POST">
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold">Username</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-person-badge"></i></span>
                                <input type="text" class="form-control" id="username" name="username" placeholder="Enter admin username" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-key-fill"></i></span>
                                <input type="password" class="form-control" id="password" name="password" placeholder="Enter admin password" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-dark w-100 py-2.5 fw-bold shadow-sm">
                            <i class="bi bi-shield-check me-1"></i> Admin Sign In
                        </button>
                    </form>

                    <div class="text-center mt-4 pt-3 border-top">
                        <p class="small text-muted mb-0"><a href="{{ url_for('login') }}" class="text-primary text-decoration-none"><i class="bi bi-arrow-left me-1"></i> Back to Student Login</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
