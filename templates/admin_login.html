{% extends "base.html" %}

{% block title %}Admin Login - Student Study Partner Finder{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg border-0 overflow-hidden rounded-4">
                <div class="card-header bg-gradient-blue-purple text-white text-center py-4">
                    <div class="icon-circle icon-pink mb-2 mx-auto">
                        <i class="bi bi-shield-lock-fill"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Admin Login</h3>
                    <p class="small text-white-50 mb-0">System Management Portal</p>
                </div>
                <div class="card-body p-4 p-md-5">
                    <form action="{{ url_for('admin_login') }}" method="POST">
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold text-dark">
                                <i class="bi bi-person-fill text-purple me-1"></i> Admin Username
                            </label>
                            <input type="text" class="form-control" id="username" name="username" placeholder="Enter admin username" required>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold text-dark">
                                <i class="bi bi-key-fill text-pink me-1"></i> Admin Password
                            </label>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Enter admin password" required>
                        </div>

                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-gradient btn-lg rounded-pill shadow">
                                <i class="bi bi-shield-check me-2"></i> Access Admin Portal
                            </button>
                        </div>

                        <div class="text-center mt-3">
                            <p class="text-muted small mb-0">Default Admin Credentials: <code>admin</code> / <code>admin123</code></p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
