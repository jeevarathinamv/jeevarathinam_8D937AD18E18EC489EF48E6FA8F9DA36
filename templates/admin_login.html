{% extends "base.html" %}

{% block title %}Admin Login - Student Career Goal Tracker{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center my-4">
    <div class="col-md-6 col-lg-5">
        <div class="card auth-card border-warning">
            <div class="auth-header">
                <i class="bi bi-shield-lock-fill text-warning"></i>
                <h3 class="fw-bold text-dark">Admin Login</h3>
                <p class="text-muted small">Administrator & Faculty Management Portal</p>
            </div>

            <form action="{{ url_for('admin_login') }}" method="POST">
                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold">Admin Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-person-fill text-warning"></i></span>
                        <input type="text" class="form-control" id="username" name="username" placeholder="Enter Admin Username" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-key-fill text-warning"></i></span>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter Password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-warning w-100 py-2 fs-6 fw-bold">
                    <i class="bi bi-shield-check me-1"></i> Admin Sign In
                </button>
            </form>

            <div class="text-center mt-4 pt-3 border-top">
                <div class="alert alert-info py-2 px-3 mb-2 small text-start">
                    <i class="bi bi-info-circle-fill me-1"></i> <strong>Default Credentials:</strong><br>
                    Username: <code>admin</code> | Password: <code>admin123</code>
                </div>
                <a href="{{ url_for('login') }}" class="btn btn-link text-indigo text-decoration-none fw-semibold">
                    <i class="bi bi-arrow-left me-1"></i> Back to Student Login
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
