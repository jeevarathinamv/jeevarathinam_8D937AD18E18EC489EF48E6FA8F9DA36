{% extends 'base.html' %}

{% block title %}Allocate Room - Hostel System{% endblock %}

{% block content %}
<div class="container my-4">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-6">
            <div class="card card-custom shadow">
                <div class="card-header card-header-green text-center py-3">
                    <h4 class="mb-0"><i class="fa-solid fa-user-plus me-2"></i>Allocate Room to Student</h4>
                </div>
                <div class="card-body p-4">
                    <form action="{{ url_for('allocate_room') }}" method="POST" class="needs-validation" novalidate>
                        <div class="mb-3">
                            <label for="student_id" class="form-label fw-medium">Select Student</label>
                            <select class="form-select" id="student_id" name="student_id" required>
                                <option value="" selected disabled>-- Select Student --</option>
                                {% for student in students %}
                                    <option value="{{ student.id }}">{{ student.name }} (Reg No: {{ student.register_number }} - {{ student.department }})</option>
                                {% endfor %}
                            </select>
                            <div class="invalid-feedback">Please select a student.</div>
                        </div>

                        <div class="mb-3">
                            <label for="room_id" class="form-label fw-medium">Select Room</label>
                            <select class="form-select" id="room_id" name="room_id" required>
                                <option value="" selected disabled>-- Select Available Room --</option>
                                {% for room in rooms %}
                                    <option value="{{ room.id }}">{{ room.hostel_name }} - Room {{ room.room_number }} ({{ room.room_type }}, {{ room.available_beds }} beds left)</option>
                                {% endfor %}
                            </select>
                            <div class="invalid-feedback">Please select an available room.</div>
                        </div>

                        <div class="mb-3">
                            <label for="allocation_date" class="form-label fw-medium">Allocation Date</label>
                            <input type="date" class="form-control" id="allocation_date" name="allocation_date" value="{{ today }}" required>
                            <div class="invalid-feedback">Please select an allocation date.</div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mt-4">
                            <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-secondary rounded-pill px-4">
                                <i class="fa-solid fa-arrow-left me-1"></i> Cancel
                            </a>
                            <button type="submit" class="btn btn-success rounded-pill fw-bold px-4">
                                <i class="fa-solid fa-check-circle me-1"></i> Confirm Allocation
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
