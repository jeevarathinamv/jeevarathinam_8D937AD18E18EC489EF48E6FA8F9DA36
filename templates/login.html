{% extends "base.html" %}

{% block title %}Student Login - College Canteen Feedback & Complaint System{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="card-header bg-canteen-orange text-white py-3 text-center">
                    <h4 class="fw-bold mb-0"><i class="bi bi-box-arrow-in-right me-2"></i> Student Login</h4>
                    <p class="small text-cream mb-0">Enter your credentials to access student portal</p>
                </div>
                <div class="card-body p-4 bg-white">
                    <form method="POST" action="{{ url_for('login') }}">
                        <div class="mb-3">
                            <label class="form-label fw-semibold"><i class="bi bi-person-badge me-1 text-canteen-orange"></i> Register Number or Email</label>
                            <input type="text" name="email_or_reg" class="form-control rounded-3" placeholder="Register number or Email" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-semibold"><i class="bi bi-lock me-1 text-canteen-orange"></i> Password</label>
                            <input type="password" name="password" class="form-control rounded-3" placeholder="Enter password" required>
                        </div>

                        <button type="submit" class="btn btn-canteen-orange text-white w-100 py-2 rounded-3 fw-bold fs-6 shadow-sm">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Login
                        </button>
                    </form>

                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <a href="{{ url_for('register') }}" class="fw-bold text-canteen-green text-decoration-none small">
                            <i class="bi bi-person-plus me-1"></i> Don't have an account? Register
                        </a>
                        <a href="{{ url_for('admin_login') }}" class="text-muted small text-decoration-none">
                            <i class="bi bi-shield-lock me-1"></i> Admin Login
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
