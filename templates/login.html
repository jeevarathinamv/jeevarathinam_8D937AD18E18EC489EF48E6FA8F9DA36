{% extends 'base.html' %}

{% block title %}Student Login - Hostel System{% endblock %}

{% block content %}
<div class="container my-4">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card card-custom shadow">
                <div class="card-header card-header-blue text-center py-3">
                    <h4 class="mb-0"><i class="fa-solid fa-right-to-bracket me-2"></i>Student Login</h4>
                </div>
                <div class="card-body p-4">
                    <form action="{{ url_for('login') }}" method="POST" class="needs-validation" novalidate>
                        <div class="mb-3">
                            <label for="email_or_reg" class="form-label fw-medium">Email or Register Number</label>
                            <input type="text" class="form-control" id="email_or_reg" name="email_or_reg" placeholder="Enter Email or Register No" required>
                            <div class="invalid-feedback">Please enter your Email or Register Number.</div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label fw-medium">Password</label>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                            <div class="invalid-feedback">Please enter your password.</div>
                        </div>

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-primary btn-lg rounded-pill fw-bold">
                                <i class="fa-solid fa-right-to-bracket me-2"></i> Login
                            </button>
                        </div>
                    </form>
                </div>
                <div class="card-footer text-center bg-white py-3 border-0">
                    <span class="text-muted">Don't have an account?</span>
                    <a href="{{ url_for('register') }}" class="text-primary fw-bold text-decoration-none">Register here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
