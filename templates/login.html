{% extends 'base.html' %}

{% block title %}Student Login - College Digital Document Verification System{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-header bg-navy text-white p-4 text-center rounded-top-4">
                    <h4 class="fw-bold mb-1"><i class="bi bi-box-arrow-in-right text-info me-2"></i>Student Login</h4>
                    <p class="text-light small mb-0">Sign in to manage and view your uploaded documents</p>
                </div>
                <div class="card-body p-4">
                    <form action="{{ url_for('login') }}" method="POST">
                        <div class="mb-3">
                            <label for="email_or_reg" class="form-label fw-medium">Email Address or Register Number <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-person-badge"></i></span>
                                <input type="text" class="form-control" id="email_or_reg" name="email_or_reg" placeholder="Email or Register Number" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-medium">Password <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-cyan w-100 py-2 rounded-pill fw-bold fs-6">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Login
                        </button>
                    </form>
                </div>
                <div class="card-footer bg-light text-center py-3 border-0 rounded-bottom-4">
                    <p class="mb-0 text-muted small">Don't have a student account? <a href="{{ url_for('register') }}" class="text-primary fw-semibold">Register here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
