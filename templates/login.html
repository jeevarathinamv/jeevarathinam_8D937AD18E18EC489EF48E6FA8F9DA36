{% extends "base.html" %}

{% block title %}Admin Login - Business Supplier & Purchase Management System{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">

            <div class="card card-custom p-4 shadow-lg border-0">
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center bg-indigo-subtle rounded-circle mb-3" style="width: 70px; height: 70px;">
                        <i class="bi bi-person-badge-fill fs-1 text-primary"></i>
                    </div>
                    <h3 class="fw-bold text-dark mb-1">Admin Portal</h3>
                    <p class="text-muted small">Enter your credentials to access the management dashboard</p>
                </div>

                <form action="{{ url_for('login') }}" method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold text-dark">
                            <i class="bi bi-person-fill text-primary me-1"></i> Username
                        </label>
                        <input type="text" class="form-control form-control-lg fs-6" id="username" name="username" placeholder="Enter admin username" required autofocus>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold text-dark">
                            <i class="bi bi-key-fill text-primary me-1"></i> Password
                        </label>
                        <input type="password" class="form-control form-control-lg fs-6" id="password" name="password" placeholder="Enter password" required>
                    </div>

                    <button type="submit" class="btn btn-indigo btn-lg w-100 fw-semibold mb-3">
                        <i class="bi bi-box-arrow-in-right me-2"></i> Log In to Dashboard
                    </button>
                </form>

                <div class="alert alert-peach mt-3 mb-0 py-2 px-3 small">
                    <div class="fw-bold mb-1"><i class="bi bi-info-circle-fill me-1"></i> Testing Credentials:</div>
                    <div><strong>Username:</strong> <code>admin</code></div>
                    <div><strong>Password:</strong> <code>admin123</code></div>
                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
