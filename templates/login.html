{% extends "base.html" %}

{% block title %}Customer Login - Service Business System{% endblock %}

{% block content %}
<div class="container my-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
            <div class="card content-card border-0 shadow-lg p-3 p-md-4">
                <div class="card-body">
                    <div class="text-center mb-4">
                        <div class="icon-circle mx-auto mb-3 bg-primary-subtle text-primary">
                            <i class="bi bi-person-bounding-box fs-2"></i>
                        </div>
                        <h3 class="fw-bold text-violet">Customer Login</h3>
                        <p class="text-secondary small">Welcome back! Sign in to view and manage your bookings.</p>
                    </div>

                    <form action="{{ url_for('login') }}" method="POST">
                        <div class="mb-3">
                            <label for="email" class="form-label fw-medium text-dark"><i class="bi bi-envelope text-primary me-1"></i> Email Address</label>
                            <input type="email" class="form-control form-control-lg rounded-3" id="email" name="email" placeholder="name@example.com" required>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-medium text-dark"><i class="bi bi-lock text-primary me-1"></i> Password</label>
                            <input type="password" class="form-control form-control-lg rounded-3" id="password" name="password" placeholder="Enter password" required>
                        </div>

                        <button type="submit" class="btn btn-raspberry btn-lg w-100 rounded-pill shadow-sm fw-semibold mb-3">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Log In
                        </button>
                    </form>

                    <div class="text-center mt-3 pt-3 border-top">
                        <p class="text-secondary mb-1 small">Don't have an account yet?
                            <a href="{{ url_for('register') }}" class="text-primary fw-bold text-decoration-none">Register here</a>
                        </p>
                        <p class="text-muted mb-0 extra-small">Are you an administrator?
                            <a href="{{ url_for('admin_login') }}" class="text-raspberry fw-semibold text-decoration-none">Admin Login</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
