{% extends "base.html" %}

{% block title %}Student Login - Student Leave Portal{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-sky p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="text-info mb-2">
                        <i class="bi bi-box-arrow-in-right fs-1"></i>
                    </div>
                    <h3 class="fw-bold text-cyan">Student Login</h3>
                    <p class="text-light opacity-80 small">Access your leave request portal</p>
                </div>

                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label for="email_or_reg" class="form-label"><i class="bi bi-person-badge me-1 text-info"></i> Email or Register Number</label>
                        <input type="text" class="form-control" id="email_or_reg" name="email_or_reg" placeholder="Enter Email or Reg No." required>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label"><i class="bi bi-lock me-1 text-info"></i> Password</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter Password" required>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-cyan btn-lg">
                            <i class="bi bi-box-arrow-in-right me-2"></i> Log In
                        </button>
                    </div>

                    <div class="text-center">
                        <p class="small text-light opacity-80 mb-2">
                            Don't have an account? <a href="{{ url_for('register') }}" class="text-cyan fw-bold">Register here</a>
                        </p>
                        <p class="small mb-0">
                            Are you an Admin? <a href="{{ url_for('admin_login') }}" class="text-warning fw-bold">Admin Login</a>
                        </p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
