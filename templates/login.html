{% extends "base.html" %}

{% block title %}Student Login - Classroom Maintenance Complaint Tracker{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card card-custom p-4 my-4">
            <div class="text-center mb-4">
                <i class="fa-solid fa-right-to-bracket fa-3x text-primary mb-2"></i>
                <h3 class="fw-bold">Student Login</h3>
                <p class="text-muted">Enter credentials to access your account</p>
            </div>

            <form action="{{ url_for('login') }}" method="POST" class="needs-validation" novalidate>
                <div class="mb-3">
                    <label for="email_or_reg" class="form-label font-weight-bold">Register Number / Email</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-user"></i></span>
                        <input type="text" class="form-control" id="email_or_reg" name="email_or_reg" placeholder="Register Number or Email" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label font-weight-bold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                    </div>
                </div>

                <div class="d-grid mb-3">
                    <button type="submit" class="btn btn-primary py-2 fw-bold">
                        <i class="fa-solid fa-right-to-bracket me-2"></i>Login
                    </button>
                </div>

                <div class="text-center">
                    <p class="mb-0 text-muted">Don't have an account? <a href="{{ url_for('register') }}" class="text-primary fw-bold text-decoration-none">Register here</a></p>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
