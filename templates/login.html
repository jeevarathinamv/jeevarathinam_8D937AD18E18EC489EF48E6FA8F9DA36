{% extends 'base.html' %}

{% block title %}Student Login - Department Information System{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-custom shadow border-0">
                <div class="card-header card-header-cyan text-center py-3">
                    <h4 class="mb-0 text-white"><i class="bi bi-box-arrow-in-right me-2"></i>Student Login</h4>
                </div>
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('login') }}" class="needs-validation" novalidate>
                        <div class="mb-3">
                            <label for="email_or_reg" class="form-label font-weight-bold">Register Number or Email</label>
                            <input type="text" class="form-control" id="email_or_reg" name="email_or_reg" placeholder="Register number or Email" required>
                            <div class="invalid-feedback">Please enter your Register Number or Email.</div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label font-weight-bold">Password</label>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                            <div class="invalid-feedback">Please enter your password.</div>
                        </div>

                        <button type="submit" class="btn btn-navy w-100 py-2 fw-bold shadow-sm">
                            <i class="bi bi-box-arrow-in-right me-1"></i>Login
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <p class="mb-0 text-muted">Don't have an account? <a href="{{ url_for('register') }}" class="text-orange font-weight-bold text-decoration-none">Register Now</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
