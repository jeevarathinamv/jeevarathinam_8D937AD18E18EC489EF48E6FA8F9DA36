{% extends 'base.html' %}

{% block title %}Student Login - Student Freelance Portal{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-5">
        <div class="card glass-card p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="bg-primary bg-opacity-10 text-primary d-inline-flex p-3 rounded-circle mb-3">
                    <i class="bi bi-person-workspace fs-1 text-primary"></i>
                </div>
                <h3 class="fw-bold text-dark">Student Portal Login</h3>
                <p class="text-muted">Manage your freelance projects & portfolio</p>
            </div>

            <form action="{{ url_for('login') }}" method="POST">
                <div class="mb-3">
                    <label for="email_or_reg" class="form-label font-weight-bold">Email Address or Register Number</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                        <input type="text" class="form-control" id="email_or_reg" name="email_or_reg" placeholder="student@college.edu or REG123" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label font-weight-bold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-cobalt w-100 py-2 mb-3">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Log In
                </button>
            </form>

            <div class="text-center mt-3 pt-3 border-top">
                <p class="mb-1 text-muted">Don't have an account?</p>
                <a href="{{ url_for('register') }}" class="fw-bold text-decoration-none text-primary">Register New Account</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
