{% extends "base.html" %}

{% block title %}Student Login - Attendance System{% endblock %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-md-6 col-lg-5">
        <div class="card card-custom card-teal-header shadow-lg">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <span class="p-3 bg-teal text-white rounded-circle d-inline-block mb-3">
                        <i class="bi bi-person-check-fill fs-2"></i>
                    </span>
                    <h2 class="fw-bold text-dark">Student Login</h2>
                    <p class="text-muted">Enter your credentials to access your dashboard</p>
                </div>

                <form action="{{ url_for('login') }}" method="POST">
                    <div class="mb-3">
                        <label for="email_or_reg" class="form-label fw-semibold">
                            <i class="bi bi-envelope-or-card text-teal me-1"></i> Email or Register Number
                        </label>
                        <input type="text" class="form-control form-control-lg rounded-3" id="email_or_reg" name="email_or_reg" placeholder="Email or Register No." required>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">
                            <i class="bi bi-lock-fill text-teal me-1"></i> Password
                        </label>
                        <input type="password" class="form-control form-control-lg rounded-3" id="password" name="password" placeholder="Enter password" required>
                    </div>

                    <button type="submit" class="btn btn-teal w-100 py-3 text-uppercase fw-bold shadow-sm">
                        <i class="bi bi-box-arrow-in-right me-2"></i> Log In
                    </button>
                </form>

                <div class="text-center mt-4">
                    <p class="mb-0 text-muted">Don't have an account?
                        <a href="{{ url_for('register') }}" class="fw-bold text-teal text-decoration-none">Register here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
