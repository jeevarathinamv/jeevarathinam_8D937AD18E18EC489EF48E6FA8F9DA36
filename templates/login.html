{% extends "base.html" %}

{% block title %}Student Login - College Library System{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-lg rounded-3">
                <div class="card-header card-header-royal text-center py-4">
                    <i class="bi bi-person-circle fs-1 text-warning mb-2 d-block"></i>
                    <h4 class="fw-bold mb-1">Student Login</h4>
                    <p class="small mb-0 text-white-50">Sign in to access library book services</p>
                </div>
                <div class="card-body p-4 p-md-5">
                    <form action="{{ url_for('login') }}" method="POST">
                        <div class="mb-3">
                            <label for="email_or_reg" class="form-label fw-semibold">Email or Register Number</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-person-fill"></i></span>
                                <input type="text" class="form-control" id="email_or_reg" name="email_or_reg" placeholder="Enter Email or Reg No" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-lock-fill"></i></span>
                                <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-mint w-100 py-2.5 fw-bold shadow-sm">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Login
                        </button>
                    </form>

                    <div class="text-center mt-4 pt-3 border-top">
                        <p class="text-muted mb-2">New student? <a href="{{ url_for('register') }}" class="text-primary fw-bold text-decoration-none">Register here</a></p>
                        <p class="small text-muted mb-0"><a href="{{ url_for('admin_login') }}" class="text-secondary text-decoration-none"><i class="bi bi-shield-lock me-1"></i> Admin Login</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
