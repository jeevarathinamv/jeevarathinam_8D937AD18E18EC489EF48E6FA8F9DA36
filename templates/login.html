{% extends "base.html" %}

{% block title %}Student Login - Student Study Partner Finder{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg border-0 overflow-hidden">
                <div class="card-header bg-gradient-theme text-white text-center py-4">
                    <div class="icon-circle icon-blue mb-2 mx-auto">
                        <i class="bi bi-box-arrow-in-right"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Student Login</h3>
                    <p class="small text-white-50 mb-0">Access your study partner portal</p>
                </div>
                <div class="card-body p-4 p-md-5">
                    <form action="{{ url_for('login') }}" method="POST">
                        <div class="mb-3">
                            <label for="email_or_reg" class="form-label fw-semibold text-dark">
                                <i class="bi bi-person-badge-fill text-purple me-1"></i> Email or Register Number
                            </label>
                            <input type="text" class="form-control" id="email_or_reg" name="email_or_reg" placeholder="Email or Reg No (e.g. REG202401)" required>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold text-dark">
                                <i class="bi bi-key-fill text-pink me-1"></i> Password
                            </label>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                        </div>

                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-gradient btn-lg rounded-pill shadow">
                                <i class="bi bi-box-arrow-in-right me-2"></i> Log In
                            </button>
                        </div>

                        <div class="text-center mt-3">
                            <p class="text-muted mb-0">Don't have an account?
                                <a href="{{ url_for('register') }}" class="fw-bold text-pink text-decoration-none">Register now</a>
                            </p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% block scripts %}{% endblock %}
{% endblock %}
