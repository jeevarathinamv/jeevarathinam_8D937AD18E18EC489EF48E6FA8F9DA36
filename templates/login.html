{% extends 'base.html' %}

{% block title %}Student Login - EduTrack Hub{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow-lg border-0">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center bg-white bg-opacity-10 rounded-circle mb-3" style="width: 70px; height: 70px;">
                            <i class="bi bi-box-arrow-in-right fs-1 text-primary"></i>
                        </div>
                        <h2 class="fw-bold gradient-text">Student Login</h2>
                        <p class="text-white-50 small">Access your course and certification records</p>
                    </div>

                    <form method="POST" action="{{ url_for('login') }}">
                        <div class="mb-3">
                            <label for="email_or_reg" class="form-label">
                                <i class="bi bi-envelope-at me-1 text-info"></i> Email or Register Number
                            </label>
                            <input type="text" class="form-control" id="email_or_reg" name="email_or_reg" placeholder="e.g. student@college.edu or 21MCA001" required>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label">
                                <i class="bi bi-lock me-1 text-danger"></i> Password
                            </label>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                        </div>

                        <button type="submit" class="btn btn-gradient-primary w-100 py-2.5 fw-bold fs-6">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Log In
                        </button>
                    </form>

                    <hr class="border-white border-opacity-10 my-4">

                    <div class="text-center text-white-50 small">
                        Don't have an account yet?
                        <a href="{{ url_for('register') }}" class="text-pink fw-semibold text-decoration-none ms-1" style="color: #f472b6;">
                            Register here <i class="bi bi-arrow-right-short"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
