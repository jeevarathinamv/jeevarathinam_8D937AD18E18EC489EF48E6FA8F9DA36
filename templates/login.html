{% extends 'base.html' %}

{% block title %}Student Login - Student Portfolio Generator{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
    <div class="col-md-6 col-lg-5">
        <div class="card card-sky p-4 shadow-lg border-0">
            <div class="text-center mb-4">
                <div class="text-cyan fs-1 mb-2"><i class="bi bi-box-arrow-in-right"></i></div>
                <h3 class="fw-bold text-dark">Student Login</h3>
                <p class="text-muted small">Enter your credentials to manage your portfolio</p>
            </div>

            <form action="{{ url_for('login') }}" method="POST">
                <div class="mb-3">
                    <label for="email_or_reg" class="form-label fw-semibold">
                        <i class="bi bi-person-badge me-1"></i> Email or Register Number
                    </label>
                    <input type="text" class="form-control form-control-custom" id="email_or_reg" name="email_or_reg" placeholder="Enter Email or Register No." required>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold">
                        <i class="bi bi-lock me-1"></i> Password
                    </label>
                    <input type="password" class="form-control form-control-custom" id="password" name="password" placeholder="Enter Password" required>
                </div>

                <button type="submit" class="btn btn-cyan w-100 py-2 fs-6">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Login
                </button>
            </form>

            <hr class="my-4 text-muted">

            <div class="text-center">
                <p class="mb-2 text-muted">New student?
                    <a href="{{ url_for('register') }}" class="text-sky fw-bold text-decoration-none">Register Here</a>
                </p>
                <p class="mb-0 small">
                    <a href="{{ url_for('admin_login') }}" class="text-muted text-decoration-none">
                        <i class="bi bi-shield-lock me-1"></i> Admin Login
                    </a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
