{% extends 'base.html' %}

{% block title %}Student Login - WaterCare System{% endblock %}

{% block content %}
<div class="container my-4">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-header bg-theme text-white p-4 rounded-top-4">
                    <div class="d-flex align-items-center">
                        <div class="bg-white text-teal rounded-circle p-2 me-3 d-flex align-items-center justify-content-center" style="width: 45px; height: 45px;">
                            <i class="bi bi-person-circle fs-4"></i>
                        </div>
                        <div>
                            <h4 class="mb-0 fw-bold">Student Login</h4>
                            <p class="mb-0 small text-light opacity-90">Access your dashboard to manage complaints</p>
                        </div>
                    </div>
                </div>

                <div class="card-body p-4">
                    <form action="{{ url_for('login') }}" method="POST" class="needs-validation" novalidate>

                        <div class="mb-3">
                            <label for="email_or_reg" class="form-label fw-semibold">Email or Register Number <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-person-vcard text-teal"></i></span>
                                <input type="text" class="form-control bg-light border-start-0" id="email_or_reg" name="email_or_reg" placeholder="student@college.edu or MCA202501" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-teal"></i></span>
                                <input type="password" class="form-control bg-light border-start-0" id="password" name="password" placeholder="Enter password" required>
                            </div>
                        </div>

                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-emerald btn-lg rounded-pill fw-semibold shadow-sm">
                                <i class="bi bi-box-arrow-in-right me-2"></i>Login
                            </button>
                        </div>

                        <div class="text-center pt-2">
                            <p class="text-muted small mb-0">Don't have an account?
                                <a href="{{ url_for('register') }}" class="text-teal fw-bold text-decoration-none">Register here</a>
                            </p>
                        </div>

                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
