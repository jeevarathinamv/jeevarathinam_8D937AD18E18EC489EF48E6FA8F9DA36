{% extends "base.html" %}

{% block title %}Student Login - Student Internal Marks & Result Tracker{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6 col-lg-5">
        <div class="card card-glass border-0 shadow-lg">
            <div class="card-glass-header text-center">
                <h3 class="mb-1 fw-bold text-white"><i class="bi bi-box-arrow-in-right text-warning me-2"></i>Student Login</h3>
                <p class="text-light small mb-0">Enter your credentials to access your dashboard</p>
            </div>
            <div class="card-body p-4">
                <form action="{{ url_for('login') }}" method="POST">
                    <div class="mb-3">
                        <label for="email_or_reg" class="form-label text-light fw-semibold">Email or Register Number</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-teal"><i class="bi bi-person-badge"></i></span>
                            <input type="text" class="form-control form-control-custom" id="email_or_reg" name="email_or_reg" placeholder="Email or Register Number" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label text-light fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-teal"><i class="bi bi-key"></i></span>
                            <input type="password" class="form-control form-control-custom" id="password" name="password" placeholder="Password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-teal w-100 py-2 fs-6 mb-3">
                        <i class="bi bi-box-arrow-in-right me-2"></i>Login
                    </button>

                    <div class="text-center">
                        <p class="mb-0 text-light small">Don't have an account? <a href="{{ url_for('register') }}" class="text-warning fw-bold text-decoration-none">Register Here</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
