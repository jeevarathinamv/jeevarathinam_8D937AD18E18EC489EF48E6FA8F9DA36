{% extends "base.html" %}

{% block title %}Student Login - SubjectReg{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card card-custom p-4 shadow-sm">
            <div class="card-body">
                <h3 class="card-title text-center text-indigo fw-bold mb-4">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Student Login
                </h3>
                <form action="{{ url_for('login') }}" method="POST" class="needs-validation" novalidate>
                    <div class="mb-3">
                        <label for="email_or_reg" class="form-label fw-semibold">Email or Register Number</label>
                        <input type="text" class="form-control" id="email_or_reg" name="email_or_reg" placeholder="Enter email or register number" required>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                    </div>

                    <button type="submit" class="btn btn-indigo w-100 py-2 shadow-sm"><i class="bi bi-box-arrow-in-right me-1"></i>Login</button>
                </form>

                <div class="text-center mt-3">
                    <small>New student? <a href="{{ url_for('register') }}" class="text-indigo fw-bold">Register here</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
