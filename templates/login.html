{% extends 'base.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-7 col-lg-5">
        <div class="card card-glass p-4">
            <div class="card-body">
                <div class="text-center mb-4">
                    <div class="icon-box mx-auto mb-3">
                        <i class="bi bi-box-arrow-in-right"></i>
                    </div>
                    <h3 class="fw-bold text-dark">Portal Login</h3>
                    <p class="text-muted">Access Student Portal or Admin Help Desk</p>
                </div>

                <!-- Nav Tabs for Student vs Admin -->
                <ul class="nav nav-pills nav-justified mb-4 p-1 bg-light rounded-3" id="loginTab" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active fw-bold" id="student-tab" data-bs-toggle="pill" data-bs-target="#student-login" type="button" role="tab">
                            <i class="bi bi-person me-1"></i> Student Login
                        </button>
                    </li>
                    <li class="nav-item" role="presentation">
                        <button class="nav-link fw-bold" id="admin-tab" data-bs-toggle="pill" data-bs-target="#admin-login" type="button" role="tab">
                            <i class="bi bi-shield-lock me-1"></i> Admin Login
                        </button>
                    </li>
                </ul>

                <div class="tab-content" id="loginTabContent">
                    <!-- Student Login Form -->
                    <div class="tab-pane fade show active" id="student-login" role="tabpanel">
                        <form action="{{ url_for('login') }}" method="POST">
                            <input type="hidden" name="login_type" value="student">
                            <div class="mb-3">
                                <label for="email_or_reg" class="form-label fw-semibold">Email or Register Number</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-person text-primary"></i></span>
                                    <input type="text" class="form-control border-start-0" id="email_or_reg" name="email_or_reg" placeholder="Email or Reg No." required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="student_password" class="form-label fw-semibold">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-lock text-primary"></i></span>
                                    <input type="password" class="form-control border-start-0" id="student_password" name="password" placeholder="Enter password" required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-gradient-primary w-100 py-2 shadow mb-3">
                                <i class="bi bi-box-arrow-in-right me-1"></i> Login as Student
                            </button>

                            <div class="text-center text-muted fs-6">
                                Don't have an account? <a href="{{ url_for('register') }}" class="fw-bold text-decoration-none">Register Here</a>
                            </div>
                        </form>
                    </div>

                    <!-- Admin Login Form -->
                    <div class="tab-pane fade" id="admin-login" role="tabpanel">
                        <form action="{{ url_for('login') }}" method="POST">
                            <input type="hidden" name="login_type" value="admin">
                            <div class="mb-3">
                                <label for="admin_username" class="form-label fw-semibold">Admin Username</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-shield text-info"></i></span>
                                    <input type="text" class="form-control border-start-0" id="admin_username" name="username" placeholder="Username (Default: admin)" required>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label for="admin_password" class="form-label fw-semibold">Admin Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-key text-info"></i></span>
                                    <input type="password" class="form-control border-start-0" id="admin_password" name="password" placeholder="Password (Default: admin123)" required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-gradient-cyan w-100 py-2 shadow mb-2">
                                <i class="bi bi-shield-check me-1"></i> Login as Admin
                            </button>
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
{% endblock %}
