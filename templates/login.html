{% extends "base.html" %}

{% block title %}Student Login | College Entrepreneurship Portal{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card card-custom shadow-lg">
            <div class="card-header card-petrol-header p-3 text-center">
                <h4 class="mb-0 text-white"><i class="bi bi-person-check-fill me-2"></i> Student Login</h4>
                <small class="text-white-50">Log in with your Register Number or Email</small>
            </div>
            <div class="card-body p-4">
                <form action="{{ url_for('login') }}" method="POST" class="needs-validation" novalidate>
                    <div class="mb-3">
                        <label for="login_id" class="form-label fw-bold">Register Number / Email</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
                            <input type="text" class="form-control" id="login_id" name="login_id" placeholder="Register No (e.g. 23MCA104) or Email" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-bold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-key-fill"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-coral w-100 py-2 fs-6">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Log In
                    </button>

                    <div class="text-center mt-3">
                        <span class="text-muted">Don't have an account?</span>
                        <a href="{{ url_for('register') }}" class="fw-bold text-decoration-none ms-1" style="color: var(--petrol-blue);">
                            Register Now <i class="bi bi-arrow-right-short"></i>
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
