{% extends "base.html" %}

{% block title %}Student Login - Assignment Tracker{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-theme p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center bg-info bg-opacity-10 rounded-circle p-3 mb-3">
                        <i class="bi bi-person-fill text-info fs-1"></i>
                    </div>
                    <h3 class="fw-bold text-dark mb-1">Student Login</h3>
                    <p class="text-muted small">Sign in to submit assignments & track deadlines</p>
                </div>

                <form method="POST" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label for="email_or_reg" class="form-label fw-semibold text-secondary">
                            <i class="bi bi-person-badge text-info me-1"></i> Email or Register Number
                        </label>
                        <input type="text" class="form-control form-control-lg rounded-3" id="email_or_reg" name="email_or_reg" placeholder="Enter Email or Reg Number" required autofocus>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold text-secondary">
                            <i class="bi bi-lock text-info me-1"></i> Password
                        </label>
                        <input type="password" class="form-control form-control-lg rounded-3" id="password" name="password" placeholder="Enter Password" required>
                    </div>

                    <div class="d-grid gap-2 mb-3">
                        <button type="submit" class="btn btn-cyan btn-lg">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Login as Student
                        </button>
                    </div>
                </form>

                <div class="text-center mt-3 pt-3 border-top">
                    <p class="text-muted mb-2">Don't have an account?</p>
                    <a href="{{ url_for('register') }}" class="btn btn-peach btn-sm fw-semibold">
                        <i class="bi bi-person-plus-fill me-1"></i> Register New Student
                    </a>
                </div>

                <div class="text-center mt-3">
                    <a href="{{ url_for('admin_login') }}" class="small text-decoration-none text-secondary">
                        <i class="bi bi-shield-lock me-1"></i> Are you an Administrator? Click here
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
