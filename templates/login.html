{% extends "base.html" %}

{% block title %}Student Login - Library New Book Request System{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4">
                <div class="card-header bg-gradient-blue text-white text-center py-4 rounded-top-4">
                    <h3 class="fw-bold mb-1"><i class="bi bi-box-arrow-in-right me-2"></i> Student Login</h3>
                    <p class="small mb-0 opacity-80">Access your book requests and dashboard</p>
                </div>
                <div class="card-body p-4 p-md-5">
                    <form action="{{ url_for('login') }}" method="POST" class="needs-validation" novalidate>
                        <div class="mb-3">
                            <label for="email_or_reg" class="form-label fw-semibold">Email or Register Number</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-person-badge"></i></span>
                                <input type="text" class="form-control" id="email_or_reg" name="email_or_reg" placeholder="Enter Email or Register No." required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2.5 rounded-3 fw-bold text-uppercase mb-3 shadow-sm">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Login
                        </button>
                    </form>

                    <div class="text-center mt-3 pt-3 border-top">
                        <p class="mb-0 text-muted">Don't have an account? <a href="{{ url_for('register') }}" class="text-purple fw-bold text-decoration-none">Register Here</a></p>
                        <hr class="my-3">
                        <p class="small text-muted mb-0">Are you an Admin? <a href="{{ url_for('admin_login') }}" class="text-dark fw-bold text-decoration-none">Admin Login</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
