{% extends 'base.html' %}

{% block title %}Student Login - College Student Grievance Portal{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-custom p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="icon-box-cyan mx-auto mb-3" style="width: 60px; height: 60px; font-size: 1.8rem;">
                        <i class="bi bi-box-arrow-in-right"></i>
                    </div>
                    <h3 class="fw-bold text-white mb-1">Student Login</h3>
                    <p class="text-muted small">Access your grievance dashboard</p>
                </div>

                <form action="{{ url_for('login') }}" method="POST">
                    <div class="mb-3">
                        <label for="email_or_reg" class="form-label text-light fw-medium"><i class="bi bi-person-badge me-1 text-info"></i> Email or Register Number</label>
                        <input type="text" class="form-control form-control-custom py-2" id="email_or_reg" name="email_or_reg" placeholder="Enter Email or Reg No." required>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label text-light fw-medium"><i class="bi bi-lock me-1 text-info"></i> Password</label>
                        <input type="password" class="form-control form-control-custom py-2" id="password" name="password" placeholder="Enter your password" required>
                    </div>

                    <button type="submit" class="btn btn-cyan w-100 py-2 fs-6 mb-3">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                    </button>

                    <div class="d-flex justify-content-between align-items-center mt-3 text-muted small">
                        <span>New student? <a href="{{ url_for('register') }}" class="text-info text-decoration-none fw-semibold">Register</a></span>
                        <a href="{{ url_for('admin_login') }}" class="text-warning text-decoration-none fw-semibold"><i class="bi bi-shield-lock me-1"></i> Admin Portal</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
