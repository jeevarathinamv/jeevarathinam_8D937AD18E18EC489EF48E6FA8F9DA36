{% extends 'base.html' %}

{% block title %}Student Login - Hostel Room Change System{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card card-custom p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="icon-box-mint mx-auto mb-3">
                        <i class="bi bi-box-arrow-in-right"></i>
                    </div>
                    <h3 class="fw-bold">Student Login</h3>
                    <p class="text-muted small">Sign in with your Register Number or Email</p>
                </div>

                <form action="{{ url_for('login') }}" method="POST" class="needs-validation" novalidate>
                    <div class="mb-3">
                        <label for="email_or_reg" class="form-label fw-semibold">Register Number or Email <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="email_or_reg" name="email_or_reg" placeholder="Enter Reg No or Email" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-mint w-100 py-2 mb-3">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Log In
                    </button>

                    <div class="d-flex justify-content-between align-items-center text-muted small">
                        <span>New student? <a href="{{ url_for('register') }}" class="text-primary fw-semibold">Register here</a></span>
                        <a href="{{ url_for('admin_login') }}" class="text-secondary"><i class="bi bi-shield-lock me-1"></i> Admin Login</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
