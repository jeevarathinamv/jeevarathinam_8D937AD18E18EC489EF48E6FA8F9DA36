{% extends "base.html" %}

{% block title %}Student Login - Student Career Goal Tracker{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center my-4">
    <div class="col-md-6 col-lg-5">
        <div class="card auth-card">
            <div class="auth-header">
                <i class="bi bi-person-bounding-box text-primary"></i>
                <h3 class="fw-bold">Student Login</h3>
                <p class="text-muted small">Access your career goals, progress & portfolio</p>
            </div>

            <form action="{{ url_for('login') }}" method="POST">
                <div class="mb-3">
                    <label for="email_or_reg" class="form-label fw-semibold">Email or Register Number</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-person-fill text-indigo"></i></span>
                        <input type="text" class="form-control" id="email_or_reg" name="email_or_reg" placeholder="Enter Email or Reg. No" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-lock-fill text-indigo"></i></span>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter Password" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-cyan w-100 py-2 fs-6">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Login to Dashboard
                </button>
            </form>

            <div class="text-center mt-4 pt-3 border-top">
                <p class="mb-2 text-muted">Don't have a student account?</p>
                <a href="{{ url_for('register') }}" class="btn btn-outline-primary btn-sm fw-semibold me-2">
                    <i class="bi bi-person-plus-fill me-1"></i> Register Here
                </a>
                <a href="{{ url_for('admin_login') }}" class="btn btn-outline-secondary btn-sm fw-semibold">
                    <i class="bi bi-shield-lock-fill me-1"></i> Admin Portal
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
