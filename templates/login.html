{% extends 'base.html' %}

{% block title %}Student Login - College Digital Library{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card form-card p-4 p-md-5 bg-white">
                <div class="text-center mb-4">
                    <div class="stat-icon stat-icon-cyan mx-auto mb-3">
                        <i class="bi bi-box-arrow-in-right"></i>
                    </div>
                    <h3 class="fw-bold text-dark">Student Login</h3>
                    <p class="text-muted small">Sign in to search, view and download digital books.</p>
                </div>

                <form action="{{ url_for('login') }}" method="POST">
                    <div class="mb-3">
                        <label for="email_or_reg" class="form-label">Email or Register Number</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-person text-secondary"></i></span>
                            <input type="text" class="form-control" id="email_or_reg" name="email_or_reg" placeholder="Enter Email or Register No." required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-lock text-secondary"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Enter Password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-cyan w-100 py-2 rounded-3 fw-bold mb-3">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Log In
                    </button>

                    <div class="d-flex justify-content-between align-items-center mt-3 pt-3 border-top small">
                        <div>
                            <span class="text-muted">New student?</span>
                            <a href="{{ url_for('register') }}" class="text-decoration-none fw-semibold ms-1 text-primary">Register</a>
                        </div>
                        <div>
                            <a href="{{ url_for('admin_login') }}" class="text-decoration-none fw-semibold text-secondary">
                                <i class="bi bi-shield-lock me-1"></i> Admin Login
                            </a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
