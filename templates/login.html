{% extends "base.html" %}

{% block title %}Login - Mock Interview Portal{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="card-header bg-gradient-nav text-white p-4 text-center border-0">
                    <div class="d-inline-flex align-items-center justify-content-center bg-white text-primary rounded-circle mb-2" style="width: 50px; height: 50px;">
                        <i class="bi bi-box-arrow-in-right fs-4"></i>
                    </div>
                    <h4 class="fw-bold mb-1">Portal Login</h4>
                    <p class="small text-white-50 mb-0">Sign in to access your dashboard</p>
                </div>
                <div class="card-body p-4 p-md-5">
                    <!-- Login Type Selector Tabs -->
                    <ul class="nav nav-pills nav-fill mb-4 p-1 bg-light rounded-pill border" id="loginTab" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active rounded-pill fw-semibold py-2" id="student-tab" data-bs-toggle="pill" data-bs-target="#student-login" type="button" role="tab">
                                <i class="bi bi-person-fill me-1"></i> Student Login
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link rounded-pill fw-semibold py-2" id="admin-tab" data-bs-toggle="pill" data-bs-target="#admin-login" type="button" role="tab">
                                <i class="bi bi-shield-lock-fill me-1"></i> Admin Login
                            </button>
                        </li>
                    </ul>

                    <div class="tab-content" id="loginTabContent">
                        <!-- Student Login Form -->
                        <div class="tab-pane fade show active" id="student-login" role="tabpanel">
                            <form method="POST" action="{{ url_for('login') }}">
                                <input type="hidden" name="login_type" value="student">
                                <div class="mb-3">
                                    <label for="email_or_reg" class="form-label fw-semibold text-dark"><i class="bi bi-envelope-at-fill me-1 text-primary"></i> Email or Register Number</label>
                                    <input type="text" class="form-control form-control-lg rounded-3 fs-6" id="email_or_reg" name="email_or_reg" placeholder="email@college.edu or Reg No" required>
                                </div>
                                <div class="mb-4">
                                    <label for="password" class="form-label fw-semibold text-dark"><i class="bi bi-key-fill me-1 text-primary"></i> Password</label>
                                    <input type="password" class="form-control form-control-lg rounded-3 fs-6" id="password" name="password" placeholder="••••••••" required>
                                </div>
                                <button type="submit" class="btn btn-primary btn-lg rounded-pill w-100 fw-bold shadow-sm">
                                    <i class="bi bi-box-arrow-in-right me-1"></i> Student Sign In
                                </button>
                            </form>
                        </div>

                        <!-- Admin Login Form -->
                        <div class="tab-pane fade" id="admin-login" role="tabpanel">
                            <form method="POST" action="{{ url_for('login') }}">
                                <input type="hidden" name="login_type" value="admin">
                                <div class="mb-3">
                                    <label for="username" class="form-label fw-semibold text-dark"><i class="bi bi-shield-person-fill me-1 text-primary"></i> Admin Username</label>
                                    <input type="text" class="form-control form-control-lg rounded-3 fs-6" id="username" name="username" placeholder="admin" required>
                                </div>
                                <div class="mb-4">
                                    <label for="admin_password" class="form-label fw-semibold text-dark"><i class="bi bi-key-fill me-1 text-primary"></i> Admin Password</label>
                                    <input type="password" class="form-control form-control-lg rounded-3 fs-6" id="admin_password" name="password" placeholder="admin123" required>
                                </div>
                                <button type="submit" class="btn btn-dark btn-lg rounded-pill w-100 fw-bold shadow-sm">
                                    <i class="bi bi-shield-lock-fill me-1"></i> Admin Sign In
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
                <div class="card-footer bg-light p-3 text-center border-0">
                    <span class="text-muted small">New Student? </span>
                    <a href="{{ url_for('register') }}" class="fw-bold text-primary text-decoration-none small">Register here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
