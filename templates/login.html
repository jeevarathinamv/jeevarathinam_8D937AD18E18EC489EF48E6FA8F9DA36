{% extends "base.html" %}

{% block title %}Student Login - Internship Tracker{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card sky-card p-4 p-md-5 border-0 shadow-lg">
                <div class="text-center mb-4">
                    <div class="d-inline-flex p-3 bg-primary bg-opacity-10 text-cyan rounded-circle mb-3">
                        <i class="bi bi-box-arrow-in-right fs-2"></i>
                    </div>
                    <h3 class="fw-bold text-dark">Student Login</h3>
                    <p class="text-secondary small">Access your internship application tracker</p>
                </div>

                <form action="{{ url_for('login') }}" method="POST">
                    <div class="mb-3">
                        <label for="email_or_reg" class="form-label fw-semibold text-dark">Email or Register Number <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-person-badge text-cyan"></i></span>
                            <input type="text" class="form-control" id="email_or_reg" name="email_or_reg" placeholder="Email or Register No." required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold text-dark">Password <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="bi bi-lock text-cyan"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-cyan w-100 py-2.5 rounded-pill mb-3">
                        <i class="bi bi-box-arrow-in-right me-2"></i> Login
                    </button>

                    <div class="text-center text-secondary small mb-2">
                        Don't have an account? <a href="{{ url_for('register') }}" class="text-cyan fw-bold text-decoration-none">Register now</a>
                    </div>

                    <hr class="my-3 text-secondary">

                    <div class="text-center">
                        <a href="{{ url_for('admin_login') }}" class="btn btn-sky btn-sm rounded-pill px-3">
                            <i class="bi bi-shield-lock me-1"></i> Admin Portal Login
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
