{% extends "base.html" %}

{% block title %}Student Login - Library System{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="navbar-custom text-white text-center py-4 px-3">
                    <i class="bi bi-person-circle fs-1 text-warning mb-2 d-block"></i>
                    <h3 class="fw-bold mb-0">Student Login</h3>
                    <p class="small text-white-50 mb-0">Enter your credentials to access your dashboard</p>
                </div>
                <div class="card-body p-4 p-md-5">
                    <form action="{{ url_for('login') }}" method="POST">
                        <div class="mb-3">
                            <label for="email_or_reg" class="form-label fw-semibold">Email or Register Number</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-person text-muted"></i></span>
                                <input type="text" class="form-control" id="email_or_reg" name="email_or_reg" placeholder="student@college.edu or Reg No" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light"><i class="bi bi-lock text-muted"></i></span>
                                <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-orange w-100 py-2 rounded-pill fw-bold shadow-sm">
                            <i class="bi bi-box-arrow-in-right me-2"></i> Log In
                        </button>
                    </form>
                    <div class="text-center mt-4">
                        <p class="small text-muted mb-0">Don't have an account? <a href="{{ url_for('register') }}" class="text-primary fw-bold text-decoration-none">Register here</a></p>
                        <hr class="my-3">
                        <p class="small text-muted mb-0">Are you an Admin? <a href="{{ url_for('admin_login') }}" class="text-info fw-bold text-decoration-none">Admin Login</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
