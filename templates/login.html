{% extends 'base.html' %}

{% block title %}Student Login - Lab Fault Reporter{% endblock %}

{% block content %}
<div class="row justify-content-center my-4">
    <div class="col-md-6 col-lg-5">
        <div class="card custom-card shadow-sm border-0">
            <div class="card-header bg-primary text-white text-center py-3 rounded-top">
                <h4 class="mb-0 fw-bold"><i class="bi bi-box-arrow-in-right me-2"></i> Student Login</h4>
            </div>
            <div class="card-body p-4">
                <form action="{{ url_for('login') }}" method="POST">
                    <div class="mb-3">
                        <label for="email_or_reg" class="form-label fw-semibold"><i class="bi bi-person-badge me-1"></i> Register Number or Email</label>
                        <input type="text" class="form-control" id="email_or_reg" name="email_or_reg" placeholder="Enter Register No or Email" required autofocus>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold"><i class="bi bi-lock me-1"></i> Password</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Enter Password" required>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary btn-lg fw-bold">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Login
                        </button>
                    </div>
                </form>
            </div>
            <div class="card-footer text-center py-3 bg-light">
                <p class="mb-0 text-muted">Don't have an account? <a href="{{ url_for('register') }}" class="text-primary fw-bold">Register Here</a></p>
                <div class="mt-2">
                    <a href="{{ url_for('admin_login') }}" class="text-decoration-none small text-teal fw-semibold">
                        <i class="bi bi-shield-lock me-1"></i> Switch to Admin Login
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
