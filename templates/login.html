{% extends "base.html" %}

{% block title %}Student Login - Campus Recruitment Drive System{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-5 col-lg-4">
        <div class="card card-sky p-4 shadow-lg">
            <div class="text-center mb-4">
                <div class="icon-box bg-cyan-soft text-cyan mx-auto mb-2" style="width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center;">
                    <i class="bi bi-person-lock fs-2" style="color: #0284c7;"></i>
                </div>
                <h3 class="fw-bold text-navy mb-1" style="color: #0a192f;">Student Login</h3>
                <p class="text-secondary small">Enter your credentials to access your dashboard</p>
            </div>

            <form action="{{ url_for('login') }}" method="POST">
                <div class="mb-3">
                    <label for="email_or_reg" class="form-label fw-semibold text-navy" style="color: #0a192f;">
                        <i class="bi bi-envelope-at me-1"></i> Email or Register Number
                    </label>
                    <input type="text" class="form-control" id="email_or_reg" name="email_or_reg" placeholder="Email or Register No." required>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold text-navy" style="color: #0a192f;">
                        <i class="bi bi-shield-lock me-1"></i> Password
                    </label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn btn-cyan w-100 py-2 fs-6">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Log In
                </button>
            </form>

            <div class="text-center mt-3 pt-3 border-top">
                <p class="small text-secondary mb-1">New student?
                    <a href="{{ url_for('register') }}" class="fw-bold text-decoration-none" style="color: #0284c7;">Register Account</a>
                </p>
                <p class="small mb-0">
                    <a href="{{ url_for('admin_login') }}" class="text-muted text-decoration-none"><i class="bi bi-shield-lock me-1"></i> Admin Portal</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
