{% extends 'base.html' %}

{% block title %}Student Login - Workshop Portal{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                <div class="card-header card-steel-header p-4 text-center">
                    <h4 class="fw-bold mb-1"><i class="bi bi-box-arrow-in-right text-mint me-2"></i> Student Login</h4>
                    <p class="small text-light opacity-75 mb-0">Enter your credentials to manage your workshop registrations</p>
                </div>
                <div class="card-body p-4 p-md-5">
                    <form action="{{ url_for('login') }}" method="POST" class="needs-validation" novalidate>

                        <div class="mb-3">
                            <label for="email_or_reg" class="form-label fw-semibold text-steel-blue">Email Address or Register Number <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-steel-blue"><i class="bi bi-person-badge"></i></span>
                                <input type="text" class="form-control" id="email_or_reg" name="email_or_reg" placeholder="Register Number or Email" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold text-steel-blue">Password <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-steel-blue"><i class="bi bi-key"></i></span>
                                <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-magenta w-100 py-2 rounded-pill shadow-sm">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Log In
                        </button>
                    </form>
                </div>
                <div class="card-footer bg-light p-3 text-center border-0">
                    <span class="text-muted small">Don't have an account? </span>
                    <a href="{{ url_for('register') }}" class="text-magenta fw-bold text-decoration-none small">Register New Account</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
