{% extends "base.html" %}

{% block title %}Student Login - Library Fine System{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="card-header card-header-maroon py-3 text-center">
                    <h4 class="fw-bold mb-0"><i class="bi bi-box-arrow-in-right me-2 text-gold"></i>Student Login</h4>
                </div>
                <div class="card-body p-4 bg-white">
                    <form action="{{ url_for('login') }}" method="POST" class="needs-validation" novalidate>
                        <input type="hidden" name="login_type" value="student">

                        <div class="mb-3">
                            <label for="email_or_reg" class="form-label fw-semibold">Email or Register Number</label>
                            <div class="input-group">
                                <span class="input-group-text bg-cream border-end-0"><i class="bi bi-person text-maroon"></i></span>
                                <input type="text" class="form-control border-start-0" id="email_or_reg" name="email_or_reg" placeholder="Enter Email or Register No" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label fw-semibold">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-cream border-end-0"><i class="bi bi-lock text-maroon"></i></span>
                                <input type="password" class="form-control border-start-0" id="password" name="password" placeholder="Enter password" required>
                            </div>
                        </div>

                        <div class="d-grid mb-3">
                            <button type="submit" class="btn btn-maroon btn-lg fw-semibold rounded-pill py-2">
                                <i class="bi bi-box-arrow-in-right me-1"></i> Student Login
                            </button>
                        </div>

                        <div class="text-center pt-2 border-top">
                            <p class="text-muted small mb-1">New student? <a href="{{ url_for('register') }}" class="fw-bold text-maroon">Register here</a></p>
                            <p class="text-muted small mb-0">Librarian / Staff? <a href="{{ url_for('admin_login') }}" class="fw-bold text-gold">Admin Login</a></p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
