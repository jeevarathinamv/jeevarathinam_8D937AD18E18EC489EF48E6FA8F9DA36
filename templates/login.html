{% extends 'base.html' %}

{% block title %}Student Login - Skill Workshop Portal{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card border-0 shadow-custom p-4 p-md-5">
                <div class="text-center mb-4">
                    <span class="bg-indigo-subtle text-indigo rounded-circle d-inline-flex align-items-center justify-content-center mb-2" style="width:50px; height:50px;">
                        <i class="bi bi-box-arrow-in-right fs-3"></i>
                    </span>
                    <h3 class="fw-bold text-dark">Student Login</h3>
                    <p class="text-muted small">Access your workshop dashboard and registrations</p>
                </div>

                <form action="{{ url_for('login') }}" method="POST" class="needs-validation" novalidate>
                    <div class="mb-3">
                        <label for="login_input" class="form-label fw-semibold">Register Number / Email</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person-badge text-muted"></i></span>
                            <input type="text" class="form-control" id="login_input" name="login_input" placeholder="Enter Register No or Email" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-key text-muted"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-indigo w-100 py-2 fw-semibold shadow-sm mb-3">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Student Login
                    </button>

                    <div class="text-center border-top pt-3">
                        <p class="small text-muted mb-1">New student? <a href="{{ url_for('register') }}" class="text-mint fw-semibold text-decoration-none">Create an Account</a></p>
                        <p class="small text-muted mb-0">Are you an Admin? <a href="{{ url_for('admin_login') }}" class="text-indigo text-decoration-none">Admin Login</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
