{% extends 'base.html' %}

{% block title %}Admin Login - Sales & Customer Management System{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center style="min-height: 70vh;">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg rounded-4 overflow-hidden">
            <div class="card-header-custom text-center py-4">
                <i class="bi bi-shield-lock-fill fs-1 d-block mb-2 text-warning"></i>
                <h4 class="fw-bold mb-0">Admin Login</h4>
                <p class="small text-white-50 mb-0">Small Business Sales & Customer Management</p>
            </div>
            <div class="card-body p-4 p-md-5 bg-white">
                <form action="{{ url_for('login') }}" method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold text-secondary">
                            <i class="bi bi-person me-1"></i> Username
                        </label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-person-badge"></i></span>
                            <input type="text" class="form-control" id="username" name="username" placeholder="Enter username" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold text-secondary">
                            <i class="bi bi-key me-1"></i> Password
                        </label>
                        <div class="input-group">
                            <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="password" name="password" placeholder="Enter password" required>
                        </div>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-coral btn-lg shadow-sm">
                            <i class="bi bi-box-arrow-in-right me-2"></i> Log In to Dashboard
                        </button>
                    </div>
                </form>
            </div>
            <div class="card-footer bg-light text-center py-3 border-0">
                <small class="text-muted">
                    <i class="bi bi-info-circle me-1"></i> Default Login: Username: <strong>admin</strong> | Password: <strong>admin123</strong>
                </small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
