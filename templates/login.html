{% extends 'base.html' %}

{% block title %}Login - Student Resume Builder{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4 p-md-5">
                    <h3 class="fw-bold text-center text-primary mb-4">
                        <i class="bi bi-box-arrow-in-right me-2"></i> Account Login
                    </h3>

                    <!-- Login Type Tabs -->
                    <ul class="nav nav-pills nav-justified mb-4" id="loginTab" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active fw-semibold rounded-pill" id="student-tab" data-bs-toggle="pill" data-bs-target="#student-login" type="button" role="tab">
                                <i class="bi bi-person me-1"></i> Student
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link fw-semibold rounded-pill" id="admin-tab" data-bs-toggle="pill" data-bs-target="#admin-login" type="button" role="tab">
                                <i class="bi bi-shield-lock me-1"></i> Admin
                            </button>
                        </li>
                    </ul>

                    <div class="tab-content" id="loginTabContent">
                        <!-- Student Login Form -->
                        <div class="tab-pane fade show active" id="student-login" role="tabpanel">
                            <form action="{{ url_for('login') }}" method="POST">
                                <input type="hidden" name="login_type" value="student">
                                <div class="mb-3">
                                    <label for="email_or_reg" class="form-label fw-medium">Email or Register Number</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                        <input type="text" class="form-control" id="email_or_reg" name="email_or_reg" placeholder="student@example.com or REG123" required>
                                    </div>
                                </div>
                                <div class="mb-4">
                                    <label for="student_password" class="form-label fw-medium">Password</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                        <input type="password" class="form-control" id="student_password" name="password" placeholder="••••••••" required>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-primary w-100 rounded-pill py-2 fw-semibold">
                                    <i class="bi bi-box-arrow-in-right me-1"></i> Login as Student
                                </button>
                            </form>
                            <div class="text-center mt-3">
                                <p class="text-muted small mb-0">Don't have an account? <a href="{{ url_for('register') }}" class="text-primary fw-semibold">Register here</a></p>
                            </div>
                        </div>

                        <!-- Admin Login Form -->
                        <div class="tab-pane fade" id="admin-login" role="tabpanel">
                            <form action="{{ url_for('login') }}" method="POST">
                                <input type="hidden" name="login_type" value="admin">
                                <div class="mb-3">
                                    <label for="admin_username" class="form-label fw-medium">Admin Username</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
                                        <input type="text" class="form-control" id="admin_username" name="username" placeholder="admin" required>
                                    </div>
                                </div>
                                <div class="mb-4">
                                    <label for="admin_password" class="form-label fw-medium">Admin Password</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="bi bi-key"></i></span>
                                        <input type="password" class="form-control" id="admin_password" name="password" placeholder="••••••••" required>
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-dark w-100 rounded-pill py-2 fw-semibold">
                                    <i class="bi bi-shield-lock-fill me-1"></i> Login as Administrator
                                </button>
                            </form>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
