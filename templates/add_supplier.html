{% extends "base.html" %}

{% block title %}Add Supplier - Business Supplier & Purchase Management System{% endblock %}

{% block content %}
<div class="container py-3">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="card card-custom p-4 shadow-lg">
                <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                    <h3 class="fw-bold text-dark mb-0">
                        <i class="bi bi-person-plus-fill text-indigo me-2"></i>Add New Supplier
                    </h3>
                    <a href="{{ url_for('suppliers') }}" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
                        <i class="bi bi-arrow-left me-1"></i> Back to Suppliers
                    </a>
                </div>

                <form action="{{ url_for('add_supplier') }}" method="POST">
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="supplier_name" class="form-label fw-semibold">Supplier Name (Contact Person) <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="supplier_name" name="supplier_name" placeholder="e.g. Rajesh Sharma" required>
                        </div>
                        <div class="col-md-6">
                            <label for="company_name" class="form-label fw-semibold">Company Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="company_name" name="company_name" placeholder="e.g. Apex Global Traders" required>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="phone" class="form-label fw-semibold">Phone Number <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="phone" name="phone" placeholder="e.g. +91 9876543210" required>
                        </div>
                        <div class="col-md-6">
                            <label for="email" class="form-label fw-semibold">Email Address <span class="text-danger">*</span></label>
                            <input type="email" class="form-control" id="email" name="email" placeholder="e.g. supplier@company.com" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="address" class="form-label fw-semibold">Address</label>
                        <textarea class="form-control" id="address" name="address" rows="3" placeholder="Enter complete business address..."></textarea>
                    </div>

                    <div class="mb-4">
                        <label for="status" class="form-label fw-semibold">Supplier Status</label>
                        <select class="form-select" id="status" name="status">
                            <option value="Active" selected>Active</option>
                            <option value="Inactive">Inactive</option>
                        </select>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('suppliers') }}" class="btn btn-light px-4 fw-semibold">Cancel</a>
                        <button type="submit" class="btn btn-mint px-4 fw-semibold">
                            <i class="bi bi-check-circle-fill me-1"></i> Save Supplier
                        </button>
                    </div>
                </form>
            </div>

        </div>
    </div>
</div>
{% endblock %}
