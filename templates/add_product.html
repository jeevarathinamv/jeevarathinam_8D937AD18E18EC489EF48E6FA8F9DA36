{% extends "base.html" %}

{% block title %}Add Product - Business Supplier & Purchase Management System{% endblock %}

{% block content %}
<div class="container py-3">
    <div class="row justify-content-center">
        <div class="col-lg-8">

            <div class="card card-custom p-4 shadow-lg">
                <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
                    <h3 class="fw-bold text-dark mb-0">
                        <i class="bi bi-box-seam text-indigo me-2"></i>Add New Product
                    </h3>
                    <a href="{{ url_for('products') }}" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
                        <i class="bi bi-arrow-left me-1"></i> Back to Products
                    </a>
                </div>

                <form action="{{ url_for('add_product') }}" method="POST">
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="product_name" class="form-label fw-semibold">Product Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="product_name" name="product_name" placeholder="e.g. Ergonomic Office Chair" required>
                        </div>
                        <div class="col-md-6">
                            <label for="product_code" class="form-label fw-semibold">Product Code / SKU <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="product_code" name="product_code" placeholder="e.g. PROD-101" required>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label for="category" class="form-label fw-semibold">Category <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="category" name="category" placeholder="e.g. Furniture, Electronics, Hardware" required>
                        </div>
                        <div class="col-md-6">
                            <label for="purchase_price" class="form-label fw-semibold">Default Purchase Price (₹) <span class="text-danger">*</span></label>
                            <input type="number" step="0.01" min="0" class="form-control" id="purchase_price" name="purchase_price" placeholder="0.00" required>
                        </div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label for="current_stock" class="form-label fw-semibold">Initial Current Stock <span class="text-danger">*</span></label>
                            <input type="number" min="0" class="form-control" id="current_stock" name="current_stock" value="0" required>
                        </div>
                        <div class="col-md-6">
                            <label for="min_stock_level" class="form-label fw-semibold">Minimum Stock Level (Reorder Threshold) <span class="text-danger">*</span></label>
                            <input type="number" min="0" class="form-control" id="min_stock_level" name="min_stock_level" value="5" required>
                            <div class="form-text">Triggers Low Stock warning when stock reaches or falls below this number.</div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2">
                        <a href="{{ url_for('products') }}" class="btn btn-light px-4 fw-semibold">Cancel</a>
                        <button type="submit" class="btn btn-mint px-4 fw-semibold">
                            <i class="bi bi-check-circle-fill me-1"></i> Save Product
                        </button>
                    </div>
                </form>
            </div>

        </div>
    </div>
</div>
{% endblock %}
