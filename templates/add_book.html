{% extends "base.html" %}

{% block title %}Add Book - Library System{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="navbar-custom text-white p-4">
                    <h3 class="fw-bold mb-0"><i class="bi bi-journal-plus text-warning me-2"></i> Add New Book</h3>
                    <p class="small text-white-50 mb-0">Enter details to add a new book to the library repository</p>
                </div>
                <div class="card-body p-4 p-md-5">
                    <form action="{{ url_for('add_book') }}" method="POST">
                        <div class="mb-3">
                            <label for="book_name" class="form-label fw-semibold">Book Name</label>
                            <input type="text" class="form-control" id="book_name" name="book_name" placeholder="e.g. Python Programming" required>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="author_name" class="form-label fw-semibold">Author Name</label>
                                <input type="text" class="form-control" id="author_name" name="author_name" placeholder="e.g. John Zelle" required>
                            </div>
                            <div class="col-md-6">
                                <label for="isbn" class="form-label fw-semibold">ISBN</label>
                                <input type="text" class="form-control" id="isbn" name="isbn" placeholder="e.g. 978-1590282410" required>
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label for="category" class="form-label fw-semibold">Category</label>
                                <input type="text" class="form-control" id="category" name="category" placeholder="e.g. Computer Science" required>
                            </div>
                            <div class="col-md-6">
                                <label for="total_copies" class="form-label fw-semibold">Total Copies</label>
                                <input type="number" class="form-control" id="total_copies" name="total_copies" min="1" value="5" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="description" class="form-label fw-semibold">Description</label>
                            <textarea class="form-control" id="description" name="description" rows="3" placeholder="Brief summary of the book content..."></textarea>
                        </div>

                        <div class="d-flex justify-content-between align-items-center">
                            <a href="{{ url_for('manage_books') }}" class="btn btn-outline-secondary rounded-pill px-4">Cancel</a>
                            <button type="submit" class="btn btn-orange rounded-pill px-4 fw-bold shadow-sm">
                                <i class="bi bi-check-circle me-1"></i> Add Book
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
