{% extends "base.html" %}

{% block title %}Add New Book - College Library System{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">
            <div class="card border-0 shadow-lg rounded-3">
                <div class="card-header card-header-royal py-3">
                    <h5 class="fw-bold mb-0 text-white"><i class="bi bi-plus-circle me-2 text-warning"></i>Add New Library Book</h5>
                </div>
                <div class="card-body p-4 p-md-5">
                    <form action="{{ url_for('add_book') }}" method="POST">
                        <div class="mb-3">
                            <label for="book_name" class="form-label fw-semibold">Book Name / Title</label>
                            <input type="text" class="form-control" id="book_name" name="book_name" placeholder="e.g. Master in Python Programming" required>
                        </div>

                        <div class="mb-3">
                            <label for="author_name" class="form-label fw-semibold">Author Name</label>
                            <input type="text" class="form-control" id="author_name" name="author_name" placeholder="e.g. Dr. A. P. J. Abdul Kalam" required>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6 mb-3 mb-md-0">
                                <label for="isbn" class="form-label fw-semibold">ISBN Code</label>
                                <input type="text" class="form-control" id="isbn" name="isbn" placeholder="e.g. 978-0132350884" required>
                            </div>
                            <div class="col-md-6">
                                <label for="category" class="form-label fw-semibold">Category</label>
                                <select class="form-select" id="category" name="category" required>
                                    <option value="" disabled selected>Select Category</option>
                                    {% for cat in categories %}
                                        <option value="{{ cat }}">{{ cat }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="total_copies" class="form-label fw-semibold">Total Copies</label>
                            <input type="number" class="form-control" id="total_copies" name="total_copies" min="1" value="1" required>
                            <div class="form-text">Available copies will automatically be set equal to Total Copies.</div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                            <a href="{{ url_for('manage_books') }}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Cancel</a>
                            <button type="submit" class="btn btn-orange fw-bold px-4"><i class="bi bi-check-circle me-1"></i> Add Book</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
