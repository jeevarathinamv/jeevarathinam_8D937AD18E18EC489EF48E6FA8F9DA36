{% extends 'base.html' %}

{% block title %}Submit Grievance - College Student Grievance Portal{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card card-custom p-4 p-md-5">
                <div class="d-flex align-items-center mb-4">
                    <div class="icon-box-cyan me-3" style="width:50px; height:50px; font-size:1.5rem;">
                        <i class="bi bi-pencil-square"></i>
                    </div>
                    <div>
                        <h3 class="fw-bold text-white mb-0">Submit New Grievance</h3>
                        <p class="text-muted small mb-0">Provide details about your complaint or query for official review.</p>
                    </div>
                </div>

                <form action="{{ url_for('submit_grievance') }}" method="POST">
                    <!-- Category Selection -->
                    <div class="mb-3">
                        <label for="category" class="form-label text-light fw-medium"><i class="bi bi-tag me-1 text-info"></i> Grievance Category</label>
                        <select class="form-select form-select-custom py-2" id="category" name="category" required>
                            <option value="" disabled selected>Select appropriate category</option>
                            <option value="Academic">Academic (Exams, Faculty, Syllabus, Classes)</option>
                            <option value="Fees">Fees (Payments, Fine, Receipt, Refunds)</option>
                            <option value="Hostel">Hostel (Maintenance, Mess, Room, Water/Electricity)</option>
                            <option value="Transport">Transport (Bus Schedule, Routes, Driver, Pass)</option>
                            <option value="Lab">Lab & IT (Lab Equipment, Wi-Fi, Computers, Software)</option>
                            <option value="Other">Other (General Administration, Library, Campus)</option>
                        </select>
                    </div>

                    <!-- Subject -->
                    <div class="mb-3">
                        <label for="subject" class="form-label text-light fw-medium"><i class="bi bi-chat-left-text me-1 text-info"></i> Subject / Brief Title</label>
                        <input type="text" class="form-control form-control-custom py-2" id="subject" name="subject" placeholder="e.g. Wi-Fi Connectivity Issue in Block B" required maxlength="200">
                    </div>

                    <!-- Detailed Description -->
                    <div class="mb-4">
                        <label for="description" class="form-label text-light fw-medium"><i class="bi bi-file-text me-1 text-info"></i> Detailed Grievance Description</label>
                        <textarea class="form-control form-control-custom" id="description" name="description" rows="6" placeholder="Describe your grievance clearly including date, location, or concerned details..." required></textarea>
                    </div>

                    <div class="d-flex justify-content-between align-items-center">
                        <a href="{{ url_for('student_dashboard') }}" class="btn btn-outline-cyan px-4"><i class="bi bi-arrow-left me-1"></i> Cancel</a>
                        <button type="submit" class="btn btn-cyan px-4 py-2 fs-6">
                            <i class="bi bi-send me-1"></i> Submit Grievance
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
