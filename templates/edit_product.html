{% extends 'base.html' %}

{% block title %}Edit Product - Small Business System{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-7">
        <div class="card shadow-lg">
            <div class="card-header-custom">
                <h4 class="mb-0"><i class="bi bi-pencil-square me-2"></i> Edit Product Details</h4>
            </div>
            <div class="card-body p-4 bg-white">
                <form action="{{ url_for('edit_product', product_id=product.id) }}" method="POST">
                    <div class="row mb-3">
                        <div class="col-md-8">
                            <label for="name" class="form-label fw-semibold">Product Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="name" name="name" value="{{ product.name }}" required>
                        </div>
                        <div class="col-md-4">
                            <label for="product_code" class="form-label fw-semibold">Product Code <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="product_code" name="product_code" value="{{ product.product_code }}" required>
                        </div>
                    </div>

                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="category" class="form-label fw-semibold">Category <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="category" name="category" value="{{ product.category }}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="selling_price" class="form-label fw-semibold">Selling Price (₹) <span class="text-danger">*</span></label>
                            <input type="number" step="0.01" min="0" class="form-control" id="selling_price" name="selling_price" value="{{ product.selling_price }}" required>
                        </div>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label for="available_stock" class="form-label fw-semibold">Available Quantity <span class="text-danger">*</span></label>
                            <input type="number" min="0" class="form-control" id="available_stock" name="available_stock" value="{{ product.available_stock }}" required>
                        </div>
                        <div class="col-md-6">
                            <label for="min_stock_level" class="form-label fw-semibold">Minimum Stock Alert Level <span class="text-danger">*</span></label>
                            <input type="number" min="1" class="form-control" id="min_stock_level" name="min_stock_level" value="{{ product.min_stock_level }}" required>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center">
                        <a href="{{ url_for('products') }}" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left me-1"></i> Cancel
                        </a>
                        <button type="submit" class="btn btn-royal">
                            <i class="bi bi-check-circle me-1"></i> Update Product
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
