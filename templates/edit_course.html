{% extends "base.html" %}

{% block title %}Edit Course - Admin Portal{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="bg-gradient-custom text-white text-center py-4 px-3">
                    <i class="bi bi-pencil-square fs-1 text-warning mb-2 d-block"></i>
                    <h3 class="fw-bold mb-0">Edit Course Details</h3>
                    <p class="small text-white-50 mb-0">Update course metadata and credit points</p>
                </div>
                <div class="card-body p-4 p-md-5">
                    <form action="{{ url_for('edit_course', course_id=course.id) }}" method="POST">
                        <div class="mb-3">
                            <label for="course_name" class="form-label fw-semibold">Course Name</label>
                            <input type="text" class="form-control" id="course_name" name="course_name" value="{{ course.course_name }}" required>
                        </div>

                        <div class="mb-3">
                            <label for="course_code" class="form-label fw-semibold">Course Code</label>
                            <input type="text" class="form-control" id="course_code" name="course_code" value="{{ course.course_code }}" required>
                        </div>

                        <div class="mb-3">
                            <label for="department" class="form-label fw-semibold">Department</label>
                            <select class="form-select" id="department" name="department" required>
                                <option value="Computer Applications (MCA)" {% if course.department == 'Computer Applications (MCA)' %}selected{% endif %}>Computer Applications (MCA)</option>
                                <option value="Computer Science & Engineering" {% if course.department == 'Computer Science & Engineering' %}selected{% endif %}>Computer Science & Engineering</option>
                                <option value="Information Technology" {% if course.department == 'Information Technology' %}selected{% endif %}>Information Technology</option>
                                <option value="Electrical & Electronics" {% if course.department == 'Electrical & Electronics' %}selected{% endif %}>Electrical & Electronics</option>
                                <option value="Mechanical Engineering" {% if course.department == 'Mechanical Engineering' %}selected{% endif %}>Mechanical Engineering</option>
                            </select>
                        </div>

                        <div class="row g-2 mb-3">
                            <div class="col-md-4">
                                <label for="semester" class="form-label fw-semibold">Semester</label>
                                <select class="form-select" id="semester" name="semester" required>
                                    <option value="1" {% if course.semester == 1 %}selected{% endif %}>Semester 1</option>
                                    <option value="2" {% if course.semester == 2 %}selected{% endif %}>Semester 2</option>
                                    <option value="3" {% if course.semester == 3 %}selected{% endif %}>Semester 3</option>
                                    <option value="4" {% if course.semester == 4 %}selected{% endif %}>Semester 4</option>
                                    <option value="5" {% if course.semester == 5 %}selected{% endif %}>Semester 5</option>
                                    <option value="6" {% if course.semester == 6 %}selected{% endif %}>Semester 6</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label for="course_type" class="form-label fw-semibold">Course Type</label>
                                <select class="form-select" id="course_type" name="course_type" required>
                                    <option value="Core" {% if course.course_type == 'Core' %}selected{% endif %}>Core</option>
                                    <option value="Elective" {% if course.course_type == 'Elective' %}selected{% endif %}>Elective</option>
                                    <option value="Practical" {% if course.course_type == 'Practical' %}selected{% endif %}>Practical</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label for="credits" class="form-label fw-semibold">Credits</label>
                                <input type="number" class="form-control" id="credits" name="credits" min="1" max="10" value="{{ course.credits }}" required>
                            </div>
                        </div>

                        <div class="d-flex gap-2 pt-3">
                            <a href="{{ url_for('manage_courses') }}" class="btn btn-outline-secondary rounded-pill w-50 py-2">Cancel</a>
                            <button type="submit" class="btn btn-purple rounded-pill w-50 py-2 fw-bold shadow-sm">
                                <i class="bi bi-check-circle-fill me-1"></i> Update Course
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
