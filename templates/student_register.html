{% extends "base.html" %}

{% block title %}Student Registration - Alumni Mentorship Portal{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
        <div class="card card-custom shadow-lg">
            <div class="card-header-gradient text-center py-4">
                <h3 class="fw-bold mb-1"><i class="bi bi-mortarboard-fill me-2"></i>Student Registration</h3>
                <p class="small mb-0 opacity-90">Create an account to connect with alumni mentors</p>
            </div>
            <div class="card-body p-4">
                <form action="{{ url_for('student_register') }}" method="POST">
                    <div class="mb-3">
                        <label for="name" class="form-label fw-semibold text-dark"><i class="bi bi-person me-1 text-primary"></i> Full Name</label>
                        <input type="text" class="form-control" id="name" name="name" placeholder="Enter your full name" required>
                    </div>

                    <div class="mb-3">
                        <label for="register_number" class="form-label fw-semibold text-dark"><i class="bi bi-card-heading me-1 text-purple"></i> Register Number</label>
                        <input type="text" class="form-control" id="register_number" name="register_number" placeholder="e.g. 21101001" required>
                    </div>

                    <div class="mb-3">
                        <label for="department" class="form-label fw-semibold text-dark"><i class="bi bi-building me-1 text-pink"></i> Department</label>
                        <select class="form-select" id="department" name="department" required>
                            <option value="" disabled selected>Select your Department</option>
                            <option value="Computer Science & Engineering">Computer Science & Engineering</option>
                            <option value="Information Technology">Information Technology</option>
                            <option value="Electronics & Communication">Electronics & Communication</option>
                            <option value="Mechanical Engineering">Mechanical Engineering</option>
                            <option value="Civil Engineering">Civil Engineering</option>
                            <option value="Electrical Engineering">Electrical Engineering</option>
                            <option value="Management Studies (MBA)">Management Studies (MBA)</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold text-dark"><i class="bi bi-envelope me-1 text-primary"></i> Email Address</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="student@university.edu" required>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold text-dark"><i class="bi bi-lock me-1 text-purple"></i> Password</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Create a strong password" required>
                    </div>

                    <button type="submit" class="btn btn-gradient-primary w-100 py-2 fs-5 fw-bold mb-3">
                        <i class="bi bi-check-circle-fill me-2"></i>Register Student Account
                    </button>

                    <div class="text-center pt-2 border-top">
                        <p class="mb-0 text-muted">Already registered?
                            <a href="{{ url_for('student_login') }}" class="fw-bold text-purple text-decoration-none">Login Here</a>
                        </p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
